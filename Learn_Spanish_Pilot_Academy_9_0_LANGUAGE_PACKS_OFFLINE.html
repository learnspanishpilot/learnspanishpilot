uel to the fire."},{"es":"La noticia cayó como un jarro de agua fría.","en":"The news came as a cold shower."},{"es":"El informe pone el dedo en la llaga.","en":"The report hits a sore point."},{"es":"Es una cuestión que da mucho que hablar.","en":"It's an issue that sparks a lot of discussion."},{"es":"No todos interpretan la ironía de la misma manera.","en":"Not everyone interprets irony in the same way."},{"es":"La expresión resulta demasiado coloquial para este contexto.","en":"The expression is too informal for this context."}],"challenge":{"q":"¿Qué significa «No conviene echar más leña al fuego.» en inglés?","options":["The proposal opened the door to new initiatives.","The debate reached a deadlock.","It's best not to add fuel to the fire."],"correct":2,"why":"No conviene echar más leña al fuego. — It's best not to add fuel to the fire."},"write":"Escribe una frase original relacionada con «metáfora y registro».","model":"La propuesta abrió la puerta a nuevas iniciativas.","en":{"title":"Metaphor and Register","goal":"Learn to communicate about metaphor and register through practical Spanish sentences.","grammar":"Interpret figurative language and adapt the register.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about metaphor and register. Use the model for inspiration."}},{"id":"c1-12","level":"C1","title":"Debate académico","goal":"Practicar expresiones útiles sobre «debate académico».","grammar":"Formula hipótesis, limitaciones e implicaciones.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El estudio parte de una hipótesis verificable.","en":"The study begins with a testable hypothesis."},{"es":"La muestra no permite generalizar los resultados.","en":"The sample does not allow the results to be generalised."},{"es":"Sería conveniente replicar el experimento.","en":"It would be advisable to replicate the experiment."},{"es":"La interpretación exige tener en cuenta el contexto.","en":"Interpretation requires taking the context into account."},{"es":"El marco teórico condiciona las preguntas de investigación.","en":"The theoretical framework shapes the research questions."},{"es":"El hallazgo abre nuevas líneas de estudio.","en":"The finding opens up new lines of research."},{"es":"Las conclusiones deben leerse con cautela.","en":"The conclusions should be read with caution."},{"es":"Quedan pendientes varias cuestiones de fondo.","en":"Several fundamental questions remain unresolved."}],"challenge":{"q":"¿Qué significa «Sería conveniente replicar el experimento.» en inglés?","options":["The study begins with a testable hypothesis.","The sample does not allow the results to be generalised.","It would be advisable to replicate the experiment."],"correct":2,"why":"Sería conveniente replicar el experimento. — It would be advisable to replicate the experiment."},"write":"Escribe una frase original relacionada con «debate académico».","model":"El estudio parte de una hipótesis verificable.","en":{"title":"Academic Discussion","goal":"Learn to communicate about academic discussion through practical Spanish sentences.","grammar":"Frame hypotheses, limitations and implications.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about academic discussion. Use the model for inspiration."}},{"id":"c1-13","level":"C1","title":"Persuasión y retórica","goal":"Practicar expresiones útiles sobre «persuasión y retórica».","grammar":"Reconoce la persuasión y el encuadre retórico.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La pregunta contiene una premisa discutible.","en":"The question contains a questionable premise."},{"es":"El discurso apela a las emociones del público.","en":"The speech appeals to the audience's emotions."},{"es":"La repetición refuerza la idea principal.","en":"Repetition reinforces the main idea."},{"es":"El ejemplo ilustra el argumento, pero no lo demuestra.","en":"The example illustrates the argument, but doesn't prove it."},{"es":"La conclusión no se desprende necesariamente de las premisas.","en":"The conclusion doesn't necessarily follow from the premises."},{"es":"El autor recurre a una falsa dicotomía.","en":"The author relies on a false dichotomy."},{"es":"La comparación simplifica excesivamente el asunto.","en":"The comparison oversimplifies the issue."},{"es":"El tono irónico cambia el efecto del mensaje.","en":"The ironic tone changes the effect of the message."}],"challenge":{"q":"¿Qué significa «La repetición refuerza la idea principal.» en inglés?","options":["The question contains a questionable premise.","The speech appeals to the audience's emotions.","Repetition reinforces the main idea."],"correct":2,"why":"La repetición refuerza la idea principal. — Repetition reinforces the main idea."},"write":"Escribe una frase original relacionada con «persuasión y retórica».","model":"La pregunta contiene una premisa discutible.","en":{"title":"Persuasion and Rhetoric","goal":"Learn to communicate about persuasion and rhetoric through practical Spanish sentences.","grammar":"Recognise persuasion and rhetorical framing.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about persuasion and rhetoric. Use the model for inspiration."}},{"id":"c1-14","level":"C1","title":"Políticas públicas y sociedad","goal":"Practicar expresiones útiles sobre «políticas públicas y sociedad».","grammar":"Evalúa costes y beneficios de políticas públicas con precisión.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La medida pretende reducir la desigualdad.","en":"The measure aims to reduce inequality."},{"es":"Su aplicación dependerá de los recursos disponibles.","en":"Its implementation will depend on available resources."},{"es":"Los beneficios previstos deben contrastarse con los costes.","en":"The expected benefits must be weighed against the costs."},{"es":"La propuesta ha suscitado un amplio debate.","en":"The proposal has sparked widespread debate."},{"es":"No existe una solución exenta de inconvenientes.","en":"There is no solution without drawbacks."},{"es":"Es preciso establecer criterios transparentes.","en":"Clear criteria need to be established."},{"es":"La evaluación debería incluir efectos no deseados.","en":"The evaluation should include unintended effects."},{"es":"El consenso exige reconocer intereses divergentes.","en":"Consensus requires acknowledging differing interests."}],"challenge":{"q":"¿Qué significa «Los beneficios previstos deben contrastarse con los costes.» en inglés?","options":["The measure aims to reduce inequality.","Its implementation will depend on available resources.","The expected benefits must be weighed against the costs."],"correct":2,"why":"Los beneficios previstos deben contrastarse con los costes. — The expected benefits must be weighed against the costs."},"write":"Escribe una frase original relacionada con «políticas públicas y sociedad».","model":"La medida pretende reducir la desigualdad.","en":{"title":"Public Policy and Society","goal":"Learn to communicate about public policy and society through practical Spanish sentences.","grammar":"Evaluate policy trade-offs with precision.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about public policy and society. Use the model for inspiration."}},{"id":"c1-15","level":"C1","title":"Análisis literario","goal":"Practicar expresiones útiles sobre «análisis literario».","grammar":"Analiza el estilo, los símbolos y la voz narrativa.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La voz narrativa combina distancia y cercanía.","en":"The narrative voice combines detachment and intimacy."},{"es":"El símbolo admite varias lecturas posibles.","en":"The symbol allows for several possible interpretations."},{"es":"La estructura fragmentaria refuerza la incertidumbre.","en":"The fragmented structure reinforces uncertainty."},{"es":"El autor juega con las expectativas del lector.","en":"The author plays with the reader's expectations."},{"es":"La escena anticipa el conflicto posterior.","en":"The scene foreshadows the later conflict."},{"es":"La ambigüedad es deliberada, no accidental.","en":"The ambiguity is deliberate, not accidental."},{"es":"El desenlace reinterpreta los acontecimientos anteriores.","en":"The ending reinterprets earlier events."},{"es":"El estilo sobrio contrasta con la intensidad emocional.","en":"The restrained style contrasts with the emotional intensity."}],"challenge":{"q":"¿Qué significa «La estructura fragmentaria refuerza la incertidumbre.» en inglés?","options":["The narrative voice combines detachment and intimacy.","The symbol allows for several possible interpretations.","The fragmented structure reinforces uncertainty."],"correct":2,"why":"La estructura fragmentaria refuerza la incertidumbre. — The fragmented structure reinforces uncertainty."},"write":"Escribe una frase original relacionada con «análisis literario».","model":"La voz narrativa combina distancia y cercanía.","en":{"title":"Literary Analysis","goal":"Learn to communicate about literary analysis through practical Spanish sentences.","grammar":"Discuss style, symbols and narrative voice.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about literary analysis. Use the model for inspiration."}},{"id":"c1-16","level":"C1","title":"Mediar entre posturas","goal":"Practicar expresiones útiles sobre «mediar entre posturas».","grammar":"Resume posturas enfrentadas con imparcialidad.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Ambas partes comparten una preocupación de fondo.","en":"Both sides share an underlying concern."},{"es":"La discrepancia se centra en los medios, no en el fin.","en":"The disagreement centres on the means, not the end."},{"es":"Conviene reformular cada postura sin caricaturizarla.","en":"It's worth restating each position without caricaturing it."},{"es":"Una posible vía de acuerdo sería establecer prioridades.","en":"One possible route to agreement would be to set priorities."},{"es":"El desacuerdo no impide reconocer puntos comunes.","en":"Disagreement doesn't prevent us from acknowledging common ground."},{"es":"La propuesta responde solo parcialmente a la objeción.","en":"The proposal only partly addresses the objection."},{"es":"Habría que aclarar qué entiende cada parte por justicia.","en":"We should clarify what each side means by justice."},{"es":"La mediación requiere escucha y precisión.","en":"Mediation requires listening and precision."}],"challenge":{"q":"¿Qué significa «Conviene reformular cada postura sin caricaturizarla.» en inglés?","options":["Both sides share an underlying concern.","The disagreement centres on the means, not the end.","It's worth restating each position without caricaturing it."],"correct":2,"why":"Conviene reformular cada postura sin caricaturizarla. — It's worth restating each position without caricaturing it."},"write":"Escribe una frase original relacionada con «mediar entre posturas».","model":"Ambas partes comparten una preocupación de fondo.","en":{"title":"Mediating Different Views","goal":"Learn to communicate about mediating different views through practical Spanish sentences.","grammar":"Summarise opposing positions fairly.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about mediating different views. Use the model for inspiration."}},{"id":"c2-7","level":"C2","title":"Implicaturas y presuposiciones","goal":"Practicar expresiones útiles sobre «implicaturas y presuposiciones».","grammar":"Interpreta lo que se da a entender sin decirlo.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Lo que calla el texto es tan relevante como lo que afirma.","en":"What the text leaves unsaid is as relevant as what it states."},{"es":"La pregunta da por sentado algo que no está probado.","en":"The question takes for granted something that hasn't been proven."},{"es":"La ironía depende de un conocimiento compartido.","en":"Irony depends on shared knowledge."},{"es":"La aparente cortesía encubre una crítica.","en":"The apparent politeness conceals criticism."},{"es":"El hablante insinúa una objeción sin formularla.","en":"The speaker hints at an objection without stating it."},{"es":"La elección del adverbio altera la presuposición.","en":"The choice of adverb changes the presupposition."},{"es":"El silencio puede interpretarse de varias maneras.","en":"Silence can be interpreted in several ways."},{"es":"El sentido implícito cambia según el contexto.","en":"The implied meaning changes with the context."}],"challenge":{"q":"¿Qué significa «La ironía depende de un conocimiento compartido.» en inglés?","options":["What the text leaves unsaid is as relevant as what it states.","The question takes for granted something that hasn't been proven.","Irony depends on shared knowledge."],"correct":2,"why":"La ironía depende de un conocimiento compartido. — Irony depends on shared knowledge."},"write":"Escribe una frase original relacionada con «implicaturas y presuposiciones».","model":"Lo que calla el texto es tan relevante como lo que afirma.","en":{"title":"Implicature and Hidden Assumptions","goal":"Learn to communicate about implicature and hidden assumptions through practical Spanish sentences.","grammar":"Interpret what is implied rather than stated.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about implicature and hidden assumptions. Use the model for inspiration."}},{"id":"c2-8","level":"C2","title":"Precisión estilística","goal":"Practicar expresiones útiles sobre «precisión estilística».","grammar":"Elige términos exactos y evita ambigüedades no deseadas.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La distinción es sutil, pero conceptualmente decisiva.","en":"The distinction is subtle but conceptually decisive."},{"es":"El término empleado puede inducir a error.","en":"The term used may be misleading."},{"es":"Convendría sustituir esa palabra por otra más precisa.","en":"It would be better to replace that word with a more precise one."},{"es":"La frase resulta ambigua fuera de contexto.","en":"The sentence is ambiguous out of context."},{"es":"La formulación sugiere una certeza injustificada.","en":"The wording suggests unwarranted certainty."},{"es":"No es lo mismo constatar que demostrar.","en":"To observe something is not the same as proving it."},{"es":"El matiz se pierde en una traducción literal.","en":"The nuance is lost in a literal translation."},{"es":"La elección léxica cambia la interpretación.","en":"The lexical choice changes the interpretation."}],"challenge":{"q":"¿Qué significa «Convendría sustituir esa palabra por otra más precisa.» en inglés?","options":["The distinction is subtle but conceptually decisive.","The term used may be misleading.","It would be better to replace that word with a more precise one."],"correct":2,"why":"Convendría sustituir esa palabra por otra más precisa. — It would be better to replace that word with a more precise one."},"write":"Escribe una frase original relacionada con «precisión estilística».","model":"La distinción es sutil, pero conceptualmente decisiva.","en":{"title":"Stylistic Precision","goal":"Learn to communicate about stylistic precision through practical Spanish sentences.","grammar":"Choose exact terms and avoid unintended ambiguity.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about stylistic precision. Use the model for inspiration."}},{"id":"c2-9","level":"C2","title":"Ironía y sarcasmo avanzados","goal":"Practicar expresiones útiles sobre «ironía y sarcasmo avanzados».","grammar":"Distingue humor, ironía y sarcasmo.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Qué oportuno que se haya averiado justo hoy.","en":"How convenient that it broke down today, of all days."},{"es":"La frase parece un elogio, pero es una crítica.","en":"The sentence sounds like praise, but it's criticism."},{"es":"Su tono deja entrever una profunda decepción.","en":"His tone betrays deep disappointment."},{"es":"No todo comentario irónico es necesariamente sarcástico.","en":"Not every ironic comment is necessarily sarcastic."},{"es":"La exageración produce un efecto humorístico.","en":"The exaggeration creates a humorous effect."},{"es":"Lo dijo con una seriedad difícil de interpretar.","en":"She said it with a seriousness that was hard to interpret."},{"es":"La réplica invierte el sentido literal del mensaje.","en":"The reply reverses the literal meaning of the message."},{"es":"El contexto determina si la burla resulta ofensiva.","en":"The context determines whether the mockery is offensive."}],"challenge":{"q":"¿Qué significa «Su tono deja entrever una profunda decepción.» en inglés?","options":["How convenient that it broke down today, of all days.","The sentence sounds like praise, but it's criticism.","His tone betrays deep disappointment."],"correct":2,"why":"Su tono deja entrever una profunda decepción. — His tone betrays deep disappointment."},"write":"Escribe una frase original relacionada con «ironía y sarcasmo avanzados».","model":"Qué oportuno que se haya averiado justo hoy.","en":{"title":"Advanced Irony and Sarcasm","goal":"Learn to communicate about advanced irony and sarcasm through practical Spanish sentences.","grammar":"Differentiate humour, irony and sarcasm.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about advanced irony and sarcasm. Use the model for inspiration."}},{"id":"c2-10","level":"C2","title":"Variación dialectal","goal":"Practicar expresiones útiles sobre «variación dialectal».","grammar":"Compara usos regionales sin jerarquizarlos.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"En algunas regiones se prefiere «ustedes» a «vosotros».","en":"In some regions, “ustedes” is preferred to “vosotros”."},{"es":"La palabra «ordenador» equivale a «computadora».","en":"The word “ordenador” is equivalent to “computadora”."},{"es":"El voseo es habitual en varias zonas de América.","en":"Voseo is common in several parts of the Americas."},{"es":"Una misma expresión puede variar de significado.","en":"The same expression can vary in meaning."},{"es":"El registro depende de la comunidad y la situación.","en":"Register depends on the community and the situation."},{"es":"No existe una única pronunciación válida del español.","en":"There is no single valid Spanish pronunciation."},{"es":"La variación lingüística no implica falta de corrección.","en":"Linguistic variation doesn't imply incorrectness."},{"es":"Conviene reconocer las diferencias sin estereotipos.","en":"It's best to recognise differences without stereotypes."}],"challenge":{"q":"¿Qué significa «El voseo es habitual en varias zonas de América.» en inglés?","options":["In some regions, “ustedes” is preferred to “vosotros”.","The word “ordenador” is equivalent to “computadora”.","Voseo is common in several parts of the Americas."],"correct":2,"why":"El voseo es habitual en varias zonas de América. — Voseo is common in several parts of the Americas."},"write":"Escribe una frase original relacionada con «variación dialectal».","model":"En algunas regiones se prefiere «ustedes» a «vosotros».","en":{"title":"Dialectal Variation","goal":"Learn to communicate about dialectal variation through practical Spanish sentences.","grammar":"Compare regional usage without treating it as inferior.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about dialectal variation. Use the model for inspiration."}},{"id":"c2-11","level":"C2","title":"Reescritura de textos complejos","goal":"Practicar expresiones útiles sobre «reescritura de textos complejos».","grammar":"Reformula textos densos con fidelidad.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El original acumula varias subordinadas difíciles de seguir.","en":"The original contains several subordinate clauses that are hard to follow."},{"es":"La reformulación conserva el argumento central.","en":"The rewording preserves the central argument."},{"es":"Se han eliminado redundancias sin perder información.","en":"Redundancies have been removed without losing information."},{"es":"La nueva versión evita un tono innecesariamente categórico.","en":"The new version avoids an unnecessarily categorical tone."},{"es":"El resumen debe respetar las reservas del autor.","en":"The summary must respect the author's qualifications."},{"es":"Conviene explicitar la relación entre ambos párrafos.","en":"The relationship between the two paragraphs should be made explicit."},{"es":"La paráfrasis no debe introducir afirmaciones nuevas.","en":"The paraphrase mustn't introduce new claims."},{"es":"La precisión no está reñida con la claridad.","en":"Precision is not incompatible with clarity."}],"challenge":{"q":"¿Qué significa «Se han eliminado redundancias sin perder información.» en inglés?","options":["The original contains several subordinate clauses that are hard to follow.","The rewording preserves the central argument.","Redundancies have been removed without losing information."],"correct":2,"why":"Se han eliminado redundancias sin perder información. — Redundancies have been removed without losing information."},"write":"Escribe una frase original relacionada con «reescritura de textos complejos».","model":"El original acumula varias subordinadas difíciles de seguir.","en":{"title":"Complex Text Rewriting","goal":"Learn to communicate about complex text rewriting through practical Spanish sentences.","grammar":"Reformulate densely argued texts faithfully.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about complex text rewriting. Use the model for inspiration."}},{"id":"c2-12","level":"C2","title":"Registro jurídico y administrativo","goal":"Practicar expresiones útiles sobre «registro jurídico y administrativo».","grammar":"Interpreta con precisión fórmulas administrativas.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El plazo comienza a contar desde la notificación.","en":"The deadline starts running from notification."},{"es":"La resolución no prejuzga el fondo del asunto.","en":"The decision does not prejudge the merits of the case."},{"es":"La solicitud deberá presentarse por escrito.","en":"The application must be submitted in writing."},{"es":"Se entenderá desestimada a efectos del procedimiento.","en":"It will be deemed rejected for procedural purposes."},{"es":"La norma admite distintas interpretaciones razonables.","en":"The rule allows for different reasonable interpretations."},{"es":"Conviene diferenciar obligación de recomendación.","en":"It is important to distinguish an obligation from a recommendation."},{"es":"Sin perjuicio de lo anterior, cabe presentar alegaciones.","en":"Without prejudice to the above, representations may be submitted."},{"es":"La redacción exige cautela por sus implicaciones.","en":"The wording requires caution because of its implications."}],"challenge":{"q":"¿Qué significa «La solicitud deberá presentarse por escrito.» en inglés?","options":["The deadline starts running from notification.","The decision does not prejudge the merits of the case.","The application must be submitted in writing."],"correct":2,"why":"La solicitud deberá presentarse por escrito. — The application must be submitted in writing."},"write":"Escribe una frase original relacionada con «registro jurídico y administrativo».","model":"El plazo comienza a contar desde la notificación.","en":{"title":"Legal and Administrative Register","goal":"Learn to communicate about legal and administrative register through practical Spanish sentences.","grammar":"Interpret formal administrative wording precisely.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about legal and administrative register. Use the model for inspiration."}},{"id":"c2-13","level":"C2","title":"Debate ético y filosófico","goal":"Practicar expresiones útiles sobre «debate ético y filosófico».","grammar":"Construye argumentos filosóficos matizados.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La cuestión no se reduce a una alternativa binaria.","en":"The question cannot be reduced to a binary choice."},{"es":"Antes de responder, habría que definir los términos.","en":"Before answering, we should define the terms."},{"es":"El juicio moral depende en parte del contexto.","en":"Moral judgement depends partly on context."},{"es":"El argumento confunde posibilidad con necesidad.","en":"The argument confuses possibility with necessity."},{"es":"No toda consecuencia deseable justifica cualquier medio.","en":"Not every desirable consequence justifies any means."},{"es":"La objeción pone de relieve una tensión interna.","en":"The objection highlights an internal tension."},{"es":"El desacuerdo revela supuestos de partida diferentes.","en":"The disagreement reveals different underlying assumptions."},{"es":"La conclusión sigue siendo provisional.","en":"The conclusion remains provisional."}],"challenge":{"q":"¿Qué significa «El juicio moral depende en parte del contexto.» en inglés?","options":["The question cannot be reduced to a binary choice.","Before answering, we should define the terms.","Moral judgement depends partly on context."],"correct":2,"why":"El juicio moral depende en parte del contexto. — Moral judgement depends partly on context."},"write":"Escribe una frase original relacionada con «debate ético y filosófico».","model":"La cuestión no se reduce a una alternativa binaria.","en":{"title":"Ethical and Philosophical Debate","goal":"Learn to communicate about ethical and philosophical debate through practical Spanish sentences.","grammar":"Construct nuanced philosophical arguments.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about ethical and philosophical debate. Use the model for inspiration."}},{"id":"c2-14","level":"C2","title":"Humor, alusiones y cultura","goal":"Practicar expresiones útiles sobre «humor, alusiones y cultura».","grammar":"Descifra alusiones y humor ligado a la cultura.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El chiste pierde fuerza si se traduce palabra por palabra.","en":"The joke loses its impact if translated word for word."},{"es":"La alusión remite a un episodio histórico conocido.","en":"The allusion refers to a well-known historical episode."},{"es":"El doble sentido depende de la pronunciación.","en":"The double meaning depends on pronunciation."},{"es":"La referencia cultural puede pasar inadvertida.","en":"The cultural reference may go unnoticed."},{"es":"El narrador parodia una fórmula muy solemne.","en":"The narrator parodies a very solemn formula."},{"es":"La gracia está en la ruptura de expectativas.","en":"The humour lies in the subversion of expectations."},{"es":"El tono burlón no siempre implica desprecio.","en":"A mocking tone doesn't always imply contempt."},{"es":"Una explicación excesiva arruina el efecto cómico.","en":"Too much explanation ruins the comic effect."}],"challenge":{"q":"¿Qué significa «El doble sentido depende de la pronunciación.» en inglés?","options":["The joke loses its impact if translated word for word.","The allusion refers to a well-known historical episode.","The double meaning depends on pronunciation."],"correct":2,"why":"El doble sentido depende de la pronunciación. — The double meaning depends on pronunciation."},"write":"Escribe una frase original relacionada con «humor, alusiones y cultura».","model":"El chiste pierde fuerza si se traduce palabra por palabra.","en":{"title":"Humour, Allusion and Cultural Context","goal":"Learn to communicate about humour, allusion and cultural context through practical Spanish sentences.","grammar":"Decode allusions and culturally situated humour.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about humour, allusion and cultural context. Use the model for inspiration."}},{"id":"c2-15","level":"C2","title":"Análisis crítico del discurso","goal":"Practicar expresiones útiles sobre «análisis crítico del discurso».","grammar":"Analiza el encuadre y las elecciones ideológicas del lenguaje.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El encuadre presenta una opción como inevitable.","en":"The framing presents one option as inevitable."},{"es":"La voz pasiva difumina quién tomó la decisión.","en":"The passive voice obscures who made the decision."},{"es":"El texto selecciona unos hechos y omite otros.","en":"The text selects some facts and leaves out others."},{"es":"La etiqueta empleada condiciona la percepción pública.","en":"The label used shapes public perception."},{"es":"Una generalización sustituye a la evidencia concreta.","en":"A generalisation takes the place of concrete evidence."},{"es":"El argumento apela a una autoridad no identificada.","en":"The argument appeals to an unidentified authority."},{"es":"Hay que distinguir persuasión de demostración.","en":"We must distinguish persuasion from demonstration."},{"es":"La neutralidad aparente merece un análisis crítico.","en":"Apparent neutrality deserves critical scrutiny."}],"challenge":{"q":"¿Qué significa «El texto selecciona unos hechos y omite otros.» en inglés?","options":["The framing presents one option as inevitable.","The passive voice obscures who made the decision.","The text selects some facts and leaves out others."],"correct":2,"why":"El texto selecciona unos hechos y omite otros. — The text selects some facts and leaves out others."},"write":"Escribe una frase original relacionada con «análisis crítico del discurso».","model":"El encuadre presenta una opción como inevitable.","en":{"title":"Critical Discourse Analysis","goal":"Learn to communicate about critical discourse analysis through practical Spanish sentences.","grammar":"Analyse framing and ideological choices in language.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about critical discourse analysis. Use the model for inspiration."}},{"id":"c2-16","level":"C2","title":"Moderación y síntesis experta","goal":"Practicar expresiones útiles sobre «moderación y síntesis experta».","grammar":"Modera desacuerdos y sintetiza posiciones complejas.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Propongo separar los hechos de las valoraciones.","en":"I suggest separating facts from value judgements."},{"es":"Antes de avanzar, convendría precisar los puntos de acuerdo.","en":"Before moving on, we should clarify the points of agreement."},{"es":"La discrepancia se concentra en una premisa específica.","en":"The disagreement centres on a specific premise."},{"es":"Permítanme resumir los principales argumentos expuestos.","en":"Allow me to summarise the main arguments presented."},{"es":"No debemos atribuir a nadie una postura que no ha defendido.","en":"We mustn't attribute to anyone a position they haven't defended."},{"es":"Queda pendiente una cuestión que merece atención.","en":"One issue remains that deserves attention."},{"es":"La síntesis refleja los matices sin simplificarlos.","en":"The synthesis reflects the nuances without oversimplifying them."},{"es":"Podemos concluir sin forzar un consenso inexistente.","en":"We can conclude without forcing a consensus that doesn't exist."}],"challenge":{"q":"¿Qué significa «La discrepancia se concentra en una premisa específica.» en inglés?","options":["I suggest separating facts from value judgements.","Before moving on, we should clarify the points of agreement.","The disagreement centres on a specific premise."],"correct":2,"why":"La discrepancia se concentra en una premisa específica. — The disagreement centres on a specific premise."},"write":"Escribe una frase original relacionada con «moderación y síntesis experta».","model":"Propongo separar los hechos de las valoraciones.","en":{"title":"Expert Moderation and Synthesis","goal":"Learn to communicate about expert moderation and synthesis through practical Spanish sentences.","grammar":"Moderate disagreements and synthesise complex positions.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about expert moderation and synthesis. Use the model for inspiration."}}],"scenes":[{"level":"A1","title":"Primer encuentro","turns":[{"npc":"¡Hola! ¿Cómo te llamas?","options":["Me llamo Sara.","Tengo veinte euros.","Está a la derecha."],"correct":0,"reply":"¡Mucho gusto, Sara!","npcEn":"Hello! What's your name?","correctEn":"My name is Sara.","replyEn":"Nice to meet you, Sara!"},{"npc":"¿De dónde eres?","options":["Soy de Canadá.","Son las cinco.","Quiero una mesa."],"correct":0,"reply":"¡Qué interesante!","npcEn":"Where are you from?","correctEn":"I  verifiable methodology.","replyEn":"Rigorous analysis completed."}]},{"level":"A1","title":"Ordering at a café","turns":[{"npc":"Buenos días. ¿Qué desea tomar?","options":["Un café con leche, por favor.","Ayer fui al museo.","No tengo hermanos."],"correct":0,"reply":"Muy bien. ¿Algo más?","npcEn":"Good morning. What would you like to drink?","correctEn":"A coffee with milk, please.","replyEn":"Very good. Anything else?"},{"npc":"¿Quiere algo para comer?","options":["Gire a la izquierda.","Sí, una tostada, por favor.","Vivo en Canadá."],"correct":1,"reply":"Perfecto. Serán cinco euros.","npcEn":"Would you like something to eat?","correctEn":"Yes, some toast, please.","replyEn":"Perfect. That'll be five euros."},{"npc":"¿Algo más?","options":["Me he perdido.","¿A qué hora empieza?","No, gracias. La cuenta, por favor."],"correct":2,"reply":"Claro. ¡Que tenga un buen día!","npcEn":"Anything else?","correctEn":"No, thank you. The bill, please.","replyEn":"Of course. Have a nice day!"}]},{"level":"A2","title":"Arranging a weekend","turns":[{"npc":"¿Qué vas a hacer el sábado?","options":["Voy a visitar a mis amigos.","Me duele el pie.","Era muy tarde."],"correct":0,"reply":"¡Qué bien! ¿A qué hora?","npcEn":"What are you going to do on Saturday?","correctEn":"I'm going to visit my friends.","replyEn":"Great! What time?"},{"npc":"¿Podemos quedar a las seis?","options":["Ya había viajado.","Sí, me viene bien.","Me llamo Lucía."],"correct":1,"reply":"Genial. ¿Dónde quedamos?","npcEn":"Can we meet at six?","correctEn":"Yes, that works for me.","replyEn":"Great. Where shall we meet?"},{"npc":"¿Dónde quedamos?","options":["No creo que sea correcto.","Es evidente que sí.","Delante de la estación."],"correct":2,"reply":"Perfecto, ¡hasta el sábado!","npcEn":"Where shall we meet?","correctEn":"In front of the station.","replyEn":"Perfect, see you on Saturday!"}]},{"level":"B1","title":"A job interview","turns":[{"npc":"¿Qué experiencia tiene?","options":["Llevo tres años trabajando const STORAGE='learn-spanish-pilot-v2';
const oldStorage='hola-nexo-studio-v1';
const $=(s)=>document.querySelector(s);
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(a*100/b):0;
const rand=(a)=>a.slice().sort(()=>Math.random()-.5);
const norm=(s)=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ').toLowerCase();
const mini=(s)=>safe(String(s||'').slice(0,400));
const qs=(v)=>Number(v||0).toLocaleString('en-GB');
function defaults(){return {v:2,name:'Learner',channel:'Learn Spanish Pilot',theme:'dark',accent:'gold',collapsed:false,completed:{},stats:{},reviews:{},journals:{},videos:{},custom:[],avatarData:'',rate:.88,diagnostic:null,activities:[],scenarioStats:{},building:{},dictations:{},lastLesson:null}}
function loadState(){try{const cur=JSON.parse(localStorage.getItem(STORAGE)||'null');if(cur&&cur.v===2)return {...defaults(),...cur};const old=JSON.parse(localStorage.getItem(oldStorage)||'null');if(old&&old.v===1){let data={...defaults(),...old,v:2,channel:'Learn Spanish Pilot'};localStorage.setItem(STORAGE,JSON.stringify(data));return data}}catch(e){console.warn('Local storage unavailable',e)}return defaults()}
let state=loadState();
const ui={page:'home',level:'A1',lessonId:null,tab:'learn',search:'',quiz:null,build:null,dict:null,flip:false,cardIdx:0,revMode:'due',revIdx:0,revFlip:false,flashLevel:'all',flashUnit:'all',flashKind:'all',flashSessionKey:'',flashKeys:[],flashFinished:false,flashGrades:{},sceneIdx:0,turn:0,sceneAnswer:null,exam:null,showModel:false,mobile:false,recorder:null,stream:null,recordingUrl:null,recording:false};
let toastTimer=null;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){toast('Storage is unavailable or full. Please export a backup.');return false}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;$('#toasts').append(t);setTimeout(()=>t.remove(),3300)}
function allUnits(){return DATA.units.concat(state.custom)}
function byId(id){return allUnits().find(u=>u.id===id)}
function log(kind,unit){state.activities.unshift({at:new Date().toISOString(),kind,unit});state.activities=state.activities.slice(0,150)}
function bar(v){return `<div class="progress" aria-label="${Math.max(0,Math.min(100,v))} percent"><span style="width:${Math.max(0,Math.min(100,v))}%"></span></div>`}
function levelProgress(l){let ar=allUnits().filter(u=>u.level===l);return {done:ar.filter(u=>state.completed[u.id]).length,total:ar.length}}
function score(){let vs=Object.values(state.stats);return {lessons:Object.keys(state.completed).filter(id=>byId(id)).length,all:allUnits().length,answers:vs.reduce((a,b)=>a+(b.total||0),0),correct:vs.reduce((a,b)=>a+(b.correct||0),0),due:flashPool().filter(x=>!x.review||x.review.due<=Date.now()).length}}
function mark(unit,ok,kind='question'){let s=state.stats[unit]||{total:0,correct:0};s.total++;s.correct+=ok?1:0;state.stats[unit]=s;if(!ok)log('Review needed · '+kind,unit);save()}
function pushReview(key,known){let r=state.reviews[key]||{step:0,due:0};let intervals=[0,1,3,7,14,30];r.step=known?Math.min((r.step||0)+1,5):0;r.due=Date.now()+(known?intervals[r.step]*86400000:600000);state.reviews[key]=r;save()}
function flashPool(){return allUnits().flatMap(u=>{
 const cards=u.pairs.filter(p=>p&&p.es&&p.en).map((p,i)=>({key:u.id+':'+i,u,kind:'phrase',phrase:p,review:state.reviews[u.id+':'+i]||null}));
 for(const [kind,es,en] of [['goal',u.goal,u.en?.goal],['grammar',u.grammar,u.en?.grammar],['tip',u.tip,u.en?.tip]]){
  if(es&&en){const key=u.id+':'+kind;cards.push({key,u,kind,phrase:{es,en},review:state.reviews[key]||null})}
 }
 return cards;
})}
function focusUnit(){return byId(state.lastLesson)&&!state.completed[state.lastLesson]?byId(state.lastLesson):allUnits().find(u=>!state.completed[u.id])||allUnits()[0]}
function teacherImg(){return state.avatarData||TEACHER_SRC}
function nav(){const arr=[['home','◈','Flight deck'],['path','▦','Bilingual courses A1–C2'],['lab','✦','Practice lab'],['talk','◉','Conversations'],['flash','▧','Memory cards'],['exam','✓','Placement check'],['progress','▥','My progress'],['studio','◫','Creator studio'],['settings','⚙','Settings & backup']];return `<a class="brand" href="#" data-page="home"><img class="brand-logo" src="${LOGO_SRC}" alt="Learn Spanish Pilot logo"><span class="brandwords"><b>Learn Spanish<br>Pilot</b><small>YOUR SPANISH FLIGHT SCHOOL</small></span></a><div class="nav-label">LEARN</div>${arr.map(([id,ico,label])=>`<button type="button" class="nav-btn ${ui.page===id?'active':''}" data-page="${id}" title="${label}"><span class="nav-ico">${ico}</span><span class="navtext">${label}</span></button>`).join('')}<div class="sidefoot"><b>● Core lessons work offline</b>Practice is saved on this device. Online video links and some voice services need a connection.</div>`}
function topMarkup(){return `<div class="top-left"><button class="btn slim ghost" id="sidebar-toggle" aria-label="Toggle menu">☰</button><span class="pill"><span class="dot"></span> Offline-ready classroom</span></div><div class="top-right"><span class="pill">✦ ${safe(state.name)}</span><span class="level-chip">${ui.level}</span></div>`}
function pickPage(page){ui.page=page;ui.mobile=false;render();window.scrollTo({top:0,behavior:'instant'})}
function pickLesson(id,tab='learn'){if(!byId(id))return;ui.lessonId=id;state.lastLesson=id;ui.level=byId(id).level;ui.page='lesson';ui.tab=tab;ui.quiz=null;ui.build=null;ui.dict=null;ui.cardIdx=0;ui.flip=false;ui.showModel=false;save();render();window.scrollTo({top:0,behavior:'instant'})}
function home(){const m=score(),next=focusUnit();return `<div class="hero"><div><p class="kicker">WELCOME ABOARD · A1 TO C2</p><h1>Learn Spanish.<br><span style="color:#ffcd45">Take off with confidence.</span></h1><p>Real-world Spanish with your virtual teacher. Study a short lesson, listen, build sentences, speak aloud and track your journey.</p><div class="actions wrap"><button class="btn primary" data-open="${next.id}">▶ Continue: ${safe(next.en?.title||next.title)}</button><button class="btn" data-page="path">Explore bilingual courses</button></div></div><div class="teacher-frame"><img class="teacher-image" alt="Illustrated virtual Spanish teacher" src="${teacherImg()}"><div class="teacher-note">👋 ¡Hola! Ready for takeoff?</div></div></div>
<h2 class="h2">Your flight dashboard</h2><div class="cards four">
<div class="card"><div class="overline">Lessons cleared</div><div class="metric">${m.lessons}<span class="muted small"> / ${m.all}</span></div>${bar(pct(m.lessons,m.all))}</div>
<div class="card"><div class="overline">Practice answers</div><div class="metric">${qs(m.answers)}</div><div class="tiny">Automatic feedback after each answer</div></div>
<div class="card"><div class="overline">Answer accuracy</div><div class="metric">${m.answers?pct(m.correct,m.answers)+'%':'—'}</div><div class="tiny">Across completed practice questions</div></div>
<div class="card"><div class="overline">Cards for study</div><div class="metric">${qs(m.due)}</div><button class="btn slim" data-page="flash">Start memory review →</button></div></div>
<h2 class="h2">Your six destinations</h2><div class="cards">${DATA.levels.map(l=>{let p=levelProgress(l.id);return `<div class="card"><div class="row between"><span class="level-chip">${l.id}</span><span class="tiny">${p.done} / ${p.total} lessons</span></div><h3>${safe(l.name)}</h3><p>${safe(l.subtitle)}</p>${bar(pct(p.done,p.total))}<button class="btn slim" data-level="${l.id}">Open this level →</button></div>`}).join('')}</div><div class="note">This expanded bilingual learning library follows broad CEFR A1–C2 themes but is not an official or exhaustive CEFR course. Your progress and self-checks are not language certifications.</div>`}
function path(){const l=DATA.levels.find(x=>x.id===ui.level)||DATA.levels[0];let units=allUnits().filter(x=>x.level===ui.level&&(!ui.search||(`${x.title} ${x.goal} ${x.grammar} ${x.en?.title||''} ${x.en?.goal||''}`).toLowerCase().includes(ui.search.toLowerCase())));return `<div class="kicker">YOUR SPANISH FLIGHT MAP</div><h1 class="h1">Choose your next destination</h1><p class="lead">Six levels, ${allUnits().length} guided bilingual lessons, ${allUnits().reduce((n,u)=>n+u.pairs.length,0)} Spanish–English expressions, listening, speaking, sentence building and active recall.</p><div class="level-bar">${DATA.levels.map(x=>`<button class="level-button ${ui.level===x.id?'active':''}" data-level="${x.id}">${x.id} · ${safe(x.name)}</button>`).join('')}</div><div class="card section-sep"><div class="row between wrap"><div><span class="level-label">${l.id} ROUTE</span><h3 style="margin:5px 0">${safe(l.subtitle)}</h3><div class="muted small">${safe(l.target)}</div></div><div class="pill">${levelProgress(l.id).done}/${levelProgress(l.id).total} done</div></div>${bar(pct(levelProgress(l.id).done,levelProgress(l.id).total))}</div>

function lesson(){let u=byId(ui.lessonId);if(!u)return path();let names=[['learn','Learn'],['quiz','Quick check'],['build','Sentence builder'],['dict','Dictation'],['speak','Speaking'],['write','Writing']];let video=validYoutube(state.videos[u.id]);return `<button class="btn slim ghost" data-page="path">← Back to flight path</button><div class="row between wrap" style="margin-top:20px"><div class="kicker" style="margin:0">LEVEL ${u.level} · LESSON ${u.id.split('-').slice(-1).join('')}</div><span class="chip">${state.completed[u.id]?'✓ Lesson cleared':'Finish the quick check to clear this lesson'}</span></div><h1 class="h1" style="margin-top:9px">${safe(u.en?.title||u.title)}</h1><p class="lead"><b>${safe(u.title)}</b> · ${safe(u.en?.goal||u.goal)}</p>${video?`<a class="btn slim" target="_blank" rel="noopener noreferrer" href="${safe(video)}">▶ Watch linked YouTube lesson ↗</a>`:''}

function learn(u){return `<div class="cards two"><div class="card"><div class="overline">GRAMMAR & PATTERNS · ENGLISH EXPLANATION</div><h3 style="font-size:21px;margin-top:10px">${safe(u.en?.grammar||u.grammar)}</h3><p class="small muted">${safe(u.grammar)}</p><div class="callout"><b>Teacher tip</b><div class="muted small" style="margin-top:5px">${safe(u.en?.tip||u.tip)}</div></div><button class="btn primary" data-tab="quiz">Test what you learned →</button></div><div class="teacher-mini"><img src="${teacherImg()}" alt="Your Spanish teacher"><span>🎓 Listen · Repeat · Respond</span></div></div><h2 class="h2">Useful expressions <span class="muted small">(${u.pairs.length} · Español / English)</span></h2><p class="tiny" style="margin-top:-10px;margin-bottom:16px">Read the Spanish sentence on the left and its English meaning on the right. Press Listen to hear Spanish pronunciation.</p><div class="card">${u.pairs.map((p,i)=>`<div class="phrase"><div class="phrase-bilingual"><div class="phrase-lang"><span class="phrase-tag">${String(i+1).padStart(2,'0')} · ESPAÑOL</span><strong lang="es">${safe(p.es)}</strong></div><div class="phrase-lang phrase-en"><span class="phrase-tag">ENGLISH · MEANING</span><strong lang="en">${safe(p.en)}</strong></div></div><button class="btn slim listen-btn" data-say="${safe(p.es)}" aria-label="Hear Spanish expression ${i+1}">🔊 Listen</button></div>`).join('')}</div><div class="actions wrap" style="margin-top:16px"><button class="btn primary" data-tab="quiz">Quick check →</button><button class="btn" data-tab="build">Build a sentence →</button><button class="btn" data-tab="dict">Try dictation →</button></div>`}
function makeQuiz(u){let a=u.pairs.map((p,i)=>{let asSpanish=i%2===1;let options=rand([...(asSpanish?u.pairs.filter(x=>x!==p).map(x=>x.es):u.pairs.filter(x=>x!==p).map(x=>x.en))]).slice(0,3);let correct=asSpanish?p.es:p.en;let shuffled=rand([correct,...options]);return {q:asSpanish?`How do you say “${p.en}” in Spanish?`:`What does “${p.es}” mean?`,options:shuffled,correct:shuffled.indexOf(correct),why:`${p.es} — ${p.en}`,ref:u.id+':'+i}});a.push({...u.challenge,ref:null});return a}
function quiz(u){let q=ui.quiz;if(!q||q.id!==u.id)return `<div class="cards two"><div class="card"><div class="kicker">KNOWLEDGE CHECK</div><h2 class="h2" style="margin:0 0 12px">${u.pairs.length+1} practical questions</h2><p>Translate Spanish ↔ English and answer one grammar question. Score at least 80% to clear this lesson.</p><button class="btn primary" data-startquiz="${u.id}">▶ Start quiz</button></div><div class="card"><div class="overline">WHAT THIS TEST MEASURES</div><p>Recognition of the expressions taught in this unit. It does not assess spontaneous speaking or certify CEFR proficiency.</p>${bar(0)}</div></div>`;
if(q.index>=q.questions.length){let pass=pct(q.hits,q.questions.length)>=80;return `<div class="card"><div class="kicker">LESSON RESULT</div><div class="metric accent">${q.hits} / ${q.questions.length}</div><h2>${pass?'Flight cleared! ✈️':'Keep practising — you’re improving'}</h2><p>${pass?'Your progress has been saved. Explore another lesson or try speaking.':'Focus on the incorrect answers and try again.'}</p><div class="actions wrap"><button class="btn primary" data-startquiz="${u.id}">Try again</button><button class="btn" data-tab="learn">Back to examples</button><button class="btn" data-page="path">Choose next lesson</button></div></div>`}
let x=q.questions[q.index],ans=q.answered;return `<div class="card"><div class="row between"><span class="overline">QUESTION ${q.index+1} / ${q.questions.length}</span><span class="chip">${q.hits} correct</span></div>${bar(pct(q.index,q.questions.length))}<div class="bigquestion">${safe(x.q)}</div>${x.options.map((o,i)=>`<button class="choice ${ans!==null?(i===x.correct?'correct':i===ans?'wrong':''):''}" data-answer="${i}" ${ans!==null?'disabled':''}>${String.fromCharCode(65+i)} · ${safe(o)}</button>`).join('')}${ans!==null?`<div class="feedback ${ans===x.correct?'':'wrong'}"><b>${ans===x.correct?'✓ Correct':'✕ Not quite'}</b><div>${safe(x.why)}</div></div><button class="btn primary" data-nextquiz="1">${q.index===q.questions.length-1?'View results':'Next question →'}</button>`:''}</div>`}
function eligible(u){return u.pairs.map((p,i)=>({...p,index:i})).filter(p=>norm(p.es).split(' ').length>=3)}
function initBuild(u,index=0){let items=eligible(u);if(!items.length)return null;let p=items[index%items.length],words=p.es.replace(/[¿?¡!.,;:]/g,'').split(/\s+/).filter(Boolean);let order=words.map((w,i)=>({word:w,id:i}));let shuffled=rand(order);if(shuffled.every((x,i)=>x.id===i))shuffled=shuffled.slice().reverse();return {id:u.id,idx:index%items.length,p,available:shuffled,used:[],checked:null}}
function build(u){let b=ui.build;if(!b||b.id!==u.id){b=ui.build=initBuild(u)}if(!b)return '<div class="card">No suitable sentence in this lesson.</div>';return `<div class="cards two"><div class="card"><div class="overline">REBUILD THE SPANISH SENTENCE</div><div class="bigquestion">${safe(b.p.en)}</div><div class="muted small">Select words in the correct Spanish order.</div><div class="token-output">${b.used.map((x,i)=>`<button class="token" data-remove="${i}" ${b.checked!==null?'disabled':''}>${safe(x.word)} ×</button>`).join('')||'<span class="tiny">Your Spanish sentence goes here…</span>'}</div><div class="token-tray">${b.available.filter(x=>!b.used.some(y=>y.id===x.id)).map(x=>`<button class="token" data-add="${x.id}" ${b.checked!==null?'disabled':''}>${safe(x.word)}</button>`).join('')}</div><div class="actions wrap" style="margin-top:17px">${b.checked===null?`<button class="btn primary" data-checkbuild="1" ${b.used.length!==b.available.length?'disabled':''}>Check order</button><button class="btn" data-resetbuild="1">Reset</button>`:`<button class="btn primary" data-nextbuild="1">Another sentence →</button>`}</div>${b.checked!==null?`<div class="feedback ${b.checked?'':'wrong'}"><b>${b.checked?'✓ Well done!':'✕ Compare the word order'}</b><div>${safe(b.p.es)}</div></div>`:''}</div><div class="card"><div class="overline">SPEAK IT, TOO</div><h3>Listen to the complete sentence</h3><p>Build the order first, then listen and repeat it aloud.</p><button class="btn" data-say="${safe(b.p.es)}">🔊 Hear the sentence</button><div class="callout"><b>Progress</b><p>${(state.building[u.id]?.correct||0)} correct of ${(state.building[u.id]?.total||0)} attempts</p></div></div></div>`}
function initDict(u,index=0){let items=eligible(u);if(!items.length)return null;return {id:u.id,idx:index%items.length,p:items[index%items.length],checked:null,answer:''}}
function dictation(u){let d=ui.dict;if(!d||d.id!==u.id)d=ui.dict=initDict(u);if(!d)return '<div class="card">No dictation phrase available.</div>';return `<div class="cards two"><div class="card"><div class="kicker">LISTENING & SPELLING LAB</div><h3>Can you write what you hear?</h3><p>Play the Spanish audio and type the sentence. An English meaning is shown as a hint.</p><div class="callout"><div class="overline">MEANING</div><h3 style="margin:8px 0">${safe(d.p.en)}</h3></div><button class="btn primary" data-say="${safe(d.p.es)}">🔊 Play Spanish audio</button><div class="field"><label for="dict-response">What did you hear?</label><textarea id="dict-response" placeholder="Type the Spanish sentence…" ${d.checked!==null?'readonly':''}>${safe(d.answer)}</textarea></div><div class="actions wrap">${d.checked===null?`<button class="btn primary" data-checkdict="1">Check transcription</button>`:`<button class="btn primary" data-nextdict="1">Next dictation →</button>`}</div>${d.checked!==null?`<div class="feedback ${d.checked?'':'wrong'}"><b>${d.checked?'✓ Correct':'✕ Correct transcription'}</b><div>${safe(d.p.es)}</div></div>`:''}</div><div class="card"><div class="overline">THIS EXERCISE WORKS OFFLINE WHEN A SPANISH VOICE IS INSTALLED</div><h3>How to practise</h3><p>1. Listen without reading the answer.<br>2. Write the sentence.<br>3. Replay the audio and correct your spelling.<br>4. Repeat aloud.</p><p class="tiny">Accent marks and punctuation are ignored for the automatic comparison; exact spelling is still shown in feedback. Some system voices may require an internet connection.</p></div></div>`}

function write(u){return `<div class="cards two"><div class="card"><div class="kicker">WRITING TASK</div><h3>${safe(u.en?.write||u.write)}</h3><div class="field"><label for="writing-answer">Your response (stored locally)</label><textarea id="writing-answer" class="textarea-large" placeholder="Write in Spanish…">${safe(state.journals[u.id]||'')}</textarea></div><div class="actions wrap"><button class="btn primary" data-savewriting="1">Save my work</button><button class="btn" data-togglemodel="1">${ui.showModel?'Hide':'Show'} example</button></div>${ui.showModel?`<div class="callout"><b>Model answer (not an automatic correction)</b><div>${safe(u.model)}</div></div>`:''}</div><div class="card"><h3>Checklist</h3><p>Does your answer use the topic’s grammar, correct word order and appropriate register? Use the example to self-review. This version does not automatically grade open writing.</p><button class="btn" data-say="${safe(u.model)}">🔊 Listen to the model</button></div></div>`}
function lab(){let u=focusUnit();return `<p class="kicker">INTERACTIVE TRAINING</p><h1 class="h1">Practice lab</h1><p class="lead">Go beyond watching: answer, listen, build, speak and write. Every activity is connected to the ${allUnits().length} bilingual lessons.</p><div class="cards"><div class="card"><span class="level-chip">01</span><h3>Meaning & grammar</h3><p>Short quizzes with instant feedback, eight translations plus a grammar check.</p><button class="btn primary slim" data-open-tab="${u.id}|quiz">Start quiz →</button></div><div class="card"><span class="level-chip">02</span><h3>Sentence builder</h3><p>Rebuild authentic sentences by placing Spanish words in the correct order.</p><button class="btn primary slim" data-open-tab="${u.id}|build">Build sentences →</button></div><div class="card"><span class="level-chip">03</span><h3>Listening dictation</h3><p>Listen to Spanish and type what you hear, with instant transcription feedback.</p><button class="btn primary slim" data-open-tab="${u.id}|dict">Try dictation →</button></div><div class="card"><span class="level-chip">04</span><h3>Speaking booth</h3><p>Listen, repeat, record your voice and compare it yourself with the model.</p><button class="btn primary slim" data-open-tab="${u.id}|speak">Speak aloud →</button></div><div class="card"><span class="level-chip">05</span><h3>Writing workshop</h3><p>Complete a short production task and save it locally for later revision.</p><button class="btn primary slim" data-open-tab="${u.id}|write">Write in Spanish →</button></div><div class="card"><span class="level-chip">06</span><h3>Real conversations</h3><p>Choose a response in dialogues from everyday situations to advanced debates.</p><button class="btn primary slim" data-page="talk">Enter conversation →</button></div></div><h2 class="h2">Pick a lesson to practise</h2><div class="cards">${allUnits().slice(0,9).map(u=>`<div class="card"><span class="level-chip">${u.level}</span><h3>${safe(u.en?.title||u.title)}</h3><butto function talk(){let sc=DATA.scenes[ui.sceneIdx],turn=sc.turns[ui.turn],done=ui.turn>=sc.turns.length;return `<div class="kicker">SPEAK LIKE A PERSON, NOT A TEXTBOOK</div><h1 class="h1">Bilingual conversation simulator</h1><p class="lead">Read the teacher’s Spanish and English lines, then choose the best Spanish reply. The correct answer and its English meaning appear after you respond. These are guided choices, not open-ended AI dialogue.</p><div class="level-bar">${DATA.scenes.map((s,i)=>`<button class="level-button ${i===ui.sceneIdx?'active':''}" data-scene="${i}">${s.level} · ${safe(s.title)}</button>`).join('')}</div><div class="cards two"><div class="card"><div class="row between"><span class="level-chip">${sc.level}</span><span class="chip">${Math.min(ui.turn+1,sc.turns.length)} / ${sc.turns.length} turns</span></div><h2>${safe(sc.title)}</h2>${done?`<div class="feedback"><b>Conversation completed! 🎉</b><div>You made it to the end of this guided conversation.</div></div><button class="btn primary" data-restartscene="1">Replay conversation</button>`:`<div class="dialog-bubble"><div class="conversation-es" lang="es"><span class="npc">👨‍🏫</span> ${safe(turn.npc)}</div><div class="conversation-en" lang="en">🇬🇧 ${safe(turn.npcEn||'')}</div></div><button class="btn slim" data-say="${safe(turn.npc)}">🔊 Listen to the question</button><div style="margin-top:19px" class="overline">YOUR REPLY · IN SPANISH</div>${turn.options.map((o,i)=>`<button class="choice ${ui.sceneAnswer!==null?(i===turn.correct?'correct':i===ui.sceneAnswer?'wrong':''):''}" ${ui.sceneAnswer!==null?'disabled':''} data-sceneanswer="${i}">${String.fromCharCode(65+i)} · ${safe(o)}</button>`).join('')}${ui.sceneAnswer!==null?`<div class="feedback ${ui.sceneAnswer===turn.correct?'':'wrong'}"><b>${ui.sceneAnswer===turn.correct?'✓ Good reply':'✕ A more suitable answer:'}</b><div class="bilingual-response"><div><span>Spanish · best answer</span><p>${safe(turn.options[turn.correct])}</p></div><div><span>English · meaning</span><p>${safe(turn.correctEn||'')}</p></div></div><div class="bilingual-response"><div><span>Teacher replies · Spanish</span><p>${safe(turn.reply)}</p></div><div><span>Teacher replies · English</span><p>${safe(turn.replyEn||'')}</p></div></div><button class="btn slim" data-say="${safe(turn.reply)}">🔊 Listen to reply</button></div><button class="btn primary" data-nextscene="1">${ui.turn===sc.turns.length-1?'Finish scenario':'Continue dialogue'} →</button>`:''}`}</div><div class="card"><div class="teacher-mini"><img src="${teacherImg()}" alt="Professor avatar reference"><span>🎧 Read · Listen · Respond</span></div><p>Tip: say your chosen answer aloud before selecting it. Meanings appear after you choose, so the exercise remains a genuine recall task.</p><div class="divider"></div><span class="overline">YOUR RECORD</span><div class="metric">${state.scenarioStats[sc.title]||0}</div><div class="tiny">Completed runs</div></div></div>`}
function flashFiltered(){
 let items=flashPool();
 if(ui.flashLevel!=='all')items=items.filter(x=>x.u.level===ui.flashLevel);
 if(ui.flashUnit!=='all')items=items.filter(x=>x.u.id===ui.flashUnit);
 if(ui.flashKind!=='all')items=items.filter(x=>x.kind===ui.flashKind);
 if(ui.revMode==='due')items=items.filter(x=>!x.review||x.review.due<=Date.now());
 if(ui.revMode==='new')items=items.filter(x=>!x.review);
 return items;
}
function resetFlashSession(){ui.flashSessionKey='';ui.revIdx=0;ui.revFlip=false;ui.flashFinished=false;ui.flashGrades={};}
function reviewItems(){
 const signature=[ui.revMode,ui.flashLevel,ui.flashUnit,ui.flashKind].join('|');
 if(ui.flashSessionKey!==signature){ui.flashKeys=flashFiltered().map(x=>x.key);ui.flashSessionKey=signature;ui.revIdx=0;ui.revFlip=false;ui.flashFinished=false;ui.flashGrades={}}
 const refs=new Map(flashPool().map(x=>[x.key,x]));
 return ui.flashKeys.map(key=>refs.get(key)).filter(Boolean);
}
function flashMove(delta){
 let total=reviewItems().length;if(!total)return;
 if(ui.flashFinished){if(delta<0){ui.flashFinished=false;ui.revIdx=total-1;ui.revFlip=false;}else{resetFlashSession();}}else if(ui.revIdx+delta>=total){ui.flashFinished=true;ui.revFlip=false;}else{ui.revIdx=Math.max(0,ui.revIdx+delta);ui.revFlip=false;}
 render();
}

ass="btn" data-script="1">↓ Lesson script</button><button class="btn" data-worksheet="1">↓ Worksheet</button></div><p class="tiny">Video links open YouTube only when you click them and require Internet access.</p></div></div><h2 class="h2">Add your own teaching material</h2><div class="card"><div class="cards two"><div class="field"><label for="new-level">Level</label><select id="new-level">${DATA.levels.map(l=>`<option>${l.id}</option>`).join('')}</select></div><div class="field"><label for="new-title">Lesson title</label><input id="new-title" maxlength="90" placeholder="At the pharmacy"></div></div><div class="field"><label for="new-goal">Learning goal</label><input id="new-goal" maxlength="200" placeholder="Ask for basic medicine and describe symptoms"></div><div class="field"><label for="new-grammar">Grammar note</label><input id="new-grammar" maxlength="220" placeholder="Me duele / me duelen"></div><div class="field"><label for="new-pairs">4 to 12 useful bilingual phrases — one per line: Spanish | English</label><textarea id="new-pairs" class="textarea-large" placeholder="Necesito una farmacia. | I need a pharmacy.&#10;¿Tiene algo para el dolor de cabeza? | Do you have something for a headache?&#10;Gracias por su ayuda. | Thank you for your help.&#10;¿Cuánto cuesta? | How much does it cost?"></textarea></div><button class="btn primary" data-createunit="1">Create lesson and activities</button><p class="tiny">The unit builder generates translation, ordering and dictation exercises. Human pedagogical review is still necessary for advanced content.</p></div>${state.custom.length?`<h2 class="h2">Custom lessons</h2><div class="cards">${state.custom.map(u=>`<div class="card"><span class="level-chip">${u.level}</span><h3>${safe(u.title)}</h3><div class="actions wrap"><button class="btn slim" data-open="${u.id}">Open</button><button class="btn slim red" data-delunit="${u.id}">Delete</button></div></div>`).join('')}</div>`:''}<h2 class="h2">Production pipeline</h2><div c upported browsers.</div></div></div><div class="card" style="margin-top:16px"><h3>Learning framework and limitations</h3><p>Original educational activities broadly inspired by the Common European Framework of Reference (CEFR/MCER) and the Cervantes Institute's curricular progression. Upper-level activities are starter samples rather than comprehensive C1/C2 instruction. Self-check scores are not official certification. Dictation is transcription matching; recording playback is not speech recognition or phonetic scoring.</p></div>`}

async function startRecord(){if(ui.recording){return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast('Microphone recording is not supported here. Try current Chrome or Edge.');return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const opts=MediaRecorder.isTypeSupported('audio/webm')?{mimeType:'audio/webm'}:{};const rec=new MediaRecorder(stream,opts);const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{if(ui.recordingUrl)URL.revokeObjectURL(ui.recordingUrl);const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});ui.recordingUrl=URL.createObjectURL(blob);ui.recordingBlob=blob;ui.recording=false;stream.getTracks().forEach(t=>t.stop());ui.recorder=null;ui.stream=null;if(ui.page==='lesson')render();toast('Recording ready. Listen back or save it.');};rec.onerror=()=>toast('Recording error.');ui.recorder=rec;ui.stream=stream;ui.recording=true;rec.start();render();toast('Recording locally — click Stop when finished.')}catch(e){toast('Microphone access was denied or is unavailable.')}}

function download(name,contents,mime='text/plain;charset=utf-8'){const blob=contents instanceof Blob?contents:new Blob([contents],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}

function saveReport(){let rows=[['Level','Lesson','Passed','Answers','Correct','Accuracy'].join(',')];for(let u of allUnits()){let x=state.stats[u.id]||{total:0,correct:0};rows.push([u.level,u.title,state.completed[u.id]?'Yes':'No',x.total,x.correct,pct(x.correct,x.total)+'%'].map(csvCell).join(','))}download('Learn_Spanish_Pilot_progress.csv','\ufeff'+rows.join('\n'),'text/csv;charset=utf-8')}
function validYoutube(input){if(!input)return '';try{const u=new URL(input);if(u.protocol!=='https:')return '';const host=u.hostname.toLowerCase();if(['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtu.be'].includes(host)){if(!['/',''].includes(u.pathname))return u.href}return ''}catch(e){return ''}}
function createUnit(){const l=$('#new-level').value,title=$('#new-title').value.trim(),goal=$('#new-goal').value.trim(),grammar=$('#new-grammar').value.trim(),lines=$('#new-pairs').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!title||!goal||!grammar||lines.length<4||lines.length>12){toast('Add a title, objective, grammar note and 4–12 bilingual phrases.');return}let pairs=[];for(const line of lines){const ix=line.indexOf('|');if(ix<1||!line.slice(0,ix).trim()||!line.slice(ix+1).trim()){toast('Use the format Spanish | English on every line.');return}pairs.push({es:line.slice(0,ix).trim().slice(0,200),en:line.slice(ix+1).trim().slice(0,200)})}if(new Set(pairs.map(x=>norm(x.es))).size!==pairs.length||new Set(pairs.map(x=>norm(x.en))).size!==pairs.length){toast('Each phrase and translation must be unique.');return}let id='custom-'+Date.now().toString(36);const unit={id,level:l,title:title.slice(0,90),goal:goal.slice(0,200),grammar:grammar.slice(0,220),tip:'Listen, repeat, try the quick check, then use the phrases in context.',pairs,challenge:{q:`What is the main goal of “${title}”?`,options:[goal,'Memorise unrelated words','Translate random sentences'],correct:0,why:goal},write:`Write four original sentences related to “${title}”.`,model:pairs.slice(0,3).map(x=>x.es).join(' '),custom:true};state.custom.push(unit);save();toast('New lesson created');pickLesson(id)}
function exportBackup(){download('Learn_Spanish_Pilot_backup_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8')}
function restoreFile(file){if(!file||file.size>4000000){toast('Choose a JSON backup smaller than 4 MB.');return}let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(String(rd.result));if(!x||typeof x!=='object'||![1,2].includes(x.v)||!x.completed||!x.stats||!Array.isArray(x.custom)||x.custom.length>500)throw Error('Not a recognised backup');if(!confirm('Replace the locally saved learning data with this backup?'))return;cleanupRecord();state={...defaults(),...x,v:2,channel:(x.channel==='HOLA NEXO'||!x.channel)?'Learn Spanish Pilot':String(x.channel).slice(0,70)};save();ui.page='home';ui.lessonId=null;render();toast('Backup restored.')}catch(e){toast('Invalid or unsupported JSON backup.')}};rd.readAsText(file)}
function handleAvatar(file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>350000){toast('Choose a PNG, JPG or WEBP smaller than 350 KB.');return}let r=new FileReader();r.onload=()=>{state.avatarData=String(r.result);if(save()){toast('Teacher portrait updated');render()}};r.readAsDataURL(file)}
function newExam(){let a=[];DATA.levels.forEach(l=>DATA.units.filter(u=>u.level===l.id).slice(0,3).forEach(u=>a.push({...u.challenge,level:l.id})));ui.exam={questions:a,index:0,answers:[],finalized:false};render()}
function clickAction(ev){const el=ev.target.closest('button,[data-page],[data-flip],.flashcard');if(!el)return;
if(el.matches('a[data-page]'))ev.preventDefault();
const d=el.dataset;
if(el.id==='sidebar-toggle'){if(matchMedia('(max-width:740px)').matches)ui.mobile=!ui.mobile;else{state.collapsed=!state.collapsed;save()}render();return}
if(d.page){if(ui.recording&&ui.page==='lesson'&&d.page!=='lesson')stopRecord();pickPage(d.page);return}
if(d.level){ui.level=d.level;pickPage('path');return}
if(d.open){pickLesson(d.open);return}
if(d.openTab){let [id,tab]=d.openTab.split('|');pickLesson(id,tab);return}
if(d.tab){if(ui.recording&&ui.tab==='speak')stopRecord();ui.tab=d.tab;ui.flip=false;ui.showModel=false;render();return}
if(d.say!==undefined){speakText(d.say);return}
if(d.startquiz){startQuick(byId(d.startquiz));return}
if(d.answer!==undefined){let q=ui.quiz;if(!q||q.answered!==null)return;let x=q.questions[q.index];q.answered=Number(d.answer);let ok=q.answered===x.correct;q.hits+=ok?1:0;mark(q.id,ok);if(x.ref&&!ok)pushReview(x.ref,false);render();return}
if(d.nextquiz){let q=ui.quiz;if(!q||q.answered===null)return;q.index++;q.answered=null;if(q.index===q.questions.length&&pct(q.hits,q.questions.length)>=80){state.completed[q.id]=new Date().toISOString();log('Lesson cleared',q.id);save()}render();return}
if(d.add!==undefined){let b=ui.build;if(!b||b.checked!==null)return;let x=b.available.find(w=>w.id===Number(d.add));if(x&&!b.used.some(y=>y.id===x.id))b.used.push(x);render();return}
if(d.remove!==undefined){let b=ui.build;if(!b||b.checked!==null)return;b.used.splice(Number(d.remove),1);render();return}
if(d.resetbuild){ui.build=initBuild(byId(ui.lessonId),ui.build.idx);render();return}
if(d.checkbuild){let b=ui.build;if(!b||b.checked!==null||b.used.length!==b.available.length)return;let attempt=b.used.map(x=>x.word).join(' ');let ok=norm(attempt)===norm(b.p.es);b.checked=ok;let r=state.building[b.id]||{total:0,correct:0};r.total++;r.correct+=ok?1:0;state.building[b.id]=r;mark(b.id,ok,'sentence ordering');if(!ok)pushReview(b.id+':'+b.p.index,false);save();render();return}
if(d.nextbuild){ui.build=initBuild(byId(ui.lessonId),ui.build.idx+1);render();return}
if(d.checkdict){let b=ui.dict;if(!b||b.checked!==null)return;b.answer=$('#dict-response').value.slice(0,1000);b.checked=norm(b.answer)===norm(b.p.es);let st=state.dictations[b.id]||{total:0,correct:0};st.total++;st.correct+=b.checked?1:0;state.dictations[b.id]=st;mark(b.id,b.checked,'dictation');if(!b.checked)pushReview(b.id+':'+b.p.index,false);render();return}
if(d.nextdict){ui.dict=initDict(byId(ui.lessonId),ui.dict.idx+1);render();return}
if(d.nextspeak){if(ui.recording)stopRecord();ui.cardIdx++;render();return}
if(d.startrecord){startRecord();return}
if(d.stoprecord){stopRecord();return}
if(d.downloadrecord){if(ui.recordingBlob)download('Learn_Spanish_Pilot_my_voice.webm',ui.recordingBlob);return}
if(d.savewriting){state.journals[ui.lessonId]=$('#writing-answer').value.slice(0,10000);save();toast('Writing saved locally.');return}
if(d.togglemodel){ui.showModel=!ui.showModel;render();return}
if(d.scene!==undefined){ui.sceneIdx=Number(d.scene);ui.sceneAnswer=null;ui.turn=0;render();return}
if(d.sceneanswer!==undefined){if(ui.sceneAnswer!==null)return;ui.sceneAnswer=Number(d.sceneanswer);let sc=DATA.scenes[ui.sceneIdx],turn=sc.turns[ui.turn];if(ui.sceneAnswer!==turn.correct)log('Conversation review',sc.title);render();return}
if(d.nextscene){let sc=DATA.scenes[ui.sceneIdx];ui.turn++;ui.sceneAnswer=null;if(ui.turn===sc.turns.length){state.scenarioStats[sc.title]=(state.scenarioStats[sc.title]||0)+1;log('Conversation completed',sc.title);save()}render();return}
if(d.restartscene){ui.turn=0;ui.sceneAnswer=null;render();return}
if(d.revmode){ui.revMode=d.revmode;resetFlashSession();render();return}
if(d.flashPrev){flashMove(-1);return}
if(d.flashNext){flashMove(1);return}
if(d.flashRestart){resetFlashSession();render();return}
if(d.flashShuffle){let items=reviewItems();if(items.length>1){for(let i=ui.flashKeys.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ui.flashKeys[i],ui.flashKeys[j]]=[ui.flashKeys[j],ui.flashKeys[i]]}}ui.revIdx=0;ui.revFlip=false;ui.flashFinished=false;render();return}
if(d.flip){ui.revFlip=!ui.revFlip;render();return}
if(d.rate!==undefined){let items=reviewItems(),x=items[ui.revIdx];if(!x||!ui.revFlip||x.key!==d.reviewkey)return;pushReview(x.key,d.rate==='1');ui.flashGrades[x.key]=d.rate==='1'?'known':'again';flashMove(1);return}
if(d.startexam||d.restartExam){newExam();return}
if(d.examanswer!==undefined){let e=ui.exam;if(e.answers[e.index]!==undefined)return;e.answers[e.index]=Number(d.examanswer);render();return}
if(d.nextexam){ui.exam.index++;render();return}
if(d.saveidentity){state.name=$('#studio-name').value.trim().slice(0,60)||'Learner';state.channel=$('#studio-channel').value.trim().slice(0,70)||'Learn Spanish Pilot';save();render();toast('Identity updated');return}
if(d.resetportrait){state.avatarData='';save();render();return}
if(d.savevideo){let id=$('#studio-unit').value,input=$('#studio-video').value.trim();let url=validYoutube(input);if(input&&!url){toast('Enter a valid HTTPS YouTube video URL.');return}state.videos[id]=url;save();toast('Video link saved');return}
if(d.script){let id=$('#studio-unit').value,u=byId(id);if(u)download('script_'+slug(u.title)+'.txt',script(u));return}
if(d.worksheet){let u=byId($('#studio-unit').value);if(u)download('worksheet_'+slug(u.title)+'.html',worksheet(u),'text/html;charset=utf-8');return}
if(d.allscripts){download('Learn_Spanish_Pilot_96_video_outlines.txt',DATA.units.map(script).join('\n\n'+'='.repeat(70)+'\n\n'));return}
if(d.curriculum){let rows=[['Level','Title','Goal','Grammar','Phrases'].map(csvCell).join(',')];allUnits().forEach(u=>rows.push([u.level,u.title,u.goal,u.grammar,u.pairs.length].map(csvCell).join(',')));download('Learn_Spanish_Pilot_curriculum.csv','\ufeff'+rows.join('\n'),'text/csv;charset=utf-8');return}
if(d.createunit){createUnit();return}
if(d.delunit){if(confirm('Delete this custom lesson and all related progress?')){let id=d.delunit;state.custom=state.custom.filter(x=>x.id!==id);delete state.completed[id];delete state.stats[id];delete state.journals[id];delete state.videos[id];Object.keys(state.reviews).filter(k=>k.startsWith(id+':')).forEach(k=>delete state.reviews[k]);save();render();toast('Custom lesson deleted')}return}
if(d.savesettings){state.theme=$('#theme').value;state.accent=$('#accent').value;state.rate=Number($('#audio-rate').value);save();render();toast('Settings updated');return}

if(d.print){window.print();return}
if(d.resetall){if(confirm('Delete all local progress, videos, custom lessons and texts? Export a backup first.')){cleanupRecord();state=defaults();save();ui.page='home';ui.lessonId=null;ui.level='A1';render();toast('Local data deleted')}return}
