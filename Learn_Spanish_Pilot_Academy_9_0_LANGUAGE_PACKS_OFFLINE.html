function pilotMsg(key){return (PILOT_MSG[state.uiLocale]||PILOT_MSG.en)[key]||PILOT_MSG.en[key]||key}
function pilotTexts(){
 const result=new Set();const add=x=>{if(typeof x==='string'&&x.trim()&&x.length<3500)result.add(x.trim())};
 for(const u of DATA.units){
   for(const p of u.pairs||[])add(p.en);
   for(const k of ['title','goal','grammar','tip','write'])add(u.en?.[k]);
   for(const k of ['rule','pattern','caution'])add(EXT_GRAMMAR[u.id]?.[k]);
   const reading=EXT_READINGS[u.id];if(reading){for(const k of ['title','en','question','answer','wrong1','wrong2','explain'])add(reading[k]);}
 }
 for(const s of DATA.scenes||[]){
   function walk(v){if(Array.isArray(v)){v.forEach(walk);return}if(v&&typeof v==='object'){
    for(const [k,x] of Object.entries(v)){if(k==='en'||k==='english'||k==='translation'||k==='npcEn'||k==='correctEn'||k==='replyEn')add(x);else walk(x)}
   }}walk(s)
 }
 return Array.from(result).sort((a,b)=>a.localeCompare(b,'en'));
}
const PILOT_TEXTS=pilotTexts();
const PILOT_KEYS=new Set(PILOT_TEXTS);
const PILOT_PACK_CACHE={};
function pilotLoad(lang){
 if(PILOT_PACK_CACHE[lang])return PILOT_PACK_CACHE[lang];
 let saved={};try{saved=JSON.parse(localStorage.getItem('pilot-pack-v1-'+lang)||'{}')||{}}catch(e){}
 const merged={...Object.fromEntries(Object.entries(PILOT_PACK_SEED).filter(([k,v])=>v[lang]).map(([k,v])=>[k,v[lang]])),...saved};
 PILOT_PACK_CACHE[lang]=merged;return merged;
}
function pilotSave(lang){try{const values=pilotLoad(lang);localStorage.setItem('pilot-pack-v1-'+lang,JSON.stringify(values));return true}catch(e){return false}}
function pilotLookup(text,lang=state.uiLocale){
 if(lang==='en')return text;
 if(lang==='es')return EN_TO_ES[text]||text;
 return pilotLoad(lang)[text]||null;
}
function pilotCoverage(lang=state.uiLocale){let pack=pilotLoad(lang);return PILOT_TEXTS.filter(k=>!!pack[k]).length}
let pilotCancel=false,pilotIsRunning=false;
function pilotDownload(name,contents,mime){const blob=new Blob([contents],{type:mime||'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
function pilotExport(){const lang=state.uiLocale;pilotDownload('LearnSpanishPilot_'+lang+'_language_pack.json',JSON.stringify({format:'LearnSpanishPilot-language-pack',version:PILOT_PACK_VERSION,locale:lang,translations:pilotLoad(lang)},null,2))}
async function pilotImport(file){try{let data=JSON.parse(await file.text());if(data.format!=='LearnSpanishPilot-language-pack'||!PILOT_LANG_LABELS[data.locale]||!data.translations||typeof data.translations!=='object')throw Error('Invalid package');
 if(Object.keys(data.translations).length>6000)throw Error('Package too large');
 const valid=Object.fromEntries(Object.entries(data.translations).filter(([k,v])=>PILOT_KEYS.has(k)&&typeof v==='string'&&v.length<5000));
 Object.assign(pilotLoad(data.locale),valid);if(!pilotSave(data.locale))throw Error('Storage is full');render();toast('Language pack imported: '+Object.keys(valid).length+' entries');
 }catch(e){toast('Import failed: '+e.message)}}
async function pilotBuildPack(){
 const lang=state.uiLocale;
 if(pilotIsRunning||lang==='en'||lang==='es')return;
 pilotIsRunning=true;pilotCancel=false;let n=0;
 try{
  if(!('Translator' in self))throw Error(pilotMsg('unavailable'));
  const availability=typeof Translator.availability==='function'?await Translator.availability({sourceLanguage:'en',targetLanguage:lang}):'available';
  if(availability==='unavailable')throw Error(pilotMsg('unavailable'));
  const trans=await Translator.create({sourceLanguage:'en',targetLanguage:lang});
  const translations=pilotLoad(lang);
  for(const source of PILOT_TEXTS){
   if(pilotCancel)break;
   if(translations[source])continue;
   try{const translated=await trans.translate(source);if(translated&&translated.trim())translations[source]=translated.trim()}catch(err){console.warn('Translation:',source,err);}
   n++;if(n%8===0){pilotSave(lang);pilotUpdateStatus()}
  }
  pilotSave(lang);if(typeof trans.destroy==='function')trans.destroy();
 }catch(e){toast(pilotMsg('failed')+' '+e.message)}finally{pilotIsRunning=false;pilotUpdateStatus();render()}
}
function pilotUpdateStatus(){let box=document.getElementById('pilot-coverage');if(box){let lang=state.uiLocale;box.textContent=pilotMsg('loading')+': '+pilotCoverage(lang)+' / '+PILOT_TEXTS.length;let bar=document.querySelector('#pilot-progress');if(bar)bar.value=pilotCoverage(lang)}}
function pilotAttachPanel(){
 let host=document.querySelector('#screen');if(!host)return;
 let lang=state.uiLocale;
 let box=document.createElement('section');box.className='card pilot-pack-panel';box.style.cssText='margin:16px 0 20px;padding:15px 18px;border:1px solid var(--border)';
 box.innerHTML='<div class="row between wrap" style="gap:10px"><div><strong>🌐 '+safe(pilotMsg('title'))+' — '+safe(PILOT_LANG_LABELS[lang])+'</strong><div class="small muted">'+safe(pilotMsg('hint'))+'</div></div><span id="pilot-coverage" class="chip"></span></div>'+
 '<progress id="pilot-progress" max="'+PILOT_TEXTS.length+'" value="'+pilotCoverage(lang)+'" style="width:100%;margin-top:9px"></progress>'+
 '<div class="actions wrap" style="margin-top:12px"><button class="btn primary" data-pilot-build '+(pilotIsRunning||lang==='en'||lang==='es'?'disabled':'')+'>'+safe(pilotMsg('action'))+'</button><button class="btn" data-pilot-stop '+(!pilotIsRunning?'disabled':'')+'>'+safe(pilotMsg('stop'))+'</button><button class="btn" data-pilot-export>'+safe(pilotMsg('export'))+'</button><button class="btn" data-pilot-import>'+safe(pilotMsg('import'))+'</button><input hidden type="file" id="pilot-import-file" accept=".json,application/json"></div>'+
 '<p class="small muted" style="margin-top:8px">'+safe(pilotMsg('help'))+' '+safe(pilotMsg('front'))+'</p>';
 // Display in settings and the first page only to avoid covering every learning screen.
 if(ui.page==='home'||ui.page==='settings')host.prepend(box);else{
   let compact=document.createElement('div');compact.className='pilot-pack-mini';compact.innerHTML='<span class="small muted">🌐 '+safe(PILOT_LANG_LABELS[lang])+' · '+safe(pilotMsg('coverage'))+': '+pilotCoverage(lang)+' / '+PILOT_TEXTS.length+'</span> <button class="btn slim" data-page="settings">'+safe(pilotMsg('title'))+'</button>';host.prepend(compact)
 }
 pilotUpdateStatus();
}
function pilotContentSwap(){
 const lang=state.uiLocale;if(lang==='en'||lang==='es')return;
 const roots=[document.querySelector('#screen'),document.querySelector('#sidebar')].filter(Boolean);
 for(const root of roots){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const list=[];let node;
  while(node=walker.nextNode())list.push(node);
  for(const node of list){
   if(!node.parentElement||node.parentElement.closest('.pilot-pack-panel,.pilot-pack-mini,[lang="es"],.bi-es,.phrase-es,.pilot-flash-face,.reading-es,.passage-spanish,script,style,textarea,option'))continue;
   const raw=node.nodeValue;const text=raw.trim();if(!PILOT_KEYS.has(text))continue;
   const value=pilotLookup(text,lang);if(!value)continue;
   const left=raw.indexOf(text);node.nodeValue=raw.slice(0,left)+value+raw.slice(left+text.length);
  }
 }
}
const pilotPreviousRender=render;
render=function(){pilotPreviousRender();pilotContentSwap();pilotAttachPanel();if(state.uiLocale!=='en'&&state.uiLocale!=='es'){document.querySelectorAll('.phrase-en .phrase-tag').forEach(el=>el.textContent=state.uiLocale==='ja'?'意味・日本語':state.uiLocale==='zh'?'释义 · 中文':state.uiLocale==='fr'?'SENS · FRANÇAIS':state.uiLocale==='de'?'BEDEUTUNG · DEUTSCH':'ENGLISH · MEANING')}};
document.addEventListener('click',e=>{
 if(e.target.closest('[data-pilot-build]')){pilotBuildPack();return}
 if(e.target.closest('[data-pilot-stop]')){pilotCancel=true;return}
 if(e.target.closest('[data-pilot-export]')){pilotExport();return}
 if(e.target.closest('[data-pilot-import]')){document.getElementById('pilot-import-file')?.click();return}
});
document.addEventListener('change',e=>{if(e.target?.id==='pilot-import-file'&&e.target.files?.[0])pilotImport(e.target.files[0])});
// When language changes, inherited handler rerenders the new locale; the full content pack is applied then.

render();
