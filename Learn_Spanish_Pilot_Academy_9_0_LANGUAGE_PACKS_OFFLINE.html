const EXT_GRAMMAR={"a1-1":{"rule":"Use «hola» at any time. «Buenos días» is associated with the morning; «buenas tardes» with the later part of the day.","pattern":"«Tú» is informal; «usted» uses third-person verb forms («¿Cómo está usted?»).","caution":"Do not mix «¿Cómo estás?» with «usted»: say «¿Cómo está usted?»."},"a1-2":{"rule":"«Ser» identifies origin or profession; «llamarse» introduces a name and «vivir» indicates residence.","pattern":"«Me llamo Ana», «soy español» and «vivo en Madrid» each answer a different question.","caution":"Avoid «soy llamo»: use «me llamo» or «soy Ana»."},"a1-3":{"rule":"With time, use «es la una» for 1 o’clock and «son las dos / tres…» for other hours.","pattern":"«¿Qué hora es?» asks for the time; «¿A qué hora?» asks when something happens.","caution":"Don't say «son la una»: singular hour takes «es la»."},"a1-4":{"rule":"«Tener» expresses possession and ages; possessive determiners agree with the noun possessed.","pattern":"«Mi hermano», «mis hermanos», «su hija»; «tengo dos hermanos».","caution":"Spanish says «tengo veinte años», not «soy veinte años»."},"a1-5":{"rule":"«Quisiera» or «me pone…» can be used to order politely; «un/una» matches the noun.","pattern":"In Spain «¿Me pone un café?» is a common ordering formula; «Quisiera» is more formal.","caution":"Don't translate English «I am having a coffee» literally when placing an order."},"a1-6":{"rule":"«Hay» announces existence; «estar» locates a specific or known thing.","pattern":"«Hay una farmacia aquí» versus «La farmacia está al lado».","caution":"Avoid «hay el museo»: normally «el museo está…»."},"a1-7":{"rule":"Spanish letter names matter for spelling names, addresses and email.","pattern":"«Se escribe con be», «lleva tilde», «arroba» and «punto» help clarify letters.","caution":"«B» and «V» normally share the same pronunciation in most varieties."},"a1-8":{"rule":"Nationalities are adjectives: they agree with number and (when applicable) gender.","pattern":"«Soy de Perú» versus «soy peruana»; nationality words are generally lowercase.","caution":"Do not capitalize «español» as a nationality in ordinary Spanish."},"a1-9":{"rule":"«¿Puede repetir?» is formal; «¿Puedes repetir?» is informal.","pattern":"«No entiendo», «¿qué significa?» and «¿cómo se dice…?» are useful repair strategies.","caution":"Ask for clarification rather than pretending to understand."},"a1-10":{"rule":"Dates use «el» plus a cardinal number; the first may be «uno» or «primero» by region/context.","pattern":"«Hoy es viernes», «el veinte de noviembre», «en diciembre».","caution":"Days and months are lowercase in standard Spanish."},"a1-11":{"rule":"Adjectives generally agree with the noun in gender and number.","pattern":"«Casa blanca», «coches rojos», «un libro interesante».","caution":"Not every adjective ends in -o/-a; «interesante» has one form."},"a1-12":{"rule":"«Gustar» agrees with the thing liked; pronouns identify the person affected.","pattern":"«Me gusta el arroz» but «me gustan las verduras».","caution":"Avoid «yo gusto el café» to mean «I like coffee»."},"a1-13":{"rule":"Use «¿Cuánto cuesta?» for one item and «¿Cuánto cuestan?» for several.","pattern":"Sizes and quantities modify requests: «¿Tiene una talla más grande?».","caution":"Don't confuse «precio» (price) with «premio» (prize)."},"a1-14":{"rule":"Use «hay» for existence, «está/están» for position, and «tener» for possessions.","pattern":"«Hay una mesa»; «la mesa está junto a la ventana».","caution":"«Está» agrees with a singular referent; «están» with plural."},"a1-15":{"rule":"Spanish weather uses several impersonal patterns: «hace», «hay», «está».","pattern":"«Hace frío», «hay niebla», «está nublado», «llueve».","caution":"Avoid «es frío» for today’s weather; say «hace frío»."},"a1-16":{"rule":"«Me gusta + infinitive» refers to enjoyable activities; «suelo + infinitive» indicates routine.","pattern":"«Me gusta leer»; «suelo salir los domingos».","caution":"For more than one activity, the infinitive does not normally become plural."},"a2-1":{"rule":"Reflexive routines place «me/te/se» before a conjugated verb.","pattern":"«Me levanto a las siete»; «voy a dormir temprano».","caution":"«Levanto» and «me levanto» do not mean the same thing."},"a2-2":{"rule":"The perfect combines present «haber» and an invariable participle.","pattern":"«Hoy he trabajado»; «esta semana hemos estudiado». Usage varies by region.","caution":"Don't say «he trabajada»; participles with haber don't agree with subject."},"a2-3":{"rule":"The preterite reports completed past events, often with a finished time marker.","pattern":"«Ayer fui», «la semana pasada compré», «en 2020 viajamos».","caution":"Avoid mixing present time reference with past tense without reason."},"a2-4":{"rule":"«Ir a + infinitive» expresses plans or a near-future intention.","pattern":"«Voy a estudiar», «vamos a quedar», «¿vas a venir?».","caution":"Conjugate «ir», not the following infinitive: «voy a viajar»."},"a2-5":{"rule":"Comparisons use «más/menos + adjective + que» or «tan + adjective + como».","pattern":"«Más barato que», «tan alto como», «el mejor de todos».","caution":"Some forms are irregular: «mejor», «peor», «mayor», «menor»."},"a2-6":{"rule":"With «doler» the hurting body part is the grammatical subject.","pattern":"«Me duele la cabeza»; «me duelen los pies».","caution":"Say «me duele el brazo», not «yo duelo el brazo»."},"a2-7":{"rule":"At hotels, use polite conditionals for requests and «hay un problema con…» for difficulties.","pattern":"«¿Podría cambiar de habitación?»; «la ducha no funciona».","caution":"Make requests precise: mention both the issue and the desired solution."},"a2-8":{"rule":"Transport questions often combine route, destination and time.","pattern":"«¿Dónde se hace transbordo?»; «¿cuánto tarda?».","caution":"«Tardar» refers to duration, «salir» to departure."},"a2-9":{"rule":"Instructions frequently use the imperative or the impersonal «se + verb».","pattern":"«Corta las verduras», «se añade agua», «mezcla bien».","caution":"Affirmative informal commands often differ from infinitives: «mezcla», not «mezclar»."},"a2-10":{"rule":"Invitations often use «¿Te apetece…?» or «¿Quieres…?» followed by an infinitive.","pattern":"«¿Te apetece venir?»; «lo siento, no puedo».","caution":"A polite refusal can offer an alternative date or activity."},"a2-11":{"rule":"Use «ser» for identity and usual traits, «estar» for states, and «tener» for features.","pattern":"«Es alto», «está cansado», «tiene ojos verdes».","caution":"«Es aburrido» (boring) and «está aburrido» (bored) differ."},"a2-12":{"rule":"Narrate completed events with the preterite and sequence markers.","pattern":"«El sábado salí», «después comimos», «por último volvimos».","caution":"Keep the story’s time reference consistent unless explaining a habit."},"a2-13":{"rule":"Telephone exchanges have formulaic opening, clarification and closing phrases.","pattern":"«¿De parte de quién?», «le dejo un mensaje», «ahora no puede ponerse».","caution":"«¿Está María?» is common for asking if someone is available by phone."},"a2-14":{"rule":"At a pharmacy, describe symptoms, duration and advice sought.","pattern":"«Tengo tos desde ayer», «¿cada cuántas horas?».","caution":"Language practice is not medical guidance: follow professional directions."},"a2-15":{"rule":"Sport habits use frequency adverbs, ability with «poder» and preferences with «gustar».","pattern":"«Entreno dos veces por semana»; «sé nadar».","caution":"«Saber + infinitive» expresses learned skill, not merely permission."},"a2-16":{"rule":"Housing descriptions combine «tener», «hay» and comparative language.","pattern":"«Tiene dos dormitorios»; «está cerca del metro».","caution":"«Alquiler» is rent; «fianza» usually means a security deposit."},"b1-1":{"rule":"The imperfect describes background, repeated habits or ongoing past states; the preterite advances completed events.","pattern":"«Antes vivía aquí» / «ayer me mudé».","caution":"A change of tense can change perspective even if both are past."},"b1-2":{"rule":"After «quiero que», use subjunctive when subject changes; «creo que» affirmative usually takes indicative.","pattern":"«Quiero que vengas»; «creo que viene».","caution":"«No creo que venga» typically takes subjunctive."},"b1-3":{"rule":"Conditional forms soften advice and make suggestions less imposing.","pattern":"«Yo hablaría con…»; «podrías preguntar».","caution":"Use «deberías» thoughtfully: it can sound stronger than «podrías»."},"b1-4":{"rule":"Explain travel problems by giving the event, its consequence and a polite request.","pattern":"«Perdí mi conexión y necesito cambiar el billete».","caution":"Provide concrete information rather than vague complaints."},"b1-5":{"rule":"A coherent story marks chronology and separates actions from background.","pattern":"«Mientras caminaba, empezó a llover».","caution":"«Sin embargo» expresses contrast, not a next step in time."},"b1-6":{"rule":"«Llevar + time + gerund» expresses an action continuing until now.","pattern":"«Llevo tres años trabajando aquí».","caution":"Don't use «desde hace» together with a conflicting completed-time reading."},"b1-7":{"rule":"Goals are more convincing with measurable milestones and temporal framing.","pattern":"«Mi objetivo es…»; «he avanzado porque…».","caution":"Separate intention, progress and achieved outcome."},"b1-8":{"rule":"Use cause connectors to explain a reaction instead of only naming an emotion.","pattern":"«Me dio vergüenza porque…», «me alegró que…».","caution":"Some emotion structures require subjunctive when the subject changes."},"b1-9":{"rule":"A useful complaint has three parts: the defect, evidence and a specific remedy.","pattern":"«El pedido llegó roto; quisiera un reemplazo».","caution":"Stay factual; an accusation is not the same as a documented issue."},"b1-10":{"rule":"«Porque» gives causes, «por eso» consequences, and «aunque» contrasts.","pattern":"«Llovía, por eso cancelamos el viaje».","caution":"«Por qué» (question) and «porque» (answer) are not interchangeable."},"b1-11":{"rule":"Travel accounts should combine chronology, description and evaluation.","pattern":"«Primero visitamos…; lo mejor fue…».","caution":"Use the imperfect for ongoing background, not every past action."},"b1-12":{"rule":"Describe routines and changes without making unsupported causal claims.","pattern":"«Desde que camino más, duermo mejor».","caution":"Distinguish personal experience from a general medical conclusion."},"b1-13":{"rule":"Discuss study methods with comparison and supporting personal examples.","pattern":"«Aprendo mejor cuando practico en voz alta».","caution":"«Aprobar» means pass an exam; «aprobar de» is not the usual pattern."},"b1-14":{"rule":"For technology problems, identify what worked, what changed and the observed error.","pattern":"«Desde la actualización, no se abre».","caution":"«Subir» a file can mean upload; «descargar» means download."},"b1-15":{"rule":"«¿Y si…?» and «podríamos…» introduce collaborative suggestions.","pattern":"«¿Y si quedamos el jueves?».","caution":"Differentiate a proposal from an obligation."},"b1-16":{"rule":"Cultural comparison benefits from avoiding stereotypes and absolute claims.","pattern":"«En algunas regiones se acostumbra…».","caution":"«Todo el mundo» is often too sweeping for cultural observations."},"b2-1":{"rule":"Organise a position into claim, evidence, counterargument and conclusion.","pattern":"«Por un lado…; no obstante…; por tanto…».","caution":"Connectors don't substitute for supporting evidence."},"b2-2":{"rule":"«Aunque» + indicative normally presents known information; subjunctive presents hypothetical or nonasserted information.","pattern":"«Aunque llueve…» / «aunque llueva…».","caution":"Do not select mood only by memorising a connector."},"b2-3":{"rule":"Hypothetical conditions usually use «si + imperfect subjunctive, conditional».","pattern":"«Si tuviera tiempo, viajaría».","caution":"Avoid «si tendría» in the standard hypothetical condition."},"b2-4":{"rule":"Reported speech may require adjustment of tense, person and time words.","pattern":"«Dijo: “Vengo mañana”» → «Dijo que venía al día siguiente».","caution":"Backshifting is context-dependent, not always mechanical."},"b2-5":{"rule":"Journalistic language marks degrees of certainty and source attribution.","pattern":"«Según el informe» / «al parecer» / «se confirmó».","caution":"Never present an unverified assertion as established fact."},"b2-6":{"rule":"Polite negotiation combines a clear proposal with concessions and conditions.","pattern":"«Estaría dispuesto a… siempre que…».","caution":"«Siempre que» often triggers subjunctive for future conditions."},"b2-7":{"rule":"Formal emails need purpose, concise facts, requested action and suitable closing.","pattern":"«Me dirijo a usted para…», «quedo a la espera…».","caution":"An excessively ornate register can reduce clarity."},"b2-8":{"rule":"Good debate includes a precise thesis and accurately described opposing views.","pattern":"«Entiendo ese argumento; sin embargo…».","caution":"Avoid misrepresenting an opponent to make rebuttal easier."},"b2-9":{"rule":"Environmental claims need mechanisms, scope and uncertainty.","pattern":"«La medida podría reducir… si…».","caution":"Correlation alone does not prove an effect."},"b2-10":{"rule":"Presentations signpost scope, evidence and conclusions.","pattern":"«En primer lugar…», «los datos indican…».","caution":"Don't claim the data «demuestran» more than they support."},"b2-11":{"rule":"Work negotiations distinguish a requirement from a preference or trade-off.","pattern":"«Podemos aceptar… a cambio de…».","caution":"Specify who does what by when."},"b2-12":{"rule":"Source literacy uses distinctions between primary evidence, reports and interpretations.","pattern":"«La fuente afirma…; el documento muestra…».","caution":"A headline isn't sufficient evidence for a complex claim."},"b2-13":{"rule":"Problem solving follows identification, options, evaluation and assignment of responsibilities.","pattern":"«La causa probable…; propongo…».","caution":"Distinguish a hypothesis from a confirmed root cause."},"b2-14":{"rule":"Reviews mix summary, evaluation and examples without revealing unnecessary plot details.","pattern":"«La trama destaca por… aunque…».","caution":"«Me gustó» is a reaction, not by itself an argument."},"b2-15":{"rule":"Real conditions usually use present after «si»; hypotheticals use imperfect subjunctive.","pattern":"«Si tengo tiempo, voy» / «si tuviera tiempo, iría».","caution":"Avoid future indicative directly after conditional «si»: «si tendré»."},"b2-16":{"rule":"Process descriptions require explicit sequence and checkpoints.","pattern":"«Primero se comprueba…; después se registra…».","caution":"Impersonal «se» can hide responsibility when clarity is needed."},"c1-1":{"rule":"Advanced stance markers convey careful degrees of commitment.","pattern":"«Cabe suponer» is weaker than «es evidente».","caution":"Avoid using rhetorical certainty when evidence is incomplete."},"c1-2":{"rule":"Administrative Spanish requires formal register, accurate references and a clear request.","pattern":"«En relación con el expediente… solicito…».","caution":"Long passive chains can obscure the action requested."},"c1-3":{"rule":"Evaluative clauses such as «resulta sorprendente que» take subjunctive.","pattern":"«Es significativo que hayan aumentado…».","caution":"Do not mix event certainty with the speaker’s evaluative stance."},"c1-4":{"rule":"An essay must establish a thesis, examine objections and synthesise implications.","pattern":"«Con todo» qualifies a preceding claim.","caution":"A string of academic connectors does not create coherence."},"c1-5":{"rule":"Idioms are sensitive to register and context; literal translation often misfires.","pattern":"«Estar en las nubes» is figurative.","caution":"Check whether an idiom is familiar across Spanish varieties."},"c1-6":{"rule":"Synthesising sources means preserving their claims and divergences.","pattern":"«Mientras X sostiene…, Y advierte…».","caution":"Do not blend different sources into a claim neither makes."},"c1-7":{"rule":"Qualified disagreement acknowledges shared ground before expressing limits.","pattern":"«Coincido en parte; ahora bien…».","caution":"«No estoy de acuerdo en absoluto» may be unnecessarily confrontational."},"c1-8":{"rule":"Causation requires a plausible mechanism and consideration of alternatives.","pattern":"«Se relaciona con» is not «se debe a».","caution":"Distinguish contributing factors from sole causes."},"c1-9":{"rule":"Diplomatic language combines precision with face-saving strategies.","pattern":"«Tal vez convendría reconsiderar…».","caution":"Excessive hedging can make the required action unclear."},"c1-10":{"rule":"Differentiate observed facts, inference and evaluative judgment.","pattern":"«El informe documenta…; esto sugiere…».","caution":"Do not confuse an interpretation with direct evidence."},"c1-11":{"rule":"Style shifts with audience, genre and metaphorical density.","pattern":"«Es un cuello de botella» suits some settings but not all.","caution":"A vivid metaphor can oversimplify complex mechanisms."},"c1-12":{"rule":"Academic argumentation states assumptions, methods and limitations.","pattern":"«En la medida en que…», «no cabe extrapolar…».","caution":"Avoid asserting universal validity from a narrow sample."},"c1-13":{"rule":"Persuasion relies on framing, evidence and emotional appeals.","pattern":"«La elección léxica orienta la interpretación…».","caution":"Distinguish rhetorical effectiveness from factual reliability."},"c1-14":{"rule":"Policy analysis needs trade-offs, affected groups and explicit criteria.","pattern":"«La medida favorece… pero podría perjudicar…».","caution":"Make value assumptions visible rather than implying neutrality."},"c1-15":{"rule":"Literary analysis discusses voice, imagery, structure and justified interpretation.","pattern":"«La ironía narrativa sugiere…».","caution":"An interpretation needs textual grounds, not only personal taste."},"c1-16":{"rule":"Mediation fairly reformulates opposing positions and finds shared concerns.","pattern":"«Ambas partes reconocen…; discrepan sobre…».","caution":"Do not erase real disagreements merely to sound neutral."},"c2-1":{"rule":"Irony depends on context, shared knowledge, tone and mismatch between literal and intended meaning.","pattern":"«¡Qué puntual!» can be sincere or ironic.","caution":"Without context, apparent irony may be ambiguous."},"c2-2":{"rule":"Dialect and sociolect choices index relationships and setting, not linguistic superiority.","pattern":"«Ordenador/computadora» vary regionally.","caution":"Treat regional varieties as legitimate, not as mistakes."},"c2-3":{"rule":"Precision often depends on collocation and semantic restrictions, not dictionary equivalence.","pattern":"«Plantear una hipótesis» versus «formular una acusación».","caution":"Near-synonyms are not interchangeable in every register."},"c2-4":{"rule":"Resolve ambiguity by identifying referents, attachments and scope.","pattern":"«Vi al hombre con el telescopio» allows more than one reading.","caution":"Rephrasing should preserve intended meaning, not just shorten."},"c2-5":{"rule":"Critical reading distinguishes rhetorical appeal, claim structure and evidential warrant.","pattern":"«La conclusión no se sigue de las premisas».","caution":"Calling something a «fallacy» requires demonstrating the inferential gap."},"c2-6":{"rule":"Expert mediation condenses difficult content without distorting its caveats.","pattern":"«La cuestión central radica en…».","caution":"A useful summary preserves uncertainty and dissent."},"c2-7":{"rule":"Implicatures are inferences invited by context rather than explicitly stated facts.","pattern":"«Algunos asistieron» might implicate «not all» without entailing it.","caution":"Do not confuse pragmatic implication with literal truth conditions."},"c2-8":{"rule":"Precision involves managing connotations, register and terminological scope.","pattern":"«Posible» is not «probable»; «incidente» is not always «accidente».","caution":"A stronger word can overstate the evidence."},"c2-9":{"rule":"Sarcasm is often socially sharper than irony; intention remains context-dependent.","pattern":"«Magnífica idea» may be a rebuke after a failure.","caution":"Do not infer intent from punctuation alone."},"c2-10":{"rule":"Variation can be phonetic, lexical, grammatical and pragmatic.","pattern":"«Ustedes» and «vosotros» distribute differently by region.","caution":"Avoid equating Spanish from Spain with a universal standard."},"c2-11":{"rule":"Advanced rewriting preserves propositional content, stance and information structure.","pattern":"«La hipótesis es plausible» differs from «está demostrada».","caution":"Simplification may accidentally increase certainty."},"c2-12":{"rule":"Institutional language uses precise references, temporal scope and legal formulae.","pattern":"«Con efectos desde…» differs from «a partir de…» in some contexts.","caution":"This is linguistic practice, not legal advice."},"c2-13":{"rule":"A philosophical discussion should define terms, distinguish premises and anticipate objections.","pattern":"«Si por libertad entendemos…».","caution":"Avoid equivocation: don't change a key term's meaning mid-argument."},"c2-14":{"rule":"Allusion and humour require awareness of shared cultural knowledge and timing.","pattern":"«Es una odisea» invokes a narrative frame beyond literal travel.","caution":"Explain references without assuming one fixed audience interpretation."},"c2-15":{"rule":"Discourse analysis examines framing, agency, modality and omission.","pattern":"«Se cometieron errores» can hide the actor.","caution":"Document rhetorical effects rather than guessing motives."},"c2-16":{"rule":"Expert moderation separates facts, interests, values and non-negotiable constraints.","pattern":"«Existe acuerdo sobre el objetivo; difieren los medios».","caution":"A synthesis should show unresolved conflict, not fabricate consensus."}};
const EXT_READINGS={"a1-1":{"title":"First morning in class","es":"Ana llega a clase por la mañana. Dice: «Buenos días». Luis responde: «Hola, ¿qué tal?». Al terminar, Ana dice: «Muchas gracias. Hasta luego».","en":"Ana arrives in class in the morning. She says: “Good morning.” Luis answers: “Hi, how are you?” At the end, Ana says: “Thank you very much. See you later.”","question":"What does Ana say when she arrives?","answer":"Good morning.","wrong1":"Good night.","wrong2":"See you tomorrow."},"a1-2":{"title":"Meet Pablo","es":"Hola, me llamo Pablo. Soy de España, pero vivo en Londres. Trabajo en una tienda y estudio inglés por la tarde. Mi amiga se llama Julia.","en":"Hi, my name is Pablo. I'm from Spain, but I live in London. I work in a shop and study English in the afternoon. My friend's name is Julia.","question":"Where does Pablo live?","answer":"In London.","wrong1":"In Madrid.","wrong2":"In a hotel."},"a1-3":{"title":"A train at five","es":"Son las cuatro y media. Marta mira el reloj: el tren sale a las cinco. Tiene treinta minutos. Compra agua y espera en el andén.","en":"It's half past four. Marta looks at the clock: the train leaves at five. She has thirty minutes. She buys water and waits on the platform.","question":"What time does the train leave?","answer":"Five o’clock.","wrong1":"Half past four.","wrong2":"Six o’clock."},"a1-4":{"title":"My little family","es":"Tengo una hermana y un hermano. Mi hermana se llama Elena y tiene doce años. Mi hermano tiene dieciséis. Mis padres viven con nosotros.","en":"I have a sister and a brother. My sister's name is Elena and she's twelve. My brother is sixteen. My parents live with us.","question":"How old is Elena?","answer":"Twelve.","wrong1":"Sixteen.","wrong2":"Twenty."},"a1-5":{"title":"Breakfast at the café","es":"En la cafetería, Julia dice: «Buenos días. Quisiera un café con leche y una tostada, por favor». El camarero pregunta: «¿Algo más?». Julia responde: «No, gracias».","en":"At the café, Julia says: “Good morning. I'd like a coffee with milk and some toast, please.” The waiter asks: “Anything else?” Julia answers: “No, thank you.”","question":"What does Julia order?","answer":"Coffee with milk and toast.","wrong1":"Tea and cake.","wrong2":"Water and fruit."},"a1-6":{"title":"Finding a museum","es":"Un turista pregunta: «¿Dónde está el museo?». Una mujer contesta: «Está cerca. Siga recto y gire a la derecha. Hay un parque delante del museo».","en":"A tourist asks: “Where is the museum?” A woman answers: “It's nearby. Go straight and turn right. There's a park in front of the museum.”","question":"Where should the tourist turn?","answer":"Right.","wrong1":"Left.","wrong2":"Backwards."},"a2-1":{"title":"A weekday routine","es":"De lunes a viernes, Laura se levanta a las siete, desayuna y va al trabajo en autobús. Normalmente vuelve a las seis. Los sábados se despierta más tarde y sale a caminar.","en":"From Monday to Friday, Laura gets up at seven, has breakfast and goes to work by bus. She usually returns at six. On Saturdays she wakes up later and goes for a walk.","question":"What is different on Saturday?","answer":"Laura wakes up later.","wrong1":"Laura takes the bus to work.","wrong2":"Laura has breakfast at seven."},"a2-2":{"title":"Busy morning","es":"Hoy he tenido muchas cosas que hacer. He respondido a tres correos, he llamado al banco y he comprado comida. Todavía no he terminado el informe.","en":"Today I've had many things to do. I've answered three emails, called the bank and bought food. I still haven't finished the report.","question":"Which task is unfinished?","answer":"The report.","wrong1":"The shopping.","wrong2":"The phone call."},"a2-3":{"title":"A holiday memory","es":"El verano pasado viajamos a Valencia. Llegamos un lunes y visitamos el centro histórico. El martes hizo calor y fuimos a la playa. Regresamos a casa el viernes.","en":"Last summer we travelled to Valencia. We arrived on Monday and visited the historic centre. On Tuesday it was hot and we went to the beach. We returned home on Friday.","question":"When did they return?","answer":"On Friday.","wrong1":"On Monday.","wrong2":"On Tuesday."},"a2-4":{"title":"Plans for Sunday","es":"Este domingo voy a visitar a mis abuelos. Por la mañana vamos a cocinar juntos y por la tarde queremos pasear por el parque. Si llueve, nos quedaremos en casa.","en":"This Sunday I'm going to visit my grandparents. In the morning we'll cook together, and in the afternoon we want to walk in the park. If it rains, we'll stay at home.","question":"What will they do if it rains?","answer":"Stay at home.","wrong1":"Go to the beach.","wrong2":"Cancel the visit."},"a2-5":{"title":"Choosing a flat","es":"El piso azul es más grande que el blanco, pero está más lejos del centro. El blanco es más barato. Sara prefiere el blanco porque quiere ahorrar dinero.","en":"The blue flat is larger than the white one, but it's farther from the centre. The white one is cheaper. Sara prefers the white one because she wants to save money.","question":"Why does Sara prefer the white flat?","answer":"It costs less.","wrong1":"It is larger.","wrong2":"It is farther away."},"a2-6":{"title":"At the clinic","es":"Me duele la garganta desde ayer y tengo un poco de fiebre. He pedido cita en el centro de salud. La médica me pregunta cuándo empezaron los síntomas.","en":"My throat has hurt since yesterday and I have a slight fever. I've made an appointment at the health centre. The doctor asks when the symptoms started.","question":"When did the symptoms start?","answer":"Yesterday.","wrong1":"Last week.","wrong2":"This morning."},"b1-1":{"title":"The old neighbourhood","es":"Cuando era pequeño, vivía en un barrio tranquilo y jugaba en la plaza cada tarde. Un día abrieron una biblioteca nueva. Desde entonces, empecé a ir los sábados y descubrí mi afición por la lectura.","en":"When I was little, I lived in a quiet neighbourhood and played in the square every afternoon. One day a new library opened. From then on, I started going on Saturdays and discovered my love of reading.","question":"Which event changed the speaker’s routine?","answer":"A library opened.","wrong1":"He moved abroad.","wrong2":"He stopped going to the square."},"b1-2":{"title":"A wish for the team","es":"Creo que el equipo está preparado, pero quiero que todos participen en la decisión. No creo que sea buena idea elegir sin escuchar primero a las personas afectadas.","en":"I think the team is prepared, but I want everyone to take part in the decision. I don't think it's a good idea to choose without first listening to those affected.","question":"What does the speaker want before deciding?","answer":"Everyone to be heard.","wrong1":"A decision without consultation.","wrong2":"The team to stop working."},"b1-3":{"title":"Advice for a friend","es":"Tomás quiere aprender español, pero no encuentra tiempo. Yo le diría que estudie diez minutos al día y que practique frases útiles. También podría escuchar conversaciones cortas mientras camina.","en":"Tomás wants to learn Spanish but can't find time. I would tell him to study ten minutes a day and practise useful phrases. He could also listen to short conversations while walking.","question":"Which suggestion is the most realistic?","answer":"Practise briefly every day.","wrong1":"Study only once a month.","wrong2":"Stop listening to Spanish."},"b1-4":{"title":"Missed connection","es":"Nuestro vuelo llegó con retraso y perdimos el tren de enlace. Fuimos a información, explicamos lo ocurrido y preguntamos si podían cambiar los billetes sin coste adicional.","en":"Our flight arrived late, and we missed the connecting train. We went to the information desk, explained what had happened and asked whether they could change the tickets without an extra charge.","question":"What solution did they request?","answer":"Changing tickets at no extra cost.","wrong1":"Buying a new flight.","wrong2":"A hotel room."},"b1-5":{"title":"A surprise visit","es":"Todo empezó cuando sonó el timbre. Estaba preparando la cena y no esperaba a nadie. Abrí la puerta y vi a una amiga que vivía en otro país. Al principio no pude hablar; después nos echamos a reír.","en":"It all began when the doorbell rang. I was making dinner and wasn't expecting anyone. I opened the door and saw a friend who lived in another country. At first I couldn't speak; then we burst out laughing.","question":"What makes the visit surprising?","answer":"The friend lived abroad.","wrong1":"Dinner was ready.","wrong2":"The bell did not work."},"b1-6":{"title":"The interview","es":"En la entrevista expliqué que llevo cuatro años trabajando en atención al público y que desde hace dos coordino un equipo pequeño. La entrevistadora quiso saber cómo resuelvo conflictos.","en":"In the interview I explained that I have been working in customer service for four years and that for the past two years I have coordinated a small team. The interviewer wanted to know how I resolve conflicts.","question":"How long has the speaker worked in customer service?","answer":"Four years.","wrong1":"Two months.","wrong2":"Six years."},"b2-1":{"title":"A decision about public space","es":"Por un lado, ampliar las zonas peatonales reduciría el ruido y podría mejorar la seguridad. Por otro, algunos comercios temen perder clientes. La decisión debería apoyarse en datos de movilidad y en una evaluación posterior, no solo en impresiones.","en":"On one hand, expanding pedestrian areas would reduce noise and could improve safety. On the other, some businesses fear losing customers. The decision should rely on mobility data and later evaluation, not just impressions.","question":"What is the central recommendation?","answer":"Evaluate the proposal using evidence.","wrong1":"Ignore local businesses.","wrong2":"Decide only from personal feelings."},"b2-2":{"title":"A difficult project","es":"Aunque el equipo ha cumplido los plazos, todavía faltan pruebas de seguridad. Aunque el resultado parezca prometedor, no deberíamos lanzarlo antes de revisar los riesgos que siguen pendientes.","en":"Although the team has met the deadlines, safety tests are still missing. Even if the result looks promising, we shouldn't launch it before reviewing the remaining risks.","question":"Why does the speaker oppose an immediate launch?","answer":"Safety tests are incomplete.","wrong1":"The deadlines were missed.","wrong2":"The project has no users."},"b2-3":{"title":"Imagining another city","es":"Si pudiera elegir dónde vivir, me mudaría a una ciudad con más espacios verdes. Sin embargo, no tomaría la decisión sin comparar el coste de vida y las oportunidades de empleo.","en":"If I could choose where to live, I would move to a city with more green spaces. However, I wouldn't decide without comparing living costs and employment opportunities.","question":"What condition limits the speaker’s hypothetical move?","answer":"Comparing costs and jobs.","wrong1":"Finding the nearest beach.","wrong2":"Learning to drive first."},"b2-4":{"title":"What the director said","es":"La directora anunció: «Publicaremos los resultados mañana». Dos días después, el portavoz explicó que la directora había prometido publicar los resultados al día siguiente, pero que un problema técnico había retrasado el proceso.","en":"The director announced: “We'll publish the results tomorrow.” Two days later, the spokesperson explained that the director had promised to publish the results the following day, but a technical problem had delayed the process.","question":"Why were the results not published as expected?","answer":"A technical issue caused a delay.","wrong1":"The director never made a promise.","wrong2":"The spokesperson cancelled the study."},"b2-5":{"title":"Reading a headline carefully","es":"Un titular afirma que una medida «transformará» la ciudad. Sin embargo, el artículo solo cita un informe preliminar con resultados limitados. Antes de sacar conclusiones, conviene consultar el documento original y comprobar qué se ha medido realmente.","en":"A headline claims a policy “will transform” the city. Yet the article cites only a preliminary report with limited findings. Before drawing conclusions, it's wise to read the original document and check what was actually measured.","question":"What is the text mainly warning against?","answer":"Overstating preliminary evidence.","wrong1":"Reading primary documents.","wrong2":"Checking how a study was conducted."},"b2-6":{"title":"Negotiating a deadline","es":"Estaríamos dispuestos a entregar una primera versión el viernes, siempre que recibamos los datos pendientes antes del miércoles. Si no fuera posible, preferiríamos acordar una fecha realista y evitar promesas que no podamos cumplir.","en":"We would be willing to deliver an initial version on Friday provided we receive the missing data by Wednesday. If that isn't possible, we would prefer to agree on a realistic date and avoid promises we cannot keep.","question":"What must happen for Friday delivery?","answer":"The missing data must arrive by Wednesday.","wrong1":"The team must double its budget.","wrong2":"The deadline must be moved immediately."},"c1-1":{"title":"Evidence and uncertainty","es":"Cabe suponer que la caída del consumo guarda relación con el aumento de los precios; sin embargo, atribuirle toda la responsabilidad sería precipitado. Los datos disponibles permiten formular una hipótesis razonable, pero no descartar otros factores.","en":"It is plausible that declining consumption is related to rising prices; however, assigning all responsibility to that factor would be premature. Available data allow a reasonable hypothesis, but do not rule out other factors.","question":"What degree of certainty does the writer express?","answer":"A plausible but unconfirmed explanation.","wrong1":"Absolute proof of a single cause.","wrong2":"Complete rejection of the price hypothesis."},"c1-2":{"title":"A formal request","es":"En relación con la solicitud presentada el mes pasado, agradecería que me confirmaran su estado de tramitación y si es necesario aportar documentación adicional. Quedo a su disposición para facilitar cualquier información que resulte pertinente.","en":"Regarding the application submitted last month, I would appreciate confirmation of its processing status and whether any additional documents are needed. I remain available to provide any relevant information.","question":"What is the main purpose of the message?","answer":"Requesting an update on an application.","wrong1":"Withdrawing an application.","wrong2":"Challenging an official decision."},"c1-3":{"title":"Interpreting a change","es":"Resulta sorprendente que la participación haya aumentado cuando el número de actividades se ha reducido. No obstante, el dato aislado no basta para concluir que el nuevo modelo sea mejor: habría que examinar quién participa y durante cuánto tiempo.","en":"It is surprising that participation increased while the number of activities decreased. However, the single figure is insufficient to conclude that the new model is better: we would need to examine who participates and for how long.","question":"What additional evidence is needed?","answer":"Who participates and for how long.","wrong1":"Only the number of activities.","wrong2":"The colour of the attendance charts."},"c1-4":{"title":"An argument with limits","es":"La digitalización puede simplificar trámites y mejorar la accesibilidad. Con todo, si el diseño excluye a quienes tienen menos recursos o habilidades tecnológicas, el avance será parcial. En última instancia, una mejora debe evaluarse también por sus efectos distributivos.","en":"Digitalisation can simplify procedures and improve access. Yet if the design excludes people with fewer resources or digital skills, progress will be partial. Ultimately, an improvement should also be assessed by how its benefits are distributed.","question":"What is the text’s qualifying argument?","answer":"Access must be equitable.","wrong1":"Digital tools are always harmful.","wrong2":"Efficiency is the only success criterion."},"c1-5":{"title":"An idiom out of place","es":"Durante la reunión, alguien dijo que el proyecto «estaba en pañales». La expresión era clara para parte del equipo, pero desconcertó a otros participantes. La coordinadora reformuló la idea: el trabajo se encontraba todavía en una fase muy inicial.","en":"During the meeting someone said the project was “still in its infancy.” The expression was clear to some of the team but puzzled others. The coordinator rephrased the point: the work was still at a very early stage.","question":"Why did the coordinator rephrase the idiom?","answer":"To ensure shared understanding.","wrong1":"To announce a finished project.","wrong2":"To criticise the entire team."},"c1-6":{"title":"Two studies, one issue","es":"Un estudio señala que el trabajo flexible mejora la satisfacción de algunas personas; otro advierte de que, sin criterios claros, puede aumentar la desigualdad entre puestos. En conjunto, ambas fuentes sugieren que el diseño de la medida importa tanto como la medida misma.","en":"One study notes that flexible work improves some people's satisfaction; another warns that without clear criteria it may increase inequality between roles. Taken together, the sources suggest that policy design matters as much as the policy itself.","question":"What synthesis respects both studies?","answer":"Implementation conditions affect outcomes.","wrong1":"Flexible work always increases inequality.","wrong2":"All jobs experience identical effects."},"c2-1":{"title":"Words and intention","es":"Cuando alguien llegó cuarenta minutos tarde, su compañero exclamó: «¡Qué puntual eres!». La frase, tomada literalmente, era un elogio. Sin embargo, la situación y la entonación permitían interpretarla como una crítica irónica. Sin ese contexto, el sentido no estaría garantizado.","en":"When someone arrived forty minutes late, a colleague exclaimed: “How punctual you are!” Taken literally, the sentence was praise. Yet the situation and intonation made it possible to read it as ironic criticism. Without that context, the meaning would not be assured.","question":"What creates the ironic reading?","answer":"Conflict between the words and the situation.","wrong1":"The dictionary meaning alone.","wrong2":"The sentence being grammatically incorrect."},"c2-2":{"title":"Different places, valid choices","es":"Un participante dijo «computadora», otro «ordenador» y una tercera persona habló de «equipo». Ninguna elección era por sí misma inferior; cada forma respondía a usos, contextos y preferencias diferentes. El problema apareció cuando se confundió la variedad regional con un error lingüístico.","en":"One participant said “computadora,” another “ordenador,” and a third referred to an “equipo.” None was inherently inferior; each reflected different usages, contexts and preferences. The problem arose when regional variation was mistaken for a linguistic error.","question":"What misconception does the passage reject?","answer":"Regional variants are inherently wrong.","wrong1":"Words can vary across regions.","wrong2":"Register affects word choice."},"c2-3":{"title":"A careful wording change","es":"En el borrador se afirmaba que el informe «demostraba» una relación causal. Al revisar los datos, la autora sustituyó ese verbo por «sugería». El cambio no era cosmético: reducía la fuerza de la afirmación para ajustarla al alcance real de la evidencia.","en":"The draft stated that the report “proved” a causal relationship. After reviewing the data, the author replaced that verb with “suggested.” The change was not cosmetic: it reduced the strength of the claim to match what the evidence could support.","question":"Why was «suggested» more accurate?","answer":"The data did not establish causation conclusively.","wrong1":"The author disliked formal vocabulary.","wrong2":"The report had no findings at all."},"c2-4":{"title":"Two possible readings","es":"La frase «Vi al investigador con el telescopio» admite al menos dos interpretaciones: el observador utilizó un telescopio, o el investigador llevaba uno. Una reformulación eficaz debe aclarar cuál de las dos lecturas se pretende, sin añadir hechos nuevos.","en":"The sentence “I saw the researcher with the telescope” allows at least two interpretations: the observer used a telescope or the researcher was carrying one. Effective rephrasing should clarify the intended reading without adding new facts.","question":"What causes the ambiguity?","answer":"Unclear attachment of «with the telescope».","wrong1":"The verb has no subject.","wrong2":"The noun is misspelt."},"c2-5":{"title":"Rhetoric versus evidence","es":"El discurso recurría a una pregunta impactante y a una historia personal para convencer a la audiencia. Aunque ambos recursos podían resultar persuasivos, no bastaban para demostrar la conclusión general. La evaluación crítica exigía examinar los datos, la inferencia y las alternativas plausibles.","en":"The speech used a striking question and a personal story to convince the audience. Although both devices could be persuasive, they were not enough to establish the broad conclusion. Critical evaluation required examining the data, inference and plausible alternatives.","question":"What does the reader need beyond persuasion?","answer":"Evidence and a valid inference.","wrong1":"More emotional anecdotes.","wrong2":"A more dramatic question."},"c2-6":{"title":"Making complex ideas accessible","es":"Dos especialistas discrepaban sobre el significado de un resultado. La mediadora resumió los puntos de acuerdo y explicó que la principal diferencia no afectaba a los datos observados, sino a las inferencias que podían extraerse. Evitó presentar esa discrepancia como si fuera un consenso.","en":"Two specialists disagreed about the meaning of a result. The mediator summarised points of agreement and explained that the main difference concerned not the observed data but the inferences that could be drawn. She avoided presenting the disagreement as consensus.","question":"What did the mediator preserve?","answer":"A genuine disagreement over interpretation.","wrong1":"An invented consensus.","wrong2":"A dispute over whether the data existed."}};
const EXT_LEVELS=['A1','A2','B1','B2','C1','C2'];
// Prevent repeated storage-error notifications in restricted preview or private-browser contexts.
// Chrome/Edge file origins normally permit localStorage, but a backup is always advisable.
save=function(){try{localStorage.setItem(STORAGE,JSON.stringify(state));return true}catch(e){if(!ui.extStorageWarned){ui.extStorageWarned=true;toast('Browser storage is unavailable here. Export a backup to keep your work.')}return false}};

const ext=()=>{if(!state.ext4||typeof state.ext4!=='object')state.ext4={};const e=state.ext4;e.mistakes ||= [];e.reading ||= [];e.listening ||= [];e.levelChecks ||= {};e.writing ||= {};e.speaking ||= {};e.studyDays ||= [];return e};
function dayKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function touched(){let e=ext(),d=dayKey();if(!e.studyDays.includes(d))e.studyDays.push(d);e.studyDays=e.studyDays.slice(-400);save()}
function streak(){let days=new Set(ext().studyDays),count=0,d=new Date();if(!days.has(dayKey()))d.setDate(d.getDate()-1);for(let n=0;n<365;n++){let k=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');if(!days.has(k))break;count++;d.setDate(d.getDate()-1)}return count}
function dossier(u){return EXT_GRAMMAR[u.id]||{rule:u.en?.grammar||u.grammar,pattern:u.en?.tip||u.tip,caution:'Consider word order, register and agreement when using this structure.'}}
function readingOf(u){return EXT_READINGS[u.id]||null}
function rememberError({unit,skill,question,answer,correct,explanation}){let e=ext(),code=[unit,skill,question].join('|');let m=e.mistakes.find(x=>x.code===code);if(m){m.count++;m.answer=String(answer||'').slice(0,400);m.at=new Date().toISOString();m.resolved=false}else{e.mistakes.unshift({code,unit,skill,question:String(question||'').slice(0,400),answer:String(answer||'').slice(0,400),correct:String(correct||'').slice(0,400),explanation:String(explanation||'').slice(0,450),count:1,at:new Date().toISOString(),resolved:false})}e.mistakes=e.mistakes.slice(0,360);touched()}
function gradeSkill(skill,u,ok,details){let e=ext();e[skill] ||= [];e[skill].unshift({unit:u.id,level:u.level,correct:!!ok,at:new Date().toISOString(),details:details||''});e[skill]=e[skill].slice(0,600);touched()}
function skillSummary(skill,level){let a=(ext()[skill]||[]).filter(x=>!level||x.level===level);return {total:a.length,correct:a.filter(x=>x.correct).length,accuracy:a.length?pct(a.filter(x=>x.correct).length,a.length):null}}
function phraseQuiz(u,slot){let p=u.pairs[slot%u.pairs.length];let wrong=u.pairs.filter(x=>x.en!==p.en).slice(0,2).map(x=>x.en);return {question:`What is the English meaning of “${p.es}”?`,opts:[p.en,...wrong],correct:p.en,explain:`${p.es} — ${p.en}`}}
function miniQuestion(u,mode){let r=readingOf(u);return r?{question:r.question,opts:[r.answer,r.wrong1,r.wrong2],correct:r.answer,explain:r.en}:phraseQuiz(u,mode==='listen'?2:0)}
function mixChoices(opts,seed){let p=(seed*2654435761)>>>0;let o=opts.map((s,i)=>({s,k:((i+1)*9973+p*1103515245)>>>0})).sort((a,b)=>a.k-b.k);return o.map(x=>x.s)}
function phraseBilingual(u,idx){let p=u.pairs[idx%u.pairs.length];return `<div class="phrase" style="padding:12px 0"><div class="phrase-bilingual"><div class="phrase-lang"><span class="phrase-tag">ESPAÑOL</span><strong lang="es">${safe(p.es)}</strong></div><div class="phrase-lang phrase-en"><span class="phrase-tag">ENGLISH</span><strong lang="en">${safe(p.en)}</strong></div></div><button class="btn slim listen-btn" data-say="${safe(p.es)}">🔊</button></div>`}
function grammarStudio(u){const d=dossier(u);return `<div class="kicker">TEACHER'S GRAMMAR STUDIO</div><h2 class="h1">Understand the pattern</h2><p class="lead">A real explanation, the grammatical structure, typical mistakes, and bilingual examples for this unit.</p><div class="cards two"><section class="card"><div class="overline">WHY & WHEN TO USE IT</div><h3 class="h3" style="margin-top:10px">The central rule</h3><p>${safe(d.rule)}</p><div class="callout"><b>Structure and contrast</b><p class="muted small">${safe(d.pattern)}</p></div></section><section class="card"><div class="overline">COMMON ENGLISH-SPEAKER TRAP</div><h3 class="h3" style="margin-top:10px">Avoid this mistake</h3><div class="feedback wrong">${safe(d.caution)}</div><p class="muted small">${safe(u.en?.tip||u.tip)}</p></section></div><h2 class="h2">Worked examples · see the meaning beside the phrase</h2><div class="card">${[0,2,4,6].filter(i=>i<u.pairs.length).map(i=>phraseBilingual(u,i)).join('')}</div><div class="card" style="margin-top:16px"><div class="row between wrap"><div><h3 class="h3">Can you use it?</h3><p class="muted small">Check the meaning, then explain the structure in your own words.</p></div><button class="btn primary" data-tab="quiz">Do the ${u.pairs.length+1}-question knowledge check →</button></div></div>`}
function passageView(u,mode){let r=readingOf(u),read=mode==='reading',q=miniQuestion(u,mode),answered=read?ui.extReadAnswer:ui.extListenAnswer;let options=mixChoices(q.opts,Array.from(u.id).reduce((n,c)=>n+c.charCodeAt(0),0));let answerCorrect=answered===q.correct;
let transcript=r?r.es:u.pairs.slice(0,4).map(x=>x.es).join(' ');let english=r?r.en:u.pairs.slice(0,4).map(x=>x.en).join(' ');
let showTranscript=read||(mode==='listening'&&ui.extRevealListening)||answered!==null;let showEn=read?ui.extShowReadingEnglish:ui.extShowListeningEnglish;
return `<div class="kicker">${read?'READING FLIGHT SCHOOL':'LISTENING CONTROL TOWER'}</div><div class="row between wrap"><h2 class="h1" style="margin-bottom:8px">${read?'Read, infer, respond':'Listen, understand, respond'}</h2><span class="level-chip">${u.level} · ${r?'ORIGINAL PASSAGE':'PHRASE COMPREHENSION'}</span></div><p class="lead">${r?'An original, level-targeted Spanish passage with its English translation and a comprehension question.':'This unit uses a phrase-comprehension set, not an original continuous reading passage. Full original texts are available in 36 selected units.'}</p>
<div class="cards two"><div class="card"><div class="overline">${r?safe(r.title):'PRACTICAL SPANISH PHRASES'}</div><div class="passage" lang="es">${showTranscript?safe(transcript):'<div class="audio-placeholder">🎧 Transcript hidden. Listen first and answer the question.</div>'}</div><div class="actions wrap" style="margin-top:16px"><button class="btn primary" data-extsay="${read?'reading':'listening'}">🔊 ${read?'Read aloud':'Play audio'}</button>${read?`<button class="btn" data-exttoggle="reading-en">${showEn?'Hide':'Show'} English translation</button>`:`<button class="btn" data-exttoggle="listening-transcript">${showTranscript?'Hide':'Show'} transcript</button><button class="btn" data-exttoggle="listening-en">${showEn?'Hide':'Show'} English translation</button>`}</div>${showEn?`<div class="callout" style="margin-top:15px"><b>English meaning</b><p lang="en">${safe(english)}</p></div>`:''}<p class="tiny">${!read?'Audio uses an installed Spanish system voice when available. It is synthetic read-aloud, not a native-speaker recording.':'Use listening playback for pronunciation support.'}</p></div>
<div class="card"><div class="overline">COMPREHENSION CHECK</div><h3 class="h3" style="margin-top:12px">${safe(q.question)}</h3>${options.map((o,i)=>`<button class="choice ${answered!==null?(o===q.correct?'correct':o===answered?'wrong':''):''}" data-ext${read?'read':'listen'}answer="${safe(o)}" ${answered!==null?'disabled':''}>${String.fromCharCode(65+i)} · ${safe(o)}</button>`).join('')}${answered!==null?`<div class="feedback ${answerCorrect?'':'wrong'}"><b>${answerCorrect?'✓ Correct':'✕ Review the passage'}</b><div>${safe(q.explain)}</div></div><button class="btn" data-extretry="${mode}">Try another time</button>`:''}<div class="note">This check measures one aspect of comprehension. One correct answer is not a CEFR skill certification.</div></div></div>`}
function missionStudio(u){const d=dossier(u),saved=ext().writing[u.id]||null,spoken=ext().speaking[u.id]||null;return `<div class="kicker">REAL-WORLD COMMUNICATION MISSION</div><h2 class="h1">Use Spanish, don't just recognise it</h2><p class="lead">Produce your own language and assess it against clear criteria. Written and spoken work is self-assessed; there is no invented AI grading.</p><div class="cards two"><div class="card"><h3>✍️ Writing mission</h3><p>${safe(u.en?.write||u.write)}</p><p class="tiny">Aim for ${({A1:'3–5 short sentences',A2:'5–7 sentences',B1:'90–120 words',B2:'140–200 words',C1:'220–280 words',C2:'250–350 words'})[u.level]}. Use at least three expressions from the lesson.</p><div class="field"><label for="ext-writing">Your Spanish response</label><textarea id="ext-writing" rows="9" placeholder="Write in Spanish…">${safe(saved?.text||'')}</textarea></div><button class="btn primary" data-extsavewrite="1">Save my response</button>${saved?`<div class="tiny">Saved ${safe(saved.at.slice(0,10))} · ${saved.words} words</div>`:''}<details style="margin-top:13px"><summary>Show a short model</summary><p lang="es">${safe(u.model)}</p></details></div>
<div class="card"><h3>🎙️ Speaking mission</h3><p>Explain the goal of <b>${safe(u.en?.title||u.title)}</b> aloud. Include these three expressions and your own examples:</p><div class="card" style="padding:12px">${u.pairs.slice(0,3).map(p=>`<div style="padding:6px 0"><b lang="es">${safe(p.es)}</b><div class="tiny">${safe(p.en)}</div></div>`).join('')}</div><button class="btn" data-tab="speak">Open voice recorder →</button><div class="field"><label for="ext-speakreview">My reflection (optional)</label><textarea id="ext-speakreview" rows="3" placeholder="What felt easy? What should I practise next?">${safe(spoken?.reflection||'')}</textarea></div><button class="btn" data-extsavespeak="1">Save speaking reflection</button>${spoken?`<div class="tiny">Reflection saved ${safe(spoken.at.slice(0,10))}</div>`:''}</div></div>
<div class="card" style="margin-top:16px"><h3>Self-check rubric</h3><p class="muted small">Use these after writing or recording. These checkboxes do not calculate a grade.</p><div class="rubric-grid">${['My message answers the mission','I used lesson vocabulary appropriately','I checked tense, agreement and word order','The sequence of ideas is understandable','I can identify one specific improvement'].map((s,i)=>`<label class="rubric"><input type="checkbox" data-rubric="${i}"> ${s}</label>`).join('')}</div><div class="callout"><b>Teacher insight</b><p>${safe(d.caution)}</p></div></div>`}
function checkpoint(){let e=ext(),test=ui.extLevelCheck;if(!test){let level=ui.level||'A1';return `<div class="kicker">LEVEL-BY-LEVEL SELF-CHECK</div><h1 class="h1">16-question flight examination</h1><p class="lead">Each level includes one question from each of its 16 units. Unlike a three-question sample, this is a broad internal checkpoint. It still does not measure free speaking, writing or official CEFR proficiency.</p><div class="level-bar">${EXT_LEVELS.map(l=>`<button class="level-button ${ui.level===l?'active':''}" data-extlevel="${l}">${l}</button>`).join('')}</div><div class="cards two"><div class="card"><h3>Ready for ${level}?</h3><p>16 questions · no time limit · immediate correction after each answer · goal: 80% for a provisional pass.</p><button class="btn primary" data-extstartcheck="${level}">Start ${level} checkpoint</button></div><div class="card"><h3>Latest result</h3>${e.levelChecks[level]?`<div class="metric">${e.levelChecks[level].correct}/16</div><p>${e.levelChecks[level].correct>=13?'Practice threshold met':'Review recommended'} · ${safe(e.levelChecks[level].at.slice(0,10))}</p>`:'<p>None completed yet.</p>'}</div></div>`}
if(test.index>=test.items.length){let result=test.items.filter((x,i)=>test.answers[i]===x.correct).length,ok=result>=13;let feedback=test.items.filter((x,i)=>test.answers[i]!==x.correct);return `<div class="kicker">CHECKPOINT COMPLETE</div><h1 class="h1">${test.level} · ${result}/16 correct</h1><p class="lead">${ok?'You met this internal practice threshold.':'Review the weak areas and repeat the test when ready.'} This does not certify a CEFR level.</p><div class="cards two"><div class="card"><div class="metric">${pct(result,16)}%</div>${bar(pct(result,16))}<button class="btn primary" data-extrestartcheck="1">Try again</button></div><div class="card"><h3>Priority review units</h3>${feedback.length?feedback.map(f=>`<div class="review-row"><b>${safe(f.title)}</b><button class="btn slim" data-open="${f.id}">Study →</button></div>`).join(''):'<p>Every recognition question was answered correctly. Continue with writing and speaking tasks.</p>'}</div></div>`}
let item=test.items[test.index],a=test.answers[test.index],opts=item.opts;return `<div class="kicker">${test.level} CHECKPOINT · QUESTION ${test.index+1} OF 16</div><h1 class="h1">Choose the best answer</h1><div class="card">${bar(pct(test.index,16))}<div class="bigquestion">${safe(item.q)}</div>${opts.map((x,i)=>`<button class="choice ${a!==undefined?(i===item.correct?'correct':i===a?'wrong':''):''}" data-extcheckanswer="${i}" ${a!==undefined?'disabled':''}>${String.fromCharCode(65+i)} · ${safe(x)}</button>`).join('')}${a!==undefined?`<div class="feedback ${a===item.correct?'':'wrong'}"><b>${a===item.correct?'✓ Correct':'✕ Review'}</b><p>${safe(item.why)}</p></div><button class="btn primary" data-extnextcheck="1">${test.index===15?'View results':'Continue →'}</button>`:''}</div>`}
function mistakesClinic(){let e=ext(),items=e.mistakes,open=items.filter(x=>!x.resolved);return `<div class="kicker">ACTIVE RECALL & CORRECTION</div><h1 class="h1">Mistake clinic</h1><p class="lead">Incorrect answers are saved locally with the correct form. Mark a mistake as reviewed only after you can produce the answer without looking.</p><div class="cards three"><div class="card"><div class="overline">Mistake records</div><div class="metric">${items.length}</div></div><div class="card"><div class="overline">Still to review</div><div class="metric">${open.length}</div></div><div class="card"><div class="overline">Repeated mistakes</div><div class="metric">${items.filter(x=>x.count>1).length}</div></div></div><div class="actions wrap" style="margin:17px 0"><button class="btn" data-extmistakescsv="1">↓ Export mistakes CSV</button><button class="btn" data-page="flash">Review vocabulary cards</button></div>${items.length?items.map((m,i)=>`<div class="card mistake-entry"><div class="row between wrap"><span class="level-chip">${safe(m.unit.toUpperCase())} · ${safe(m.skill)}</span><span class="chip">${m.count} ${m.count===1?'attempt':'attempts'} · ${m.resolved?'✓ Reviewed':'Needs review'}</span></div><h3 class="h3" style="margin-top:10px">${safe(m.question)}</h3><p class="small"><b>Your answer:</b> ${safe(m.answer)}</p><div class="feedback"><b>Correction</b><p>${safe(m.correct)}</p>${m.explanation?`<span class="tiny">${safe(m.explanation)}</span>`:''}</div><div class="actions wrap"><button class="btn slim" data-open="${safe(m.unit)}">Go to lesson</button><button class="btn slim" data-extresolve="${i}">${m.resolved?'Mark for practice':'Mark reviewed'}</button></div></div>`).join(''):'<div class="card"><h3>Your clinic is empty</h3><p>Start a quick check, dictation, sentence builder, reading challenge or level checkpoint. Incorrect answers will appear here.</p></div>'}`}
function insights(){let e=ext(),completed=score(),r=skillSummary('reading'),l=skillSummary('listening');return `<div class="kicker">LEARNING ANALYTICS</div><h1 class="h1">Your skill passport</h1><p class="lead">This dashboard separates automatically checked comprehension from self-recorded practice. Progress is stored only in this browser.</p><div class="cards four"><div class="card"><div class="overline">Day streak</div><div class="metric">${streak()} 🔥</div><p class="tiny">Days with recorded learning activity</p></div><div class="card"><div class="overline">Reading answers</div><div class="metric">${r.total}</div><p class="tiny">${r.accuracy===null?'Not yet assessed':r.accuracy+'% correct'}</p></div><div class="card"><div class="overline">Listening answers</div><div class="metric">${l.total}</div><p class="tiny">${l.accuracy===null?'Not yet assessed':l.accuracy+'% correct'}</p></div><div class="card"><div class="overline">Writing submissions</div><div class="metric">${Object.keys(e.writing).length}</div><p class="tiny">Self-authored, not automatically scored</p></div></div><h2 class="h2">Progress by level</h2><div class="cards two">${EXT_LEVELS.map(level=>{let p=levelProgress(level),r=skillSummary('reading',level),l=skillSummary('listening',level),c=e.levelChecks[level];return `<div class="card"><div class="row between wrap"><span class="level-chip">${level}</span><span class="tiny">${p.done}/${p.total} units passed (recognition)</span></div>${bar(pct(p.done,p.total))}<div class="skill-row"><span>Reading</span><strong>${r.accuracy===null?'—':r.accuracy+'%'}</strong></div><div class="skill-row"><span>Listening</span><strong>${l.accuracy===null?'—':l.accuracy+'%'}</strong></div><div class="skill-row"><span>Level checkpoint</span><strong>${c?c.correct+'/16':'Not taken'}</strong></div><button class="btn slim" data-extlevel="${level}" data-extgoto="checkpoint">Take checkpoint</button></div>`}).join('')}</div><div class="note">Accuracy figures reflect only the questions answered in this application. They do not represent measured speaking proficiency, pronunciation accuracy or DELE/CEFR certification.</div>`}
function subtitleTime(seconds){let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=Math.floor(seconds%60),ms=Math.round((seconds-Math.floor(seconds))*1000);return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')+','+String(ms).padStart(3,'0')}
function createSrt(u){return u.pairs.map((p,i)=>`${i+1}\n${subtitleTime(15+i*9)} --> ${subtitleTime(22+i*9)}\n${p.es}\n${p.en}\n`).join('\n')}
function creatorStoryboard(u){let d=dossier(u),r=readingOf(u);return `${state.channel} · STORYBOARD · ${u.level} · ${u.en?.title||u.title}\n\nTEACHING OUTCOME\n${u.en?.goal||u.goal}\n\nACT 1 · HOOK (0:00—0:30)\nPromise a measurable outcome; show a short Spanish dialogue and its English meaning.\n\nACT 2 · TEACH (0:30—3:00)\nRule: ${d.rule}\nPattern: ${d.pattern}\nLearner trap: ${d.caution}\n\nACT 3 · GUIDED INPUT (3:00—6:00)\n${u.pairs.map((p,i)=>`${i+1}. ${p.es} = ${p.en}`).join('\n')}\n\nACT 4 · ACTIVE RECALL (6:00—8:00)\nHave learner say the Spanish phrase before the answer appears.\n${u.pairs.slice(0,3).map(p=>`EN: ${p.en}\nES: ${p.es}`).join('\n')}\n\nACT 5 · COMPREHENSION (8:00—10:00)\n${r?`${r.es}\nTranslation: ${r.en}\nQuestion: ${r.question}\nAnswer: ${r.answer}`:'Use the unit’s bilingual phrases for a listening-meaning challenge; original reading passage pending.'}\n\nACT 6 · TRANSFER TASK (10:00—12:00)\n${u.en?.write||u.write}\nSample: ${u.model}\n\nEND CARD\nInvite viewer to complete this exact unit in Learn Spanish Pilot Academy.\n\nEDITORIAL QA\nCheck pronunciation, accents, translation accuracy, regional usage, video timing and rights before publishing.\n`}

function extClicked(event){let b=event.target.closest('button');if(!b)return;let d=b.dataset;
// Capture regular V3 errors before original handlers render the UI.
if(d.answer!==undefined){let q=ui.quiz;if(q&&q.answered===null){let x=q.questions[q.index],choice=x.options[Number(d.answer)];if(Number(d.answer)!==x.correct)rememberError({unit:q.id,skill:'Quick check',question:x.q,answer:choice,correct:x.options[x.correct],explanation:x.why});else touched()}return}

if(d.checkdict!==undefined){let t=ui.dict;if(t&&t.checked===null){let response=($('#dict-response')?.value||'').trim();if(norm(response)!==norm(t.p.es))rememberError({unit:t.id,skill:'Dictation',question:t.p.en,answer:response,correct:t.p.es,explanation:'Listen again and compare accents and words.'});else touched()}return}
const a=Object.keys(d).find(k=>k.startsWith('ext'));if(!a)return;
event.preventDefault();event.stopPropagation();
let u=byId(ui.lessonId),v=d[a];
if(a==='exttoggle'){if(v==='reading-en')ui.extShowReadingEnglish=!ui.extShowReadingEnglish;if(v==='listening-transcript')ui.extRevealListening=!ui.extRevealListening;if(v==='listening-en')ui.extShowListeningEnglish=!ui.extShowListeningEnglish;render();return}
if(a==='extsay'){if(!u)return;let r=readingOf(u),txt=r?r.es:u.pairs.slice(0,4).map(p=>p.es).join('. ');speakText(txt);return}
if(a==='extreadanswer'||a==='extlistenanswer'){if(!u)return;let read=a==='extreadanswer',q=miniQuestion(u,read?'reading':'listen');if((read?ui.extReadAnswer:ui.extListenAnswer)!==null)return;let ok=v===q.correct;if(read)ui.extReadAnswer=v;else ui.extListenAnswer=v;gradeSkill(read?'reading':'listening',u,ok,q.question);if(!ok)rememberError({unit:u.id,skill:read?'Reading':'Listening',question:q.question,answer:v,correct:q.correct,explanation:q.explain});render();return}
if(a==='extretry'){if(v==='reading')ui.extReadAnswer=null;else{ui.extListenAnswer=null;ui.extRevealListening=false;ui.extShowListeningEnglish=false}render();return}
if(a==='extsavewrite'){if(!u)return;let content=$('#ext-writing')?.value?.trim()||'';if(!content){toast('Write at least one sentence before saving.');return}ext().writing[u.id]={text:content.slice(0,15000),words:content.split(/\s+/).filter(Boolean).length,at:new Date().toISOString()};touched();toast('Your writing mission is saved locally');render();return}
if(a==='extsavespeak'){if(!u)return;ext().speaking[u.id]={reflection:($('#ext-speakreview')?.value||'').slice(0,2000),at:new Date().toISOString()};touched();toast('Speaking reflection saved locally');render();return}
if(a==='extlevel'){ui.level=v;ui.extLevelCheck=null;if(d.extgoto==='checkpoint')ui.page='checkpoint';render();return}
if(a==='extstartcheck'||a==='extrestartcheck'){let lvl=a==='extrestartcheck'?(ui.extLevelCheck?.level||ui.level):v;let items=DATA.units.filter(x=>x.level===lvl).map(x=>({id:x.id,title:x.en?.title||x.title,q:x.challenge.q,opts:x.challenge.options.slice(),correct:x.challenge.correct,why:x.challenge.why}));ui.extLevelCheck={level:lvl,index:0,items,answers:[]};ui.page='checkpoint';render();return}
if(a==='extcheckanswer'){let t=ui.extLevelCheck;if(!t||t.answers[t.index]!==undefined)return;let i=Number(v),item=t.items[t.index];t.answers[t.index]=i;if(i!==item.correct)rememberError({unit:item.id,skill:'Level checkpoint',question:item.q,answer:item.opts[i],correct:item.opts[item.correct],explanation:item.why});else touched();render();return}
if(a==='extnextcheck'){let t=ui.extLevelCheck;if(!t||t.answers[t.index]===undefined)return;t.index++;if(t.index===16){let n=t.items.filter((x,i)=>t.answers[i]===x.correct).length;ext().levelChecks[t.level]={correct:n,total:16,at:new Date().toISOString()};touched()}render();return}
if(a==='extresolve'){let x=ext().mistakes[Number(v)];if(!x)return;x.resolved=!x.resolved;save();render();return}
if(a==='extmistakescsv'){let rows=[['Unit','Skill','Question','Your answer','Correct answer','Explanation','Attempts','Reviewed','Date']];ext().mistakes.forEach(x=>rows.push([x.unit,x.skill,x.question,x.answer,x.correct,x.explanation,x.count,x.resolved,x.at]));download('Learn_Spanish_Pilot_mistakes.csv','\ufeff'+rows.map(a=>a.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');return}

if(a==='extstory'||a==='extstoryselected'){let unit=a==='extstory'?byId(v):byId($('#studio-unit')?.value);if(unit)download(`storyboard_${slug(unit.id)}.txt`,creatorStoryboard(unit));return}
if(a==='extcontentselected'){let unit=byId($('#studio-unit')?.value);if(unit)download(`lesson_pack_${slug(unit.id)}.json`,JSON.stringify({unit,grammar:dossier(unit),reading:readingOf(unit),storyboard:creatorStoryboard(unit)},null,2),'application/json;charset=utf-8');return}

function attachDual(node,es,en,primary='en'){

 let first=document.createElement('span');first.className='bi-es';first.lang='es';first.textContent=es;

function dualTextPass(root){
 if(!root)return;
 let walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 let nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 for(const node of nodes){
  if(!node.parentNode||!node.nodeValue?.trim())continue;
  let el=node.parentElement;
  if(el.closest(ALREADY_BILINGUAL+',.brandwords,.token-tray,.token-output,textarea,option,.level-chip,.metric,.teacher-image,.brand-logo,.pilot-flash-study,.pilot-flash-toolbar,.pilot-modebar,.pilot-flash-stats,.pilot-empty,.pilot-finished,[data-transcript-block]'))continue;
  if(el.tagName==='SCRIPT'||el.tagName==='STYLE')continue;
  const original=node.nodeValue,txt=original.trim();
  let es=uiSpanishFor(txt);

  let en=englishForSpanish(txt);
  if(en){attachDual(node,txt,en,'es');continue}

  if(txt.length>2&&!/^\d+[%.,]?\d*\s*$/.test(txt)&&!/^[/·:—✓✕✈️ ]+$/.test(txt))BILINGUAL_MISSING.add(txt);

const createUnitOriginalBilingual=createUnit;
createUnit=function(){
 const titleEs=document.querySelector('#new-title-es')?.value.trim()||'';
 const goalEs=document.querySelector('#new-goal-es')?.value.trim()||'';
 const grammarEs=document.querySelector('#new-grammar-es')?.value.trim()||'';
 const titleEn=document.querySelector('#new-title')?.value.trim()||'';
 const goalEn=document.querySelector('#new-goal')?.value.trim()||'';
 const grammarEn=document.querySelector('#new-grammar')?.value.trim()||'';
 const level=document.querySelector('#new-level')?.value||'A1';
 if(!titleEs||!goalEs||!grammarEs||!titleEn||!goalEn||!grammarEn){toast('Complete both Spanish and English title, goal and grammar notes.');return}
 const lines=(document.querySelector('#new-pairs')?.value||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
 if(lines.length<4||lines.length>12){toast('Add 4–12 bilingual phrases, one Spanish | English pair per line.');return}
 const pairs=[];for(const line of lines){let ix=line.indexOf('|');if(ix<1||!line.slice(0,ix).trim()||!line.slice(ix+1).trim()){toast('Use Spanish | English on every phrase line.');return}pairs.push({es:line.slice(0,ix).trim().slice(0,200),en:line.slice(ix+1).trim().slice(0,200)})}
 if(new Set(pairs.map(p=>norm(p.es))).size!==pairs.length||new Set(pairs.map(p=>norm(p.en))).size!==pairs.length){toast('Each Spanish phrase and English translation must be unique.');return}

 let unit={id,level,title:titleEs.slice(0,90),goal:goalEs.slice(0,200),grammar:grammarEs.slice(0,220),tip:'Escucha, repite y comprueba lo aprendido.',en:{title:titleEn.slice(0,90),goal:goalEn.slice(0,200),grammar:grammarEn.slice(0,220),tip:'Listen, repeat and check what you learned.',write:'Write four original sentences about '+titleEn+'.'},pairs,
 challenge:{q:'¿Cuál es el objetivo principal de «'+titleEs+'»?',qEn:'What is the main goal of “'+titleEn+'”?',options:[goalEn,'Memorise unrelated words','Translate random sentences'],correct:0,why:goalEs,whyEn:goalEn},
 write:'Escribe cuatro frases originales sobre «'+titleEs+'».',model:pairs.slice(0,3).map(p=>p.es).join(' '),modelEn:pairs.slice(0,3).map(p=>p.en).join(' '),custom:true};
 state.custom.push(unit);mapBi(unit.title,unit.en.title);mapBi(unit.goal,unit.en.goal);mapBi(unit.grammar,unit.en.grammar);mapBi(unit.write,unit.en.write);mapBi(unit.model,unit.modelEn);for(const p of pairs)mapBi(p.es,p.en);mapBi(unit.challenge.q,unit.challenge.qEn);mapBi(unit.challenge.why,unit.challenge.whyEn);
 save();toast('New bilingual lesson created');pickLesson(id)
};

const OLD_UI_SPANISH_FOR=uiSpanishFor;
uiSpanishFor=function(input){
 const v=String(input||'').trim();
 const dynamic=v.match(/^What is the English meaning of [“"](.+?)[”"]\?$/);
 if(dynamic)return '¿Cuál es el significado en inglés de «'+dynamic[1]+'»?';
 const lead=v.match(/^·\s*(.+)$/);
 if(lead){let t=EN_TO_ES[lead[1]];if(t)return '· '+t}
 return OLD_UI_SPANISH_FOR(input);
};

const LSP_I18N_LOWER=Object.fromEntries(Object.entries(LSP_I18N).map(([k,v])=>[k.toLocaleLowerCase('en'),v]));
const LSP_DEFAULT_LOCALE=(()=>{const detected=(navigator.language||'en').toLowerCase().split('-')[0];return LSP_LANGS.some(([id])=>id===detected)?detected:'en'})();
if(!LSP_LANGS.some(([id])=>id===state.uiLocale))state.uiLocale=LSP_DEFAULT_LOCALE;
const LSP_ACCENTS={en:'English',ja:'日本語',fr:'Français',de:'Deutsch',zh:'简体中文',es:'Español'};
const LSP_ESPAÑOL='es-ES';
function lspTranslate(raw,language=state.uiLocale){
 const source=String(raw||'').trim();if(!source||language==='en')return source;
 if(language==='es')return BILINGUAL_UI[source]||EN_TO_ES[source]||source;
 const entry=LSP_I18N[source]||LSP_I18N_LOWER[source.toLocaleLowerCase('en')];if(entry&&entry[language])return entry[language];
 const trimSymbols=source.replace(/^([►▶←→🔊✦✓✕↺↑↓▧◈◉✍️🎙️🎧📖🧭🎓●]+)\s*/u,'');
 if(trimSymbols!==source){const translated=lspTranslate(trimSymbols,language);if(translated!==trimSymbols)return source.slice(0,source.length-trimSymbols.length)+translated;}
 const slash=source.match(/^(.+?)\s+\/\s+(.+)$/);
 if(slash&&LSP_I18N[slash[1]]?.[language])return LSP_I18N[slash[1]][language]+' / '+slash[2];
 let dynamic=source.match(/^Continue: (.+)$/);if(dynamic){return (LSP_I18N.Continue?.[language]||'Continue')+': '+dynamic[1];}
 dynamic=source.match(/^(.+?)\s*→$/);if(dynamic){const t=lspTranslate(dynamic[1],language);if(t!==dynamic[1])return t+' →';}
 dynamic=source.match(/^(\d+) (phrases|lessons|cards|correct|attempts)$/);if(dynamic){let t=lspTranslate(dynamic[2].charAt(0).toUpperCase()+dynamic[2].slice(1),language);if(t!==dynamic[2])return dynamic[1]+' '+t;}
 return source;
}
function lspLocalized(text){return lspTranslate(text,state.uiLocale)}
function lspVoiceList(){try{return window.speechSynthesis?.getVoices?.()||[]}catch(e){return []}}
function lspSpainVoices(){return lspVoiceList().filter(v=>String(v.lang||'').replace('_','-').toLowerCase()==='es-es')}
function lspPickSpainVoice(){const xs=lspSpainVoices();return xs.find(v=>v.localService===true)||xs[0]||null}
function lspVoiceState(){
 if(!('speechSynthesis' in window))return 'unsupported';
 const v=lspPickSpainVoice();if(!v)return 'missing';return v.localService===true?'local':'online';
}
function lspVoiceStatusText(){const v=lspPickSpainVoice();if(!v)return 'No Spanish (Spain) voice detected';return 'Voice available'+(v.localService===true?' · offline':' · may need internet')+' · '+v.name;}

  const explain=document.createElement('p');explain.className='lsp-note';explain.textContent=lspLocalized('Spanish audio works only if an es-ES voice is available. Otherwise, install a Spanish (Spain) voice in your device settings.');panel.append(explain);
  const status=document.createElement('div');status.id='lsp-voice-status';status.className='lsp-voice-status';status.setAttribute('role','status');panel.append(status);

  const explain2=document.createElement('p');explain2.className='lsp-note';explain2.textContent=lspLocalized('Never switches to Latin American Spanish');panel.append(explain2);

 }

function lspRefreshVoiceStatus(){
 const box=document.getElementById('lsp-voice-status');if(!box)return;
 box.dataset.status=lspVoiceState();const label=lspLocalized('Voice status');
 const icon=lspVoiceState()==='missing'?'⚠️':lspVoiceState()==='unsupported'?'❌':'✅';
 box.textContent=icon+' '+label+' · '+(lspVoiceState()==='missing'?lspLocalized('No Spanish (Spain) voice detected'):lspVoiceStatusText());
}
function lspTranslateDOM(){
 if(state.uiLocale==='en')return;
 const roots=['#sidebar','#topbar','#screen'].map(x=>document.querySelector(x)).filter(Boolean);
 const skip='[lang="es"],.bi-es,.phrase-es,.pilot-flash-face,.phrase-bilingual,.bilingual-response,.lsp-global-settings,.lsp-locale-top,script,style,textarea,option';
 for(const root of roots){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n;
  while(n=walker.nextNode())nodes.push(n);
  for(const node of nodes){
   if(node.parentElement?.closest(skip))continue;
   let raw=node.nodeValue||'';let trimmed=raw.trim();if(!trimmed)continue;
   // Preserve learner-created content and editable inputs, and keep explicit Spanish study passages intact.
   if(node.parentElement.closest('.passage-spanish,[data-spanish],.reading-es,.bilingual-options-support'))continue;
   let translated=lspTranslate(trimmed);
   if(translated===trimmed)continue;
   let index=raw.indexOf(trimmed);node.nodeValue=raw.slice(0,index)+translated+raw.slice(index+trimmed.length);
  }
 }
 document.querySelectorAll('#screen input[placeholder],#screen textarea[placeholder]').forEach(el=>{
  const val=el.getAttribute('placeholder');if(val){const t=lspTranslate(val);if(t!==val)el.setAttribute('placeholder',t)}
 });
 document.querySelectorAll('#sidebar button[title],#screen button[aria-label],#topbar button[aria-label]').forEach(el=>{
  for(const attr of ['title','aria-label']){if(el.hasAttribute(attr)){const val=el.getAttribute(attr),t=lspTranslate(val);if(t!==val)el.setAttribute(attr,t)}}
 });
}

 en:{title:'Learning-language pack',hint:'Translate the meaning and teaching notes into your language. Spanish audio remains Spanish (Spain).',action:'Build offline pack on this device',loading:'Translations saved',unavailable:'On-device translation is unavailable in this browser. You can import a translated language pack.',import:'Import language pack',export:'Export this language pack',coverage:'Course content translated',missing:'Content not translated in this language yet',ready:'Installed locally',stop:'Stop',help:'The initial installation of a browser translation model may require internet. Once saved, translated material remains available offline on this device.',front:'Flashcards: Spanish first; translation appears only after flipping.',failed:'Translation could not complete. Previously saved entries remain available.'},
