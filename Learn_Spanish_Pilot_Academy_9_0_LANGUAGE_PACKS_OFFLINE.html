/* Learn Spanish Pilot 3.0 — genuinely side-by-side bilingual teaching text */
.phrase{align-items:center;gap:18px}
.phrase-bilingual{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:stretch}
.phrase-lang{min-width:0;padding:9px 10px;border-radius:10px}
.phrase-lang strong{font-size:clamp(14px,1.25vw,17px);line-height:1.5;font-weight:720;overflow-wrap:anywhere;display:block}
.phrase-en{background:var(--panel2);border-left:3px solid var(--accent)}
.phrase-en strong{font-size:clamp(14px,1.15vw,16px);font-weight:620;color:var(--text)}
.phrase-tag{display:block;font-size:10px;font-weight:850;letter-spacing:1.2px;margin-bottom:4px;color:var(--muted)}
.phrase-en .phrase-tag{color:var(--accent)}
.listen-btn{flex:0 0 auto;white-space:nowrap}
.dialog-bubble .conversation-es{font-size:19px;font-weight:760;line-height:1.48}
.dialog-bubble .conversation-en{margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:14px;font-weight:550;color:var(--muted)}
.bilingual-response{margin-top:9px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.bilingual-response div{padding:9px;border:1px solid var(--border);border-radius:8px}
.bilingual-response span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.bilingual-response p{margin:3px 0 0;line-height:1.45}
@media(max-width:740px){.phrase{display:block;padding:12px 0 15px}.phrase-bilingual{grid-template-columns:1fr;gap:5px}.phrase-lang{padding:7px 9px}.phrase-en{margin-top:2px}.listen-btn{margin:10px 9px 0}.bilingual-response{grid-template-columns:1fr}}
@media print{.phrase-bilingual{grid-template-columns:1fr 1fr}.phrase-en{background:#f3f3f3!important;border-color:#666}.phrase-lang strong{color:#111!important}}

.rubric{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--border);background:var(--panel2);border-radius:11px;padding:13px}

/* Academy 5.0 — bilingual Spanish + English in every learner-facing navigation screen */
.bi-pair{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%;vertical-align:middle;white-space:normal;line-height:1.3;text-align:left}

const DATA={"units":[{"id":"a1-1","level":"A1","title":"Saludos y cortesía","goal":"Saludar, despedirse y dar las gracias.","grammar":"Hola / buenos días / buenas tardes; tú y usted.","tip":"Elige el saludo según el momento y la relación.","pairs":[{"es":"Hola, ¿qué tal?","en":"Hi, how are you?"},{"es":"Buenos días.","en":"Good morning."},{"es":"Muchas gracias.","en":"Thank you very much."},{"es":"Hasta luego.","en":"See you later."},{"es":"Buenas tardes, ¿cómo está usted?","en":"Good afternoon, how are you?"},{"es":"Por favor, repita.","en":"Please, repeat."},{"es":"De nada.","en":"You are welcome."},{"es":"Nos vemos mañana.","en":"See you tomorrow."}],"challenge":{"q":"¿Cuál es un saludo formal de mañana?","options":["Buenas noches.","Buenos días.","Hasta luego."],"correct":1,"why":"Buenos días se emplea durante la mañana."},"write":"Saluda a una profesora y despídete cortésmente.","model":"Buenos días, profesora. Muchas gracias. Hasta luego.","en":{"title":"Greetings & Politeness","goal":"Greet people, say goodbye, and thank them.","grammar":"Use hola / buenos días / buenas tardes; choose tú or usted according to formality.","tip":"Choose the greeting for the time of day and the relationship.","write":"Greet a teacher and say goodbye politely."}},{"id":"a1-2","level":"A1","title":"Me presento","goal":"Decir tu nombre, origen y residencia.","grammar":"Me llamo / soy / vivo en; verbos ser, llamarse y vivir.","tip":"Para origen usamos ser de; para residencia, vivir en.","pairs":[{"es":"Me llamo Elena.","en":"My name is Elena."},{"es":"Soy de Canadá.","en":"I am from Canada."},{"es":"Vivo en Madrid.","en":"I live in Madrid."},{"es":"Encantado de conocerte.","en":"Nice to meet you."},{"es":"¿Cómo te llamas?","en":"What is your name?"},{"es":"Soy estudiante.","en":"I am a student."},{"es":"¿De dónde eres?","en":"Where are you from?"},{"es":"Mucho gusto.","en":"Nice to meet you."}],"challenge":{"q":"Completa: «Yo ___ de Canadá».","options":["estoy","soy","tengo"],"correct":1,"why":"El verbo ser indica origen: soy de Canadá."},"write":"Preséntate en cuatro frases.","model":"Hola, me llamo Elena. Soy de Canadá. Vivo en Madrid. Encantada.","en":{"title":"Introducing Yourself","goal":"Say your name, country of origin and where you live.","grammar":"Use me llamo (my name is), soy de (I am from), and vivo en (I live in).","tip":"Use ser de for origin and vivir en for residence.","write":"Introduce yourself using four short sentences."}},{"id":"a1-3","level":"A1","title":"Números y horarios","goal":"Preguntar precios y entender una hora.","grammar":"Números cardinales; ¿qué hora es?; son las / es la.","tip":"Con la una usamos es la; con otras horas, son las.","pairs":[{"es":"¿Qué hora es?","en":"What time is it?"},{"es":"Son las ocho.","en":"It is eight o’clock."},{"es":"Cuesta quince euros.","en":"It costs fifteen euros."},{"es":"Tengo veinte años.","en":"I am twenty years old."},{"es":"Son las ocho y media.","en":"It is half past eight."},{"es":"¿A qué hora empieza la clase?","en":"What time does the class start?"},{"es":"Tengo dos hermanos.","en":"I have two siblings."},{"es":"Es la una y cuarto.","en":"It is quarter past one."}],"challenge":{"q":"¿Qué forma es correcta?","options":["Son la una.","Es la una.","Es las una."],"correct":1,"why":"La una es singular: es la una."},"write":"Explica a qué hora empiezas una actividad.","model":"Mi clase empieza a las ocho de la mañana.","en":{"title":"Numbers & Time","goal":"Ask about prices and understand the time.","grammar":"Use es la una for one o’clock and son las… for other hours.","tip":"Spanish uses es la with one o’clock and son las with other hours.","write":"Say what time one of your daily activities begins."}},{"id":"a1-4","level":"A1","title":"Mi familia","goal":"Describir relaciones y personas.","grammar":"Tener; posesivos mi, tu, su; concordancia simple.","tip":"Los adjetivos suelen concordar con el sustantivo.","pairs":[{"es":"Tengo dos hermanos.","en":"I have two siblings."},{"es":"Mi madre es médica.","en":"My mother is a doctor."},{"es":"Mi padre es alto.","en":"My father is tall."},{"es":"Esta es mi hermana.","en":"This is my sister."},{"es":"Mi madre se llama Rosa.","en":"My mother is called Rosa."},{"es":"¿Tienes hermanos?","en":"Do you have any siblings?"},{"es":"Este es mi hermano.","en":"This is my brother."},{"es":"Mi familia vive aquí.","en":"My family lives here."}],"challenge":{"q":"Completa: «___ hermana se llama Ana».","options":["Mis","Mi","Mío"],"correct":1,"why":"Mi es un posesivo singular delante del sustantivo."},"write":"Describe a dos personas de tu familia o entorno.","model":"Mi hermano es alto. Mi amiga vive cerca de mi casa.","en":{"title":"My Family","goal":"Describe people and family relationships.","grammar":"Use tener (to have), possessives mi / tu / su, and adjective agreement.","tip":"Spanish adjectives usually agree in gender and number with their nouns.","write":"Describe two people in your family or social circle."}},{"id":"a1-5","level":"A1","title":"En la cafetería","goal":"Pedir comida y bebidas de forma educada.","grammar":"Querer / tomar; un, una; por favor.","tip":"«Quería» también es frecuente como petición cortés.","pairs":[{"es":"Quiero un café, por favor.","en":"I want a coffee, please."},{"es":"¿Cuánto cuesta?","en":"How much does it cost?"},{"es":"La cuenta, por favor.","en":"The bill, please."},{"es":"Un vaso de agua.","en":"A glass of water."},{"es":"Quisiera un café con leche.","en":"I would like a coffee with milk."},{"es":"¿Cuánto es en total?","en":"How much is it altogether?"},{"es":"¿Me trae la cuenta, por favor?","en":"Could you bring me the bill, please?"},{"es":"Para mí, un té.","en":"A tea for me."}],"challenge":{"q":"¿Qué dices para pedir la cuenta?","options":["El menú, por favor.","La cuenta, por favor.","La mesa, por favor."],"correct":1,"why":"La cuenta es el total que pagas."},"write":"Pide una bebida y la cuenta con cortesía.","model":"Quería un café y un vaso de agua, por favor. La cuenta, por favor.","en":{"title":"At the Café","goal":"Order food and drinks politely.","grammar":"Practise quiero / quisiera, un / una, and por favor.","tip":"Quería is also common as a polite request in Spanish.","write":"Order a drink and ask for the bill politely."}},{"id":"a1-6","level":"A1","title":"Orientarse en la ciudad","goal":"Preguntar por lugares y direcciones.","grammar":"Hay / está; cerca de; a la derecha/izquierda.","tip":"Hay indica existencia y está ubica algo concreto.","pairs":[{"es":"¿Dónde está la estación?","en":"Where is the station?"},{"es":"Está a la derecha.","en":"It is on the right."},{"es":"Hay un banco cerca.","en":"There is a bank nearby."},{"es":"Sigue todo recto.","en":"Go straight ahead."},{"es":"¿Está lejos de aquí?","en":"Is it far from here?"},{"es":"Siga todo recto.","en":"Go straight ahead."},{"es":"Gire a la izquierda.","en":"Turn left."},{"es":"Está al lado del banco.","en":"It is next to the bank."}],"challenge":{"q":"Completa: «¿Dónde ___ la farmacia?».","options":["hay","está","son"],"correct":1,"why":"La farmacia es un lugar identificado; se pregunta dónde está."},"write":"Da indicaciones sencillas para llegar a una farmacia.","model":"Sigue todo recto y gira a la derecha. La farmacia está cerca.","en":{"title":"Getting Around Town","goal":"Ask where places are and understand directions.","grammar":"Use hay (there is/are), está (is located), cerca de, derecha and izquierda.","tip":"Hay introduces what exists; está locates a specific thing.","write":"Give simple directions to a pharmacy."}},{"id":"a2-1","level":"A2","title":"Rutinas y frecuencia","goal":"Explicar hábitos y horarios semanales.","grammar":"Presente habitual; siempre, a menudo, nunca; reflexivos.","tip":"El pronombre reflexivo cambia según la persona.","pairs":[{"es":"Me levanto a las siete.","en":"I get up at seven."},{"es":"Desayuno antes de trabajar.","en":"I have breakfast before work."},{"es":"A menudo voy andando.","en":"I often walk."},{"es":"Nunca llego tarde.","en":"I am never late."},{"es":"Normalmente me levanto temprano.","en":"I usually get up early."},{"es":"Voy al gimnasio dos veces por semana.","en":"I go to the gym twice a week."},{"es":"Casi nunca desayuno fuera.","en":"I hardly ever eat breakfast out."},{"es":"Los domingos descanso.","en":"I rest on Sundays."}],"challenge":{"q":"Completa: «Yo ___ levanto temprano».","options":["me","te","se"],"correct":0,"why":"La primera persona de levantarse usa me."},"write":"Cuenta tu rutina antes de ir al trabajo o a clase.","model":"Me levanto a las siete, desayuno y después voy al trabajo.","en":{"title":"Daily Routines","goal":"Describe everyday habits and schedules.","grammar":"Present tense and frequency words: siempre, a menudo, nunca; reflexive verbs.","tip":"Reflexive pronouns change with the subject: me, te, se, nos…","write":"Describe your routine before work or class."}},{"id":"a2-2","level":"A2","title":"Lo que he hecho hoy","goal":"Contar acciones recientes y experiencias.","grammar":"Pretérito perfecto compuesto: he + participio.","tip":"En España es habitual con «hoy» y periodos aún abiertos, aunque varía según la región.","pairs":[{"es":"Hoy he estudiado español.","en":"Today I have studied Spanish."},{"es":"He perdido las llaves.","en":"I have lost my keys."},{"es":"¿Has visto este lugar?","en":"Have you seen this place?"},{"es":"Nunca he viajado allí.","en":"I have never traveled there."},{"es":"Hoy he trabajado mucho.","en":"I have worked a lot today."},{"es":"¿Has visto esta película?","en":"Have you seen this film?"},{"es":"Esta semana hemos estudiado español.","en":"We have studied Spanish this week."},{"es":"Todavía no he terminado.","en":"I have not finished yet."}],"challenge":{"q":"Completa: «Hoy ___ comido temprano».","options":["he","ha","han"],"correct":0,"why":"Con yo el auxiliar haber es he."},"write":"Escribe tres cosas que has hecho esta semana.","model":"Esta semana he leído, he practicado español y he visitado a un amigo.","en":{"title":"What I Have Done Today","goal":"Talk about recent actions and experiences.","grammar":"Present perfect: he / has / ha + past participle.","tip":"In Spain this tense is common with hoy and unfinished time periods; use varies by region.","write":"Write three things you have done this week."}},{"id":"a2-3","level":"A2","title":"Ayer y las vacaciones","goal":"Contar hechos terminados del pasado.","grammar":"Pretérito indefinido; ayer, el año pasado.","tip":"Un momento pasado cerrado suele favorecer el indefinido.","pairs":[{"es":"Ayer fui al mercado.","en":"Yesterday I went to the market."},{"es":"Compré un billete.","en":"I bought a ticket."},{"es":"El tren salió tarde.","en":"The train left late."},{"es":"Volvimos el domingo.","en":"We returned on Sunday."},{"es":"El sábado pasado fui al cine.","en":"Last Saturday I went to the cinema."},{"es":"El verano pasado visitamos Sevilla.","en":"Last summer we visited Seville."},{"es":"Compré un billete de tren.","en":"I bought a train ticket."},{"es":"¿Qué hiciste el fin de semana?","en":"What did you do at the weekend?"}],"challenge":{"q":"Completa: «Ayer yo ___ a casa».","options":["voy","fui","iba"],"correct":1,"why":"Ayer marca un hecho cerrado: fui."},"write":"Cuenta qué hiciste ayer por la tarde.","model":"Ayer salí, compré comida y volví a casa a las seis.","en":{"title":"Yesterday & Holidays","goal":"Talk about finished events in the past.","grammar":"Use the preterite for completed actions: fui, compré, visité.","tip":"A clearly finished past time often calls for the preterite.","write":"Describe what you did yesterday afternoon."}},{"id":"a2-4","level":"A2","title":"Planes y futuro próximo","goal":"Hablar de planes y compromisos.","grammar":"Ir a + infinitivo; quedar con alguien.","tip":"«Voy a» expresa intención o futuro próximo.","pairs":[{"es":"Voy a aprender español.","en":"I am going to learn Spanish."},{"es":"Vamos a viajar mañana.","en":"We are going to travel tomorrow."},{"es":"He quedado con Marta.","en":"I arranged to meet Marta."},{"es":"¿Qué vas a hacer?","en":"What are you going to do?"},{"es":"Mañana voy a estudiar.","en":"Tomorrow I am going to study."},{"es":"¿Qué vas a hacer el sábado?","en":"What are you going to do on Saturday?"},{"es":"Vamos a quedar a las seis.","en":"We are going to meet at six."},{"es":"Pienso viajar en primavera.","en":"I plan to travel in spring."}],"challenge":{"q":"Completa: «Mañana voy a ___».","options":["estudio","estudiar","estudié"],"correct":1,"why":"Después de ir a usamos infinitivo."},"write":"Explica dos planes para el fin de semana.","model":"El sábado voy a visitar un museo y el domingo voy a descansar.","en":{"title":"Plans & Near Future","goal":"Describe plans and appointments.","grammar":"Ir a + infinitive expresses a planned or near-future action.","tip":"Voy a is a natural way to say “I am going to…”.","write":"Explain two plans for the weekend."}},{"id":"a2-5","level":"A2","title":"Comparar y elegir","goal":"Comparar objetos y justificar una compra.","grammar":"Más ... que / menos ... que / tan ... como.","tip":"«Mejor» es comparativo de bueno; «más bueno» no es la forma habitual.","pairs":[{"es":"Este libro es más barato.","en":"This book is cheaper."},{"es":"Prefiero el azul.","en":"I prefer the blue one."},{"es":"Es tan grande como el otro.","en":"It is as big as the other one."},{"es":"La calidad es mejor.","en":"The quality is better."},{"es":"Mi ciudad es más grande que la tuya.","en":"My city is bigger than yours."},{"es":"Esta ruta es menos larga.","en":"This route is shorter."},{"es":"El tren es tan rápido como el autobús.","en":"The train is as fast as the bus."},{"es":"Prefiero esta opción.","en":"I prefer this option."}],"challenge":{"q":"¿Qué comparación de igualdad es correcta?","options":["tan alto como","más alto como","tan alto que"],"correct":0,"why":"La igualdad se forma con tan + adjetivo + como."},"write":"Compara dos teléfonos, libros o bicicletas.","model":"El primero es más barato, pero el segundo tiene mejor calidad.","en":{"title":"Comparing & Choosing","goal":"Compare things and explain preferences.","grammar":"Más … que, menos … que, tan … como.","tip":"Mejor is the usual comparative of bueno; más bueno is not the standard choice here.","write":"Compare two phones, books or bicycles."}},{"id":"a2-6","level":"A2","title":"En el médico","goal":"Describir síntomas y entender indicaciones básicas.","grammar":"Doler: me duele / me duelen; tener que + infinitivo.","tip":"Con «doler» concuerda el verbo con lo que duele.","pairs":[{"es":"Me duele la cabeza.","en":"I have a headache."},{"es":"Tengo fiebre desde ayer.","en":"I have had a fever since yesterday."},{"es":"Necesito una cita.","en":"I need an appointment."},{"es":"Tiene que descansar.","en":"You need to rest."},{"es":"Tengo dolor de garganta.","en":"I have a sore throat."},{"es":"Me duelen las piernas.","en":"My legs hurt."},{"es":"Necesito pedir cita.","en":"I need to make an appointment."},{"es":"¿Desde cuándo tiene fiebre?","en":"How long have you had a fever?"}],"challenge":{"q":"Completa: «Me ___ los pies».","options":["duele","duelen","dolor"],"correct":1,"why":"Los pies es plural: me duelen."},"write":"Describe un síntoma cotidiano a un profesional.","model":"Me duele la garganta desde ayer y necesito una cita.","en":{"title":"At the Doctor","goal":"Describe common symptoms and understand simple advice.","grammar":"Use me duele for one thing and me duelen for multiple things.","tip":"The verb doler agrees with the thing that hurts, not the person.","write":"Describe a common symptom to a healthcare professional."}},{"id":"b1-1","level":"B1","title":"Antes y ahora","goal":"Contrastar experiencias habituales y hechos puntuales.","grammar":"Imperfecto vs. indefinido.","tip":"El imperfecto aporta contexto; el indefinido sitúa el acontecimiento.","pairs":[{"es":"Cuando era niño, vivía allí.","en":"When I was a child, I lived there."},{"es":"Ayer conocí a su hermana.","en":"Yesterday I met his sister."},{"es":"Antes jugábamos en la calle.","en":"We used to play in the street."},{"es":"De repente empezó a llover.","en":"Suddenly it started to rain."},{"es":"Antes vivía en un pueblo.","en":"I used to live in a village."},{"es":"Cuando era pequeño, jugaba aquí.","en":"When I was little, I played here."},{"es":"Ayer conocí a una amiga.","en":"Yesterday I met a friend."},{"es":"Mientras leía, sonó el teléfono.","en":"While I was reading, the phone rang."}],"challenge":{"q":"Completa: «Mientras yo leía, él ___».","options":["llegó","llegaba ayer","ha llegado mañana"],"correct":0,"why":"La acción puntual que interrumpe el contexto se expresa con llegó."},"write":"Cuenta un recuerdo interrumpido por un suceso.","model":"Cuando estudiaba, sonó el teléfono y dejé de leer.","en":{"title":"Past Habits vs Events","goal":"Contrast background actions with specific past events.","grammar":"Imperfect vs preterite: hablaba / hablé; tenía / tuve.","tip":"Imperfect provides background; preterite places a completed event in the story.","write":"Tell a memory interrupted by a specific event."}},{"id":"b1-2","level":"B1","title":"Opiniones y deseos","goal":"Expresar deseos, emociones y preferencias.","grammar":"Quiero que + subjuntivo; creo que + indicativo afirmativo.","tip":"Tras «quiero que» con sujetos distintos usamos subjuntivo.","pairs":[{"es":"Espero que todo salga bien.","en":"I hope everything goes well."},{"es":"Creo que tienes razón.","en":"I think you are right."},{"es":"No me parece justo.","en":"I do not think it is fair."},{"es":"Quiero que vengas.","en":"I want you to come."},{"es":"Espero que tengas un buen viaje.","en":"I hope you have a good trip."},{"es":"Creo que es una buena idea.","en":"I think it is a good idea."},{"es":"No creo que sea necesario.","en":"I do not think it is necessary."},{"es":"Quiero que vengas temprano.","en":"I want you to come early."}],"challenge":{"q":"Completa: «Espero que tú ___ mañana».","options":["vienes","vengas","venir"],"correct":1,"why":"«Espero que» expresa deseo y normalmente exige subjuntivo."},"write":"Explica un deseo y una opinión personal.","model":"Espero que el viaje salga bien. Creo que viajar enseña mucho.","en":{"title":"Opinions & Wishes","goal":"Express wishes, feelings and opinions.","grammar":"Quiero que + subjunctive; affirmative creo que + indicative.","tip":"After quiero que with two different subjects, use the subjunctive.","write":"Express one wish and one personal opinion."}},{"id":"b1-3","level":"B1","title":"Consejos y condicional","goal":"Pedir y ofrecer recomendaciones.","grammar":"Condicional simple; deberías / podrías.","tip":"El condicional suaviza las recomendaciones.","pairs":[{"es":"Yo hablaría con ella.","en":"I would talk to her."},{"es":"Deberías descansar más.","en":"You should rest more."},{"es":"Podrías probar otra opción.","en":"You could try another option."},{"es":"En tu lugar, esperaría.","en":"In your place, I would wait."},{"es":"Yo pediría otra opinión.","en":"I would ask for another opinion."},{"es":"Deberías descansar un poco.","en":"You should rest a little."},{"es":"Si puedes, avísame.","en":"If you can, let me know."},{"es":"Podríamos buscar una alternativa.","en":"We could look for an alternative."}],"challenge":{"q":"¿Qué forma suaviza mejor un consejo?","options":["Descansa inmediatamente.","Deberías descansar.","Descansaste."],"correct":1,"why":"«Deberías» presenta la recomendación con cortesía."},"write":"Aconseja a un amigo que quiere estudiar español.","model":"Podrías practicar quince minutos cada día y escuchar conversaciones.","en":{"title":"Giving Advice","goal":"Ask for and offer suggestions.","grammar":"Use conditional forms: deberías, podrías, haría.","tip":"The conditional softens advice and sounds more considerate.","write":"Advise a friend who wants to study Spanish."}},{"id":"b1-4","level":"B1","title":"Resolver problemas de viaje","goal":"Explicar incidencias y solicitar soluciones.","grammar":"Pretérito + causa + petición cortés.","tip":"Orden claro: problema, consecuencia, solicitud.","pairs":[{"es":"He perdido mi reserva.","en":"I have lost my booking."},{"es":"El vuelo se ha retrasado.","en":"The flight has been delayed."},{"es":"¿Podría ayudarme?","en":"Could you help me?"},{"es":"Necesito cambiar la fecha.","en":"I need to change the date."},{"es":"He perdido mi equipaje.","en":"I have lost my luggage."},{"es":"He perdido el vuelo de conexión.","en":"I have missed my connecting flight."},{"es":"¿Podría ayudarme, por favor?","en":"Could you help me, please?"},{"es":"Necesito presentar una reclamación.","en":"I need to file a complaint."}],"challenge":{"q":"¿Qué opción es una petición cortés?","options":["Ayúdame ya.","¿Podría ayudarme?","Tú ayudas."],"correct":1,"why":"El condicional «podría» resulta cortés en atención al público."},"write":"Escribe un mensaje sobre un retraso y pide ayuda.","model":"Mi tren se ha retrasado y he perdido la conexión. ¿Podría indicarme las opciones?","en":{"title":"Solving Travel Problems","goal":"Report a travel problem and request a solution.","grammar":"Combine a past event, a consequence and a polite request.","tip":"A clear sequence is: problem → consequence → request.","write":"Write a message about a delay and ask for help."}},{"id":"b1-5","level":"B1","title":"Narrar con conectores","goal":"Contar una experiencia de forma coherente.","grammar":"Al principio, después, sin embargo, al final.","tip":"Los conectores estructuran una historia y orientan al oyente.","pairs":[{"es":"Al principio estaba nervioso.","en":"At first I was nervous."},{"es":"Después todo mejoró.","en":"Afterwards everything improved."},{"es":"Sin embargo, había un problema.","en":"However, there was a problem."},{"es":"Al final salió bien.","en":"In the end it went well."},{"es":"Primero investigamos el problema.","en":"First we investigated the problem."},{"es":"Después hablamos con el equipo.","en":"Afterwards we spoke to the team."},{"es":"Sin embargo, surgió una dificultad.","en":"However, a difficulty arose."},{"es":"Finalmente encontramos una solución.","en":"Finally, we found a solution."}],"challenge":{"q":"¿Qué conector marca contraste?","options":["después","sin embargo","al final"],"correct":1,"why":"Sin embargo introduce una oposición respecto a lo anterior."},"write":"Escribe cuatro frases para narrar un imprevisto.","model":"Al principio estaba tranquilo. Después hubo un retraso. Sin embargo, llegamos. Al final disfrutamos.","en":{"title":"Telling a Story","goal":"Narrate events with a clear sequence.","grammar":"Link ideas with al principio, después, sin embargo, al final.","tip":"Connectors guide the listener through the story.","write":"Write four sentences about an unexpected event."}},{"id":"b1-6","level":"B1","title":"Entrevistas y trabajo","goal":"Hablar de experiencia y capacidades.","grammar":"Llevar + gerundio; desde hace; experiencia profesional.","tip":"Llevo dos años trabajando destaca duración hasta el presente.","pairs":[{"es":"Llevo tres años trabajando aquí.","en":"I have been working here for three years."},{"es":"Tengo experiencia en ventas.","en":"I have experience in sales."},{"es":"Aprendo con rapidez.","en":"I learn quickly."},{"es":"Estoy disponible por las tardes.","en":"I am available in the afternoons."},{"es":"Llevo dos años trabajando aquí.","en":"I have been working here for two years."},{"es":"Tengo experiencia en atención al cliente.","en":"I have experience in customer service."},{"es":"Busco un puesto a tiempo completo.","en":"I am looking for a full-time job."},{"es":"Me interesa aprender nuevas habilidades.","en":"I am interested in learning new skills."}],"challenge":{"q":"Completa: «Llevo dos años ___ español».","options":["estudio","estudiando","estudié"],"correct":1,"why":"Llevar + duración + gerundio expresa continuidad."},"write":"Redacta una presentación profesional de tres líneas.","model":"Llevo dos años estudiando idiomas. Tengo experiencia en atención al público.","en":{"title":"Work & Interviews","goal":"Describe your experience and abilities.","grammar":"Use llevo + time + gerund and desde hace to describe duration.","tip":"Llevo dos años trabajando highlights an activity continuing until now.","write":"Write a three-line professional introduction."}},{"id":"b2-1","level":"B2","title":"Defender una postura","goal":"Argumentar a favor y en contra.","grammar":"Por un lado / por otro; no obstante; por consiguiente.","tip":"Distingue el argumento de su evidencia.","pairs":[{"es":"Por un lado, ahorra tiempo.","en":"On one hand, it saves time."},{"es":"No obstante, tiene riesgos.","en":"Nevertheless, it has risks."},{"es":"Conviene considerar los datos.","en":"We should consider the data."},{"es":"Por consiguiente, lo revisaremos.","en":"Consequently, we will review it."},{"es":"En mi opinión, la propuesta es viable.","en":"In my opinion, the proposal is feasible."},{"es":"Por consiguiente, debemos actuar.","en":"Consequently, we must act."},{"es":"Conviene considerar otras perspectivas.","en":"It is advisable to consider other perspectives."},{"es":"No obstante, hay ciertos riesgos.","en":"Nevertheless, there are certain risks."}],"challenge":{"q":"¿Qué conector presenta una consecuencia?","options":["no obstante","por consiguiente","en cambio"],"correct":1,"why":"Por consiguiente introduce un resultado o inferencia."},"write":"Argumenta dos ventajas y un inconveniente del teletrabajo.","model":"El teletrabajo ahorra desplazamientos. No obstante, puede dificultar la coordinación.","en":{"title":"Building an Argument","goal":"Present arguments for and against a position.","grammar":"Use por un lado, no obstante, por consiguiente.","tip":"Separate the argument itself from the evidence supporting it.","write":"Give two benefits and one drawback of working from home."}},{"id":"b2-2","level":"B2","title":"Concesión y contraste","goal":"Reconocer objeciones sin abandonar la tesis.","grammar":"Aunque + indicativo/subjuntivo; a pesar de.","tip":"El modo con aunque depende del estatuto informativo y la intención.","pairs":[{"es":"Aunque llueve, saldré.","en":"Although it is raining, I will go out."},{"es":"A pesar del coste, merece la pena.","en":"Despite the cost, it is worth it."},{"es":"Incluso si fallara, aprenderíamos.","en":"Even if it failed, we would learn."},{"es":"Por mucho que insistas, no cambiará.","en":"No matter how much you insist, it will not change."},{"es":"Aunque llueva, iremos.","en":"Even if it rains, we will go."},{"es":"Aunque está cansado, sigue trabajando.","en":"Although he is tired, he keeps working."},{"es":"A pesar de las dificultades, avanzamos.","en":"Despite the difficulties, we are making progress."},{"es":"Por mucho que insistas, no cambiaré de opinión.","en":"No matter how much you insist, I will not change my mind."}],"challenge":{"q":"Completa la hipótesis: «Aunque ___ mañana, iremos».","options":["llueva","llueve ayer","llovió mañana"],"correct":0,"why":"El subjuntivo permite presentar la lluvia como posibilidad futura."},"write":"Formula una objeción y mantén tu conclusión.","model":"Aunque el presupuesto sea limitado, considero que el proyecto es viable.","en":{"title":"Concession & Contrast","goal":"Acknowledge objections without abandoning a thesis.","grammar":"Aunque with indicative/subjunctive, a pesar de, por mucho que.","tip":"Mood after aunque depends on whether the information is presented as known or hypothetical.","write":"Make a concession while maintaining your conclusion."}},{"id":"b2-3","level":"B2","title":"Hipótesis irreales","goal":"Expresar situaciones improbables y consecuencias.","grammar":"Si + imperfecto de subjuntivo + condicional.","tip":"No se combina «si tendría» para esta construcción hipotética estándar.","pairs":[{"es":"Si tuviera tiempo, viajaría.","en":"If I had time, I would travel."},{"es":"Si supiéramos más, decidiríamos.","en":"If we knew more, we would decide."},{"es":"En ese caso, aceptaría.","en":"In that case, I would accept."},{"es":"De ser posible, lo intentaría.","en":"If possible, I would try."},{"es":"Si tuviera tiempo, aprendería italiano.","en":"If I had time, I would learn Italian."},{"es":"Si yo fuera tú, hablaría con ella.","en":"If I were you, I would talk to her."},{"es":"Ojalá pudiéramos viajar más.","en":"I wish we could travel more."},{"es":"En tu lugar, habría esperado.","en":"In your place, I would have waited."}],"challenge":{"q":"Elige la forma estándar: «Si yo ___ más tiempo, estudiaría».","options":["tendría","tuviera","tendré"],"correct":1,"why":"Si introduce una condición irreal con imperfecto de subjuntivo."},"write":"Escribe dos hipótesis sobre tu vida profesional.","model":"Si hablara más idiomas, podría trabajar en otros países.","en":{"title":"Hypothetical Situations","goal":"Discuss unreal or unlikely situations and their outcomes.","grammar":"Si + imperfect subjunctive + conditional: si tuviera, haría.","tip":"Standard unreal hypothetical clauses do not use si tendría.","write":"Write two hypothetical situations about your career."}},{"id":"b2-4","level":"B2","title":"Estilo indirecto","goal":"Transmitir lo que otros dijeron.","grammar":"Dijo que; cambio temporal y deíctico según contexto.","tip":"El cambio de tiempos depende de la relación temporal, no es mecánico.","pairs":[{"es":"Dijo que llegaría tarde.","en":"He said he would be late."},{"es":"Me preguntó si podía ir.","en":"She asked whether I could go."},{"es":"Afirmó que ya lo sabía.","en":"He stated he already knew."},{"es":"Según explicó, fue un error.","en":"As she explained, it was a mistake."},{"es":"Me dijo que llegaría tarde.","en":"He told me he would arrive late."},{"es":"Comentaron que ya habían salido.","en":"They said they had already left."},{"es":"Preguntó si podía entrar.","en":"She asked whether she could come in."},{"es":"Explicó que lo haría al día siguiente.","en":"He explained he would do it the following day."}],"challenge":{"q":"Pasa a indirecto: «Vendré mañana», dijo.","options":["Dijo que vendría al día siguiente.","Dijo que vendré ayer.","Dijo venir mañana yo."],"correct":0,"why":"El futuro puede pasar a condicional y mañana a al día siguiente."},"write":"Resume una noticia que te ha contado un amigo.","model":"Mi amiga explicó que llegaría tarde porque había perdido el autobús.","en":{"title":"Reported Speech","goal":"Report what other people said.","grammar":"Use dijo que, preguntó si, and appropriate tense/time reference changes.","tip":"Backshifting depends on the time relationship; it is not always mechanical.","write":"Summarise news that a friend told you."}},{"id":"b2-5","level":"B2","title":"Analizar una noticia","goal":"Distinguir hechos, interpretaciones y fuentes.","grammar":"Según; al parecer; se afirma que; por otra parte.","tip":"Atribuir afirmaciones evita presentar opiniones como hechos.","pairs":[{"es":"Según el informe, aumentó.","en":"According to the report, it increased."},{"es":"La fuente no está identificada.","en":"The source is not identified."},{"es":"Al parecer, hubo cambios.","en":"Apparently, there were changes."},{"es":"La conclusión es discutible.","en":"The conclusion is debatable."},{"es":"Según el informe, los datos han mejorado.","en":"According to the report, the data have improved."},{"es":"Al parecer, la medida entrará en vigor pronto.","en":"Apparently, the measure will take effect soon."},{"es":"La noticia distingue hechos y opiniones.","en":"The report distinguishes facts and opinions."},{"es":"Conviene contrastar la fuente original.","en":"It is advisable to check the original source."}],"challenge":{"q":"¿Cuál atribuye mejor una afirmación?","options":["Es verdad y punto.","Según el informe, ocurrió.","Todo el mundo lo sabe."],"correct":1,"why":"«Según el informe» identifica el origen de la información."},"write":"Diferencia un hecho comprobable de una interpretación.","model":"El informe registra una subida. Mi interpretación es que faltan datos sobre sus causas.","en":{"title":"Understanding the News","goal":"Separate facts, interpretations and sources.","grammar":"Attribution expressions: según, al parecer, se afirma que.","tip":"Attribute claims to sources rather than presenting interpretations as facts.","write":"Distinguish a verifiable fact from an interpretation."}},{"id":"b2-6","level":"B2","title":"Negociar con cortesía","goal":"Proponer acuerdos, rechazar y reformular.","grammar":"Me gustaría; estaría dispuesto; siempre que + subjuntivo.","tip":"Un acuerdo condicionado suele expresarse con siempre que.","pairs":[{"es":"Estaría dispuesto a revisarlo.","en":"I would be willing to review it."},{"es":"Propongo un plazo mayor.","en":"I propose a longer deadline."},{"es":"Siempre que haya garantías.","en":"Provided that there are guarantees."},{"es":"Podemos alcanzar un acuerdo.","en":"We can reach an agreement."},{"es":"Estaría dispuesto a reconsiderarlo.","en":"I would be willing to reconsider it."},{"es":"Podríamos llegar a un acuerdo.","en":"We could reach an agreement."},{"es":"Siempre que se respeten los plazos.","en":"Provided that the deadlines are respected."},{"es":"¿Le parecería razonable esta propuesta?","en":"Would you consider this proposal reasonable?"}],"challenge":{"q":"Completa: «Acepto, siempre que ___ tiempo».","options":["tenemos","tengamos","tuvimos"],"correct":1,"why":"Siempre que con condición futura requiere subjuntivo."},"write":"Propón un acuerdo y expresa una condición.","model":"Podemos ampliar el plazo, siempre que mantengamos la calidad.","en":{"title":"Negotiating Politely","goal":"Propose, reject and reformulate agreements.","grammar":"Me gustaría, estaría dispuesto, siempre que + subjunctive.","tip":"Use siempre que to introduce many conditional agreements.","write":"Propose an agreement and state one condition."}},{"id":"c1-1","level":"C1","title":"Matices del discurso","goal":"Ajustar la certeza de lo que afirmas.","grammar":"A mi juicio, cabe suponer, difícilmente, de ahí que.","tip":"La modalidad epistémica expresa el grado de compromiso con una proposición.","pairs":[{"es":"Cabe suponer que será difícil.","en":"It may be assumed that it will be difficult."},{"es":"A mi juicio, falta contexto.","en":"In my view, context is missing."},{"es":"No se desprende necesariamente.","en":"It does not necessarily follow."},{"es":"De ahí que sea relevante.","en":"Hence its relevance."},{"es":"Cabe suponer que habrá cambios.","en":"It is reasonable to assume that there will be changes."},{"es":"La evidencia dista de ser concluyente.","en":"The evidence is far from conclusive."},{"es":"De ahí que debamos ser prudentes.","en":"Hence the need for us to be cautious."},{"es":"No necesariamente implica una contradicción.","en":"It does not necessarily imply a contradiction."}],"challenge":{"q":"Completa: «De ahí que ___ necesario revisarlo».","options":["es","sea","será"],"correct":1,"why":"De ahí que introduce consecuencia valorada y lleva subjuntivo."},"write":"Matiza una conclusión demasiado absoluta.","model":"Los datos son limitados; por tanto, no se desprende necesariamente una relación causal.","en":{"title":"Expressing Nuance","goal":"Signal degrees of confidence and certainty.","grammar":"Use a mi juicio, cabe suponer, de ahí que, difícilmente.","tip":"Epistemic modality expresses how strongly a speaker commits to a claim.","write":"Soften an overly absolute conclusion."}},{"id":"c1-2","level":"C1","title":"Registro administrativo","goal":"Redactar solicitudes y respuestas formales.","grammar":"Se solicita que; en relación con; por la presente.","tip":"Adapta fórmulas al destinatario y evita burocratismos innecesarios.","pairs":[{"es":"En relación con su solicitud.","en":"Regarding your request."},{"es":"Le agradecería una respuesta.","en":"I would appreciate a reply."},{"es":"Adjunto la documentación.","en":"I attach the documentation."},{"es":"Quedo a su disposición.","en":"I remain at your disposal."},{"es":"En relación con su solicitud, le informamos de lo siguiente.","en":"With regard to your application, we inform you of the following."},{"es":"Se adjunta la documentación requerida.","en":"The required documentation is attached."},{"es":"Quedamos a su disposición para cualquier aclaración.","en":"We remain at your disposal for any clarification."},{"es":"Le rogamos que confirme la recepción.","en":"We kindly ask you to confirm receipt."}],"challenge":{"q":"¿Qué fórmula es adecuada en un correo formal?","options":["Oye, contesta ya.","Le agradecería una respuesta.","Eh, dime algo."],"correct":1,"why":"La petición condicional mantiene la cortesía profesional."},"write":"Redacta un correo formal pidiendo información.","model":"En relación con la convocatoria, le agradecería información sobre los plazos. Quedo a su disposición.","en":{"title":"Formal Administration","goal":"Write formal requests and responses.","grammar":"Formulae such as se solicita, en relación con, por la presente.","tip":"Adapt the formality to the reader without unnecessary bureaucratic language.","write":"Write a formal email requesting information."}},{"id":"c1-3","level":"C1","title":"Juicio y valoración","goal":"Expresar valoración compleja de hechos.","grammar":"Es significativo que / resulta extraño que + subjuntivo.","tip":"Distingue hecho asumido y valoración del emisor.","pairs":[{"es":"Resulta llamativo que no responda.","en":"It is striking that he does not respond."},{"es":"Es cuestionable que sea suficiente.","en":"It is questionable that it is enough."},{"es":"No cabe descartar esa posibilidad.","en":"That possibility cannot be ruled out."},{"es":"Se trata de un asunto delicado.","en":"It is a delicate matter."},{"es":"Resulta sorprendente que no lo hayan previsto.","en":"It is surprising that they did not foresee it."},{"es":"Es fundamental que se garantice la igualdad.","en":"It is essential that equality be guaranteed."},{"es":"Me alegra que se haya resuelto.","en":"I am glad it has been resolved."},{"es":"No parece probable que ocurra de nuevo.","en":"It does not seem likely to happen again."}],"challenge":{"q":"Completa: «Resulta extraño que no ___».","options":["viene","venga","vendrá"],"correct":1,"why":"La valoración con «resulta extraño que» exige subjuntivo."},"write":"Valora una decisión pública con prudencia lingüística.","model":"Resulta llamativo que no se hayan explicado los criterios de la decisión.","en":{"title":"Advanced Evaluation","goal":"Express complex value judgements.","grammar":"Es significativo que, resulta extraño que + subjunctive.","tip":"Distinguish assumed facts from your evaluation of them.","write":"Evaluate a public decision using cautious language."}},{"id":"c1-4","level":"C1","title":"Ensayo argumentativo","goal":"Articular tesis, contraargumento y síntesis.","grammar":"Con todo; a la luz de; por ende; en última instancia.","tip":"Una tesis defendible requiere razones y límites explícitos.","pairs":[{"es":"A la luz de la evidencia.","en":"In light of the evidence."},{"es":"Con todo, persisten dudas.","en":"Even so, doubts remain."},{"es":"La tesis exige matices.","en":"The thesis requires nuance."},{"es":"En última instancia, importa el contexto.","en":"Ultimately, context matters."},{"es":"A la luz de los resultados, conviene revisar la hipótesis.","en":"In light of the results, the hypothesis should be reviewed."},{"es":"El argumento requiere mayor precisión.","en":"The argument requires greater precision."},{"es":"Con todo, la conclusión sigue siendo válida.","en":"Nevertheless, the conclusion remains valid."},{"es":"En última instancia, depende del contexto.","en":"Ultimately, it depends on the context."}],"challenge":{"q":"¿Qué conector introduce reserva pese a lo dicho?","options":["con todo","por ende","debido a"],"correct":0,"why":"Con todo señala objeción o concesión."},"write":"Escribe una mini tesis y un contraargumento sobre educación.","model":"La práctica autónoma favorece el aprendizaje. Con todo, el acompañamiento sigue siendo importante.","en":{"title":"Argumentative Essays","goal":"Structure a thesis, counterargument and synthesis.","grammar":"Connectors: con todo, a la luz de, por ende, en última instancia.","tip":"A defensible thesis needs reasons and explicit limitations.","write":"Write a short thesis and counterargument about education."}},{"id":"c1-5","level":"C1","title":"Lenguaje figurado","goal":"Interpretar expresiones idiomáticas frecuentes.","grammar":"Sentido literal vs. figurado; adecuación cultural.","tip":"Evita trasladar expresiones idiomáticas palabra por palabra.","pairs":[{"es":"No está el horno para bollos.","en":"It is not a good moment for that."},{"es":"Se fue por las ramas.","en":"He went off on a tangent."},{"es":"Dar en el clavo.","en":"To hit the nail on the head."},{"es":"Tirar la toalla.","en":"To throw in the towel."},{"es":"No tires la toalla todavía.","en":"Do not throw in the towel yet."},{"es":"Estamos entre la espada y la pared.","en":"We are caught between a rock and a hard place."},{"es":"Se quedó con la boca abierta.","en":"He was left speechless."},{"es":"Es una metáfora, no una afirmación literal.","en":"It is a metaphor, not a literal statement."}],"challenge":{"q":"¿Qué significa «irse por las ramas»?","options":["Ir al bosque.","Desviarse del tema.","Llegar a la conclusión."],"correct":1,"why":"La expresión describe apartarse del asunto principal."},"write":"Usa dos expresiones idiomáticas en contexto.","model":"No te vayas por las ramas: has dado en el clavo con la propuesta.","en":{"title":"Idioms & Figurative Language","goal":"Interpret and use common figurative expressions.","grammar":"Notice the difference between literal and figurative meaning.","tip":"Avoid translating idioms word for word between languages.","write":"Use two Spanish idioms in realistic contexts."}},{"id":"c1-6","level":"C1","title":"Sintetizar fuentes","goal":"Integrar diferentes perspectivas y atribuciones.","grammar":"Mientras que; por el contrario; en conjunto; se desprende.","tip":"La síntesis no es mera sucesión de resúmenes.","pairs":[{"es":"Ambas fuentes coinciden parcialmente.","en":"Both sources partially agree."},{"es":"La segunda cuestiona el método.","en":"The second challenges the method."},{"es":"En conjunto, apuntan a un cambio.","en":"Taken together, they point to a change."},{"es":"Los datos no permiten concluirlo.","en":"The data do not allow that conclusion."},{"es":"Ambos autores coinciden en lo esencial.","en":"Both authors agree on the essentials."},{"es":"Por el contrario, el segundo estudio discrepa.","en":"By contrast, the second study disagrees."},{"es":"En conjunto, los datos apuntan a una tendencia.","en":"Taken together, the data point to a trend."},{"es":"No se desprende una relación causal directa.","en":"A direct causal relationship cannot be inferred."}],"challenge":{"q":"¿Qué práctica es una síntesis rigurosa?","options":["Copiar una sola fuente.","Comparar coincidencias y límites.","Eliminar las discrepancias."],"correct":1,"why":"Una síntesis identifica acuerdos, diferencias y límites."},"write":"Compara dos opiniones sobre una medida social.","model":"Ambas opiniones reconocen un problema; difieren, sin embargo, en la solución propuesta.","en":{"title":"Synthesising Sources","goal":"Integrate different perspectives and attributed claims.","grammar":"Compare sources using mientras que, en conjunto, por el contrario.","tip":"A synthesis is more than a chain of unrelated summaries.","write":"Compare two opinions about a social measure."}},{"id":"c2-1","level":"C2","title":"Ironía y presuposición","goal":"Interpretar intenciones pragmáticas indirectas.","grammar":"Ironía contextual; presupuestos; implicaturas.","tip":"La misma frase puede elogiar o reprochar según contexto y entonación.","pairs":[{"es":"¡Qué puntualidad la tuya!","en":"What perfect timing! (possibly ironic)"},{"es":"Se diría que nadie lo sabía.","en":"One might think nobody knew."},{"es":"No deja de ser curioso.","en":"It is rather curious."},{"es":"Por si fuera poco, llegó tarde.","en":"As if that were not enough, he arrived late."},{"es":"Claro, porque eso siempre sale bien.","en":"Of course, because that always works out well."},{"es":"Su silencio podría interpretarse como desacuerdo.","en":"His silence could be interpreted as disagreement."},{"es":"Lo insinuó sin llegar a afirmarlo.","en":"She hinted at it without stating it outright."},{"es":"El sentido depende de la entonación y el contexto.","en":"The meaning depends on intonation and context."}],"challenge":{"q":"En un contexto de retraso, «¡Qué puntualidad!» suele ser…","options":["un elogio literal","una ironía","una orden"],"correct":1,"why":"El contexto activa la interpretación irónica."},"write":"Escribe un comentario irónico y explica su contexto.","model":"Tras una espera de una hora: «¡Qué puntualidad!». Aquí expresa reproche.","en":{"title":"Irony & Implication","goal":"Interpret indirect pragmatic intentions.","grammar":"Irony, presupposition, implicature and context-sensitive interpretation.","tip":"The same sentence can praise or criticise depending on context and tone.","write":"Write an ironic comment and explain its intended context."}},{"id":"c2-2","level":"C2","title":"Variación y adecuación","goal":"Ajustar expresión a países, registros y situaciones.","grammar":"Variación diatópica; registro; cortesía intercultural.","tip":"Una variante no es necesariamente un error: depende de región y contexto.","pairs":[{"es":"¿Me da la cuenta, por favor?","en":"Could I have the bill, please?"},{"es":"¿Me cobras, por favor?","en":"Could you take my payment, please?"},{"es":"El uso varía según la región.","en":"Usage varies by region."},{"es":"Conviene adaptar el registro.","en":"It is advisable to adapt the register."},{"es":"En este contexto, esa fórmula suena demasiado informal.","en":"In this context, that wording sounds too informal."},{"es":"El tratamiento varía según la región.","en":"Forms of address vary by region."},{"es":"Conviene adaptar el registro al interlocutor.","en":"It is advisable to adapt the register to the listener."},{"es":"La misma expresión puede tener distintos matices.","en":"The same expression may have different nuances."}],"challenge":{"q":"¿Qué afirmación es más precisa?","options":["Solo existe un español correcto.","La adecuación depende del contexto.","Todas las variantes son idénticas."],"correct":1,"why":"La variedad geográfica y el registro influyen en la adecuación."},"write":"Explica por qué una variante no debe tratarse como un error.","model":"Una palabra puede ser habitual en un país y poco frecuente en otro sin ser incorrecta.","en":{"title":"Regional & Social Variation","goal":"Adapt language to country, register and situation.","grammar":"Diatopic variation, register and intercultural politeness.","tip":"A regional variant is not automatically an error; context matters.","write":"Explain why a regional expression should not automatically be called wrong."}},{"id":"c2-3","level":"C2","title":"Precisión léxica","goal":"Escoger verbos y colocaciones exactos.","grammar":"Matices léxicos; selección de colocaciones.","tip":"La precisión requiere escoger combinaciones idiomáticas.","pairs":[{"es":"Adoptar una decisión.","en":"To make a decision."},{"es":"Plantear una objeción.","en":"To raise an objection."},{"es":"Suscitar un debate.","en":"To spark a debate."},{"es":"Rebatir un argumento.","en":"To refute an argument."},{"es":"La distinción es sutil, pero relevante.","en":"The distinction is subtle but relevant."},{"es":"El término resulta impreciso en este contexto.","en":"The term is imprecise in this context."},{"es":"Conviene optar por una colocación más natural.","en":"A more natural collocation should be chosen."},{"es":"Su argumento es plausible, no necesariamente probable.","en":"His argument is plausible, not necessarily probable."}],"challenge":{"q":"¿Qué combinación es idiomática?","options":["fabricar una objeción","plantear una objeción","cocinar una objeción"],"correct":1,"why":"Plantear una objeción es una colocación asentada."},"write":"Redacta un párrafo con tres colocaciones precisas.","model":"La medida suscitó un debate; varios expertos plantearon objeciones y rebatieron el argumento.","en":{"title":"Precision of Meaning","goal":"Choose precise terms, verbs and collocations.","grammar":"Lexical nuance and idiomatic word combinations.","tip":"Precision requires natural collocations, not just dictionary-level synonyms.","write":"Write a paragraph using three precise collocations."}},{"id":"c2-4","level":"C2","title":"Ambigüedad y reformulación","goal":"Detectar ambigüedades y reescribir con precisión.","grammar":"Alcance de modificadores; referentes; puntuación.","tip":"Reformular exige preservar el sentido pretendido, no inventar otro.","pairs":[{"es":"La frase admite dos lecturas.","en":"The sentence allows two readings."},{"es":"Conviene precisar el referente.","en":"The referent should be clarified."},{"es":"La ambigüedad es involuntaria.","en":"The ambiguity is unintentional."},{"es":"Es necesario reformularlo.","en":"It needs to be rephrased."},{"es":"La frase admite al menos dos interpretaciones.","en":"The sentence allows at least two interpretations."},{"es":"Conviene precisar a quién se refiere el pronombre.","en":"It is advisable to clarify whom the pronoun refers to."},{"es":"Una coma puede alterar el sentido.","en":"A comma can change the meaning."},{"es":"Reformularlo evitaría la ambigüedad.","en":"Rephrasing it would avoid ambiguity."}],"challenge":{"q":"¿Qué mejora «Vi a Ana con los prismáticos»?","options":["Añadir más adjetivos.","Aclarar quién tenía los prismáticos.","Quitar el verbo."],"correct":1,"why":"Puede ser quien ve o Ana quien tiene los prismáticos."},"write":"Reformula una oración ambigua de dos maneras.","model":"Con mis prismáticos vi a Ana. / Vi a Ana, que llevaba unos prismáticos.","en":{"title":"Ambiguity & Rephrasing","goal":"Identify ambiguity and reformulate accurately.","grammar":"Modifier scope, reference, punctuation and paraphrasing.","tip":"A good reformulation preserves the intended meaning.","write":"Rephrase an ambiguous sentence in two different ways."}},{"id":"c2-5","level":"C2","title":"Retórica y crítica","goal":"Analizar estrategias persuasivas y sesgos.","grammar":"Falacias informales; modalización; ethos, pathos y logos.","tip":"La fuerza retórica no equivale a validez lógica.","pairs":[{"es":"La conclusión no se sigue de las premisas.","en":"The conclusion does not follow from the premises."},{"es":"Apela a la emoción del público.","en":"It appeals to the audience’s emotions."},{"es":"Desplaza la carga de la prueba.","en":"It shifts the burden of proof."},{"es":"La analogía resulta engañosa.","en":"The analogy is misleading."},{"es":"El autor recurre a una falsa dicotomía.","en":"The author resorts to a false dichotomy."},{"es":"El razonamiento incurre en una generalización indebida.","en":"The reasoning makes an unwarranted generalisation."},{"es":"La emoción refuerza la persuasión, no la evidencia.","en":"Emotion strengthens persuasion, not evidence."},{"es":"Se confunde correlación con causalidad.","en":"Correlation is confused with causation."}],"challenge":{"q":"¿Qué indica «desplazar la carga de la prueba»?","options":["Aportar evidencia.","Exigir que otro refute una afirmación no sustentada.","Citar fuentes fiables."],"correct":1,"why":"La carga de justificar una afirmación recae en quien la hace."},"write":"Evalúa una afirmación persuasiva y pide evidencia.","model":"El discurso apela al temor, pero no aporta datos suficientes para justificar la conclusión.","en":{"title":"Rhetoric & Critical Reading","goal":"Analyse persuasion, bias and weak arguments.","grammar":"Informal fallacies, hedging, ethos, pathos and logos.","tip":"Persuasive force is not the same as logical validity.","write":"Assess a persuasive claim and request supporting evidence."}},{"id":"c2-6","level":"C2","title":"Mediación y resumen experto","goal":"Integrar información compleja para otros públicos.","grammar":"Reformulación, condensación y precisión pragmática.","tip":"Mediar implica seleccionar y explicar sin tergiversar.","pairs":[{"es":"A grandes rasgos, el informe concluye.","en":"Broadly speaking, the report concludes."},{"es":"Conviene distinguir dos planos.","en":"It is worth distinguishing two levels."},{"es":"El hallazgo requiere cautela.","en":"The finding calls for caution."},{"es":"Dicho de otro modo, no es concluyente.","en":"In other words, it is not conclusive."},{"es":"Permítame reformular el argumento central.","en":"Allow me to rephrase the central argument."},{"es":"El resumen conserva las reservas del texto original.","en":"The summary preserves the qualifications of the original text."},{"es":"Hay que distinguir el hecho de su interpretación.","en":"The fact must be distinguished from its interpretation."},{"es":"La mediación exige precisión y neutralidad.","en":"Mediation requires precision and neutrality."}],"challenge":{"q":"¿Qué define una buena mediación lingüística?","options":["Reproducir toda la jerga.","Adaptar sin distorsionar.","Eliminar las reservas."],"correct":1,"why":"La mediación traslada el sentido a otro público respetando límites y matices."},"write":"Explica una conclusión técnica para un público general.","model":"El estudio observa una tendencia, pero no demuestra una causa. Por eso el resultado debe interpretarse con cautela.","en":{"title":"Advanced Mediation","goal":"Explain complex information clearly to another audience.","grammar":"Condensation, accurate paraphrase and pragmatic precision.","tip":"Mediation means selecting and explaining without distorting the source.","write":"Explain a technical conclusion for a non-specialist audience."}},{"id":"a1-7","level":"A1","title":"El alfabeto y el deletreo","goal":"Practicar expresiones útiles sobre «el alfabeto y el deletreo».","grammar":"Deletrea nombres y correos electrónicos; practica el nombre de las letras.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"¿Cómo se escribe tu apellido?","en":"How do you spell your surname?"},{"es":"Se escribe con be.","en":"It's spelled with the letter B."},{"es":"¿Puedes deletrearlo, por favor?","en":"Can you spell it, please?"},{"es":"Mi nombre empieza por eme.","en":"My name starts with the letter M."},{"es":"Mi correo lleva una arroba.","en":"My email address contains an at sign."},{"es":"Después va un punto.","en":"Then comes a dot."},{"es":"La hache no suena en «hola».","en":"The letter H is silent in “hola”."},{"es":"Repítelo más despacio, por favor.","en":"Repeat it more slowly, please."}],"challenge":{"q":"¿Qué significa «¿Puedes deletrearlo, por favor?» en inglés?","options":["How do you spell your surname?","It's spelled with the letter B.","Can you spell it, please?"],"correct":2,"why":"¿Puedes deletrearlo, por favor? — Can you spell it, please?"},"write":"Escribe una frase original relacionada con «el alfabeto y el deletreo».","model":"¿Cómo se escribe tu apellido?","en":{"title":"Alphabet and Spelling","goal":"Learn to communicate about alphabet and spelling through practical Spanish sentences.","grammar":"Spell names and email addresses; practise letter names.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about alphabet and spelling. Use the model for inspiration."}},{"id":"a1-8","level":"A1","title":"Países y nacionalidades","goal":"Practicar expresiones útiles sobre «países y nacionalidades».","grammar":"Utiliza ser y los nombres de países para hablar del origen.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Soy de Irlanda.","en":"I'm from Ireland."},{"es":"Ella es española.","en":"She is Spanish."},{"es":"¿Eres de Estados Unidos?","en":"Are you from the United States?"},{"es":"Mi amigo es mexicano.","en":"My friend is Mexican."},{"es":"Somos de diferentes países.","en":"We're from different countries."},{"es":"¿De qué nacionalidad eres?","en":"What nationality are you?"},{"es":"Vivo en España, pero soy canadiense.","en":"I live in Spain, but I'm Canadian."},{"es":"Hablamos español e inglés.","en":"We speak Spanish and English."}],"challenge":{"q":"¿Qué significa «¿Eres de Estados Unidos?» en inglés?","options":["I'm from Ireland.","She is Spanish.","Are you from the United States?"],"correct":2,"why":"¿Eres de Estados Unidos? — Are you from the United States?"},"write":"Escribe una frase original relacionada con «países y nacionalidades».","model":"Soy de Irlanda.","en":{"title":"Countries and Nationalities","goal":"Learn to communicate about countries and nationalities through practical Spanish sentences.","grammar":"Use ser and country names for origin and nationality.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about countries and nationalities. Use the model for inspiration."}},{"id":"a1-9","level":"A1","title":"Español en clase","goal":"Practicar expresiones útiles sobre «español en clase».","grammar":"Pide aclaraciones y nombra objetos del aula.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"No entiendo esta palabra.","en":"I don't understand this word."},{"es":"¿Qué significa «ventana»?","en":"What does “ventana” mean?"},{"es":"¿Puedes hablar más despacio?","en":"Can you speak more slowly?"},{"es":"Abre el libro, por favor.","en":"Open the book, please."},{"es":"Escribe la respuesta aquí.","en":"Write the answer here."},{"es":"¿Cómo se dice «chair» en español?","en":"How do you say “chair” in Spanish?"},{"es":"Tengo una pregunta.","en":"I have a question."},{"es":"¿Puedes repetir la frase?","en":"Can you repeat the sentence?"}],"challenge":{"q":"¿Qué significa «¿Puedes hablar más despacio?» en inglés?","options":["I don't understand this word.","What does “ventana” mean?","Can you speak more slowly?"],"correct":2,"why":"¿Puedes hablar más despacio? — Can you speak more slowly?"},"write":"Escribe una frase original relacionada con «español en clase».","model":"No entiendo esta palabra.","en":{"title":"Classroom Spanish","goal":"Learn to communicate about classroom spanish through practical Spanish sentences.","grammar":"Ask for clarification and name classroom objects.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about classroom spanish. Use the model for inspiration."}},{"id":"a1-10","level":"A1","title":"Días, meses y fechas","goal":"Practicar expresiones útiles sobre «días, meses y fechas».","grammar":"Usa días, meses y fechas con es y estamos a.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Hoy es lunes.","en":"Today is Monday."},{"es":"Mañana es martes.","en":"Tomorrow is Tuesday."},{"es":"Mi cumpleaños es en abril.","en":"My birthday is in April."},{"es":"Estamos a quince de mayo.","en":"It's May fifteenth."},{"es":"El curso empieza en septiembre.","en":"The course starts in September."},{"es":"¿Qué día es hoy?","en":"What day is it today?"},{"es":"Nos vemos el viernes.","en":"See you on Friday."},{"es":"El domingo no trabajo.","en":"I don't work on Sundays."}],"challenge":{"q":"¿Qué significa «Mi cumpleaños es en abril.» en inglés?","options":["Today is Monday.","Tomorrow is Tuesday.","My birthday is in April."],"correct":2,"why":"Mi cumpleaños es en abril. — My birthday is in April."},"write":"Escribe una frase original relacionada con «días, meses y fechas».","model":"Hoy es lunes.","en":{"title":"Days, Months and Dates","goal":"Learn to communicate about days, months and dates through practical Spanish sentences.","grammar":"Use days, months and dates with es and estamos a.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about days, months er solutions."},{"es":"Necesitaría una confirmación por escrito.","en":"I would need written confirmation."},{"es":"Creo que podemos llegar a un acuerdo.","en":"I think we can reach an agreement."}],"challenge":{"q":"¿Qué significa «Entiendo las limitaciones presupuestarias.» en inglés?","options":["I'd like to review the terms of the contract.","We could consider a middle-ground option.","I understand the budget constraints."],"correct":2,"why":"Entiendo las limitaciones presupuestarias. — I understand the budget constraints."},"write":"Escribe una frase original relacionada con «negociaciones laborales».","model":"Me gustaría revisar las condiciones del contrato.","en":{"title":"Workplace Negotiations","goal":"Learn to communicate about workplace negotiations through practical Spanish sentences.","grammar":"Propose conditions and negotiate respectfully.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about workplace negotiations. Use the model for inspiration."}},{"id":"b2-12","level":"B2","title":"Lectura crítica de noticias","goal":"Practicar expresiones útiles sobre «lectura crítica de noticias».","grammar":"Distingue información, pruebas y opiniones.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El titular no refleja todos los matices.","en":"The headline doesn't reflect all the nuances."},{"es":"La fuente no ha sido identificada.","en":"The source hasn't been identified."},{"es":"Según el informe, las cifras son provisionales.","en":"According to the report, the figures are provisional."},{"es":"La noticia mezcla hechos con valoraciones.","en":"The article mixes facts with opinions."},{"es":"No está claro cómo se obtuvo el dato.","en":"It's unclear how the figure was obtained."},{"es":"Conviene contrastar la información con otras fuentes.","en":"It's advisable to cross-check the information against other sources."},{"es":"El artículo omite un contexto relevante.","en":"The article leaves out important context."},{"es":"Esta afirmación requiere pruebas adicionales.","en":"This claim requires further evidence."}],"challenge":{"q":"¿Qué significa «Según el informe, las cifras son provisionales.» en inglés?","options":["The headline doesn't reflect all the nuances.","The source hasn't been identified.","According to the report, the figures are provisional."],"correct":2,"why":"Según el informe, las cifras son provisionales. — According to the report, the figures are provisional."},"write":"Escribe una frase original relacionada con «lectura crítica de noticias».","model":"El titular no refleja todos los matices.","en":{"title":"Media Literacy and Sources","goal":"Learn to communicate about media literacy and sources through practical Spanish sentences.","grammar":"Distinguish reporting, evidence and opinion.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about media literacy and sources. Use the model for inspiration."}},{"id":"b2-13","level":"B2","title":"Resolver problemas en el trabajo","goal":"Practicar expresiones útiles sobre «resolver problemas en el trabajo».","grammar":"Debate soluciones, responsabilidades y resultados.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"El proyecto se ha retrasado por varios motivos.","en":"The project has been delayed for several reasons."},{"es":"Deberíamos identificar la causa principal.","en":"We should identify the main cause."},{"es":"Propongo repartir las tareas de otra manera.","en":"I suggest distributing the tasks differently."},{"es":"Se necesita una solución sostenible.","en":"A sustainable solution is needed."},{"es":"La prioridad consiste en reducir los errores.","en":"The priority is to reduce errors."},{"es":"Hemos evaluado tres alternativas posibles.","en":"We've assessed three possible alternatives."},{"es":"Si no actuamos ahora, el coste aumentará.","en":"If we don't act now, the cost will increase."},{"es":"Acordemos una fecha para revisar los avances.","en":"Let's agree on a date to review progress."}],"challenge":{"q":"¿Qué significa «Propongo repartir las tareas de otra manera.» en inglés?","options":["The project has been delayed for several reasons.","We should identify the main cause.","I suggest distributing the tasks differently."],"correct":2,"why":"Propongo repartir las tareas de otra manera. — I suggest distributing the tasks differently."},"write":"Escribe una frase original relacionada con «resolver problemas en el trabajo».","model":"El proyecto se ha retrasado por varios motivos.","en":{"title":"Problem Solving at Work","goal":"Learn to communicate about problem solving at work through practical Spanish sentences.","grammar":"Discuss solutions, responsibilities and results.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about problem solving at work. Use the model for inspiration."}},{"id":"b2-14","level":"B2","title":"Cine, libros y reseñas","goal":"Practicar expresiones útiles sobre «cine, libros y reseñas».","grammar":"Valora obras culturales con argumentos.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La novela plantea un dilema moral complejo.","en":"The novel presents a complex moral dilemma."},{"es":"La interpretación del protagonista resulta creíble.","en":"The lead actor's performance is believable."},{"es":"Aunque el ritmo es lento, la historia atrapa.","en":"Although the pace is slow, the story is engaging."},{"es":"La película supera las expectativas iniciales.","en":"The film exceeds initial expectations."},{"es":"El desenlace me pareció demasiado previsible.","en":"I found the ending too predictable."},{"es":"La obra destaca por su estilo narrativo.","en":"The work stands out for its narrative style."},{"es":"No comparto la conclusión del crítico.","en":"I don't share the critic's conclusion."},{"es":"Se la recomendaría a quienes disfrutan del suspense.","en":"I'd recommend it to people who enjoy suspense."}],"challenge":{"q":"¿Qué significa «Aunque el ritmo es lento, la historia atrapa.» en inglés?","options":["The novel presents a complex moral dilemma.","The lead actor's performance is believable.","Although the pace is slow, the story is engaging."],"correct":2,"why":"Aunque el ritmo es lento, la historia atrapa. — Although the pace is slow, the story is engaging."},"write":"Escribe una frase original relacionada con «cine, libros y reseñas».","model":"La novela plantea un dilema moral complejo.","en":{"title":"Films, Books and Reviews","goal":"Learn to communicate about films, books and reviews through practical Spanish sentences.","grammar":"Evaluate creative works with justification.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about films, books and reviews. Use the model for inspiration."}},{"id":"b2-15","level":"B2","title":"Oraciones condicionales","goal":"Practicar expresiones útiles sobre «oraciones condicionales».","grammar":"Contrasta condiciones reales e hipotéticas.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Si tengo tiempo, te llamaré.","en":"If I have time, I'll call you."},{"es":"Si pudiera elegir, viviría junto al mar.","en":"If I could choose, I'd live by the sea."},{"es":"De haberlo sabido, habría actuado antes.","en":"Had I known, I would have acted sooner."},{"es":"A menos que llueva, iremos andando.","en":"Unless it rains, we'll walk."},{"es":"Siempre que cumplas el plazo, no habrá problema.","en":"Provided you meet the deadline, there won't be a problem."},{"es":"En caso de que surja un imprevisto, avísame.","en":"If something unexpected comes up, let me know."},{"es":"Si no fuera por tu ayuda, sería imposible.","en":"If it weren't for your help, it would be s advisable to keep a copy of the result."}],"challenge":{"q":"¿Qué significa «Antes de continuar, comprueba los datos.» en inglés?","options":["The first step is to fill in the form.","Once submitted, you'll receive a confirmation receipt.","Before continuing, check the details."],"correct":2,"why":"Antes de continuar, comprueba los datos. — Before continuing, check the details."},"write":"Escribe una frase original relacionada con «explicar procesos».","model":"El primer paso consiste en completar el formulario.","en":{"title":"Explaining Processes","goal":"Learn to communicate about explaining processes through practical Spanish sentences.","grammar":"Sequence complex instructions and clarify procedures.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about explaining processes. Use the model for inspiration."}},{"id":"c1-7","level":"C1","title":"Acuerdo y desacuerdo matizados","goal":"Practicar expresiones útiles sobre «acuerdo y desacuerdo matizados».","grammar":"Matiza el acuerdo y expresa reservas con naturalidad.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Comparto tu diagnóstico, aunque no del todo la solución.","en":"I share your assessment, though not entirely the solution."},{"es":"Coincido en lo esencial, pero discrepo en los detalles.","en":"I agree on the essentials, but disagree on the details."},{"es":"No me atrevería a afirmarlo con tanta rotundidad.","en":"I wouldn't dare state it so categorically."},{"es":"Tu argumento es válido, con ciertas reservas.","en":"Your argument is valid, with some reservations."},{"es":"En líneas generales, me parece acertado.","en":"Broadly speaking, it seems sound to me."},{"es":"No descartaría una interpretación alternativa.","en":"I wouldn't rule out an alternative interpretation."},{"es":"Quizá convenga replantear la pregunta inicial.","en":"Perhaps we should reconsider the original question."},{"es":"Estamos más cerca de lo que parece.","en":"We're closer in our views than it seems."}],"challenge":{"q":"¿Qué significa «No me atrevería a afirmarlo con tanta rotundidad.» en inglés?","options":["I share your assessment, though not entirely the solution.","I agree on the essentials, but disagree on the details.","I wouldn't dare state it so categorically."],"correct":2,"why":"No me atrevería a afirmarlo con tanta rotundidad. — I wouldn't dare state it so categorically."},"write":"Escribe una frase original relacionada con «acuerdo y desacuerdo matizados».","model":"Comparto tu diagnóstico, aunque no del todo la solución.","en":{"title":"Subtle Agreement and Disagreement","goal":"Learn to communicate about subtle agreement and disagreement through practical Spanish sentences.","grammar":"Qualify agreement and express reservations naturally.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about subtle agreement and disagreement. Use the model for inspiration."}},{"id":"c1-8","level":"C1","title":"Causalidad y responsabilidad","goal":"Practicar expresiones útiles sobre «causalidad y responsabilidad».","grammar":"Distingue coincidencia, causa y atribución.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La correlación no implica necesariamente causalidad.","en":"Correlation does not necessarily imply causation."},{"es":"El descenso podría atribuirse a varios factores.","en":"The decline could be attributed to several factors."},{"es":"No cabe responsabilizar a una sola persona.","en":"Responsibility cannot be placed on just one person."},{"es":"La decisión desencadenó consecuencias imprevistas.","en":"The decision triggered unforeseen consequences."},{"es":"El efecto se amplificó con el paso del tiempo.","en":"The effect intensified over time."},{"es":"Sería precipitado sacar conclusiones definitivas.","en":"It would be premature to draw definitive conclusions."},{"es":"Los antecedentes ayudan a entender el conflicto.","en":"The background helps explain the conflict."},{"es":"La responsabilidad debe evaluarse caso por caso.","en":"Responsibility must be assessed case by case."}],"challenge":{"q":"¿Qué significa «No cabe responsabilizar a una sola persona.» en inglés?","options":["Correlation does not necessarily imply causation.","The decline could be attributed to several factors.","Responsibility cannot be placed on just one person."],"correct":2,"why":"No cabe responsabilizar a una sola persona. — Responsibility cannot be placed on just one person."},"write":"Escribe una frase original relacionada con «causalidad y responsabilidad».","model":"La correlación no implica necesariamente causalidad.","en":{"title":"Cause, Effect and Responsibility","goal":"Learn to communicate about cause, effect and responsibility through practical Spanish sentences.","grammar":"Distinguish coincidence, cause and attribution.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about cause, effect and responsibility. Use the model for inspiration."}},{"id":"c1-9","level":"C1","title":"Diplomacia profesional","goal":"Practicar expresiones útiles sobre «diplomacia profesional».","grammar":"Suaviza el desacuerdo y mantén una relación formal.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"Agradecemos sus observaciones y tomamos nota de ellas.","en":"We appreciate your comments and have taken note of them."},{"es":"Permítame puntualizar un aspecto de la propuesta.","en":"Allow me to clarify one aspect of the proposal."},{"es":"Tal vez resulte oportuno posponer la decisión.","en":"It might be advisable to postpone the decision."},{"es":"Entendemos su preocupación al respecto.","en":"We understand your concern about this."},{"es":"Sin ánimo de cuestionar su criterio, discrepo.","en":"Without wishing to question your judgement, I disagree."},{"es":"Le propongo abordar el asunto en otra reunión.","en":"I suggest we address the matter in another meeting."},{"es":"Confiamos en alcanzar una solución satisfactoria.","en":"We trust we can reach a satisfactory solution."},{"es":"Quedamos abiertos a cualquier comentario adicional.","en":"We remain open to any further comments."}],"challenge":{"q":"¿Qué significa «Tal vez resulte oportuno posponer la decisión.» en inglés?","options":["We appreciate your comments and have taken note of them.","Allow me to clarify one aspect of the proposal.","It might be advisable to postpone the decision."],"correct":2,"why":"Tal vez resulte oportuno posponer la decisión. — It might be advisable to postpone the decision."},"write":"Escribe una frase original relacionada con «diplomacia profesional».","model":"Agradecemos sus observaciones y tomamos nota de ellas.","en":{"title":"Professional Diplomacy","goal":"Learn to communicate about professional diplomacy through practical Spanish sentences.","grammar":"Soften disagreement and maintain a formal relationship.","tip":"Listen, repeat, then use each expression in a sentence of your own.","write":"Write one original Spanish sentence about professional diplomacy. Use the model for inspiration."}},{"id":"c1-10","level":"C1","title":"Opiniones complejas y pruebas","goal":"Practicar expresiones útiles sobre «opiniones complejas y pruebas».","grammar":"Separa afirmaciones, inferencias y valoraciones.","tip":"Escucha cada frase, repítela y utilízala en una situación propia.","pairs":[{"es":"La evidencia disponible respalda parcialmente la hipótesis.","en":"The available evidence partly supports the hypothesis."},{"es":"No todos los indicios tienen el mismo peso.","en":"Not all indications carry the same weight."},{"es":"Conviene diferenciar entre dato e interpretación.","en":"It is worth distinguishing between data and interpretation."},{"es":"La conclusión depende de cómo se defina el problema.","en":"The conclusion
